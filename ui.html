<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    font: 12px/1.45 Inter, -apple-system, system-ui, sans-serif;
    color: var(--figma-color-text, #1e1e1e);
    background: var(--figma-color-bg, #fff);
  }
  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
    height: 100%;
    padding: 16px;
    background: var(--figma-color-bg, #fff);
  }
  h1 { margin: 0; font-size: 13px; font-weight: 600; }
  .muted { margin: 2px 0 0; color: var(--figma-color-text-secondary, #757575); }
  .drop {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
  }
  textarea {
    flex: 1;
    resize: none;
    padding: 10px;
    border: 1px solid var(--figma-color-border, #e6e6e6);
    border-radius: 6px;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: inherit;
    background: var(--figma-color-bg-secondary, #f5f5f5);
    outline: none;
  }
  textarea:focus { border-color: var(--figma-color-border-selected, #0d99ff); }
  .drop-hint {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    border: 2px dashed var(--figma-color-border-brand-strong, #0d99ff);
    border-radius: 6px;
    font-weight: 600;
    color: var(--figma-color-text-brand, #0d99ff);
    background: var(--figma-color-bg-brand-tertiary, rgba(13, 153, 255, .08));
    pointer-events: none;
  }
  body.dragging .drop-hint { display: flex; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row > .grow { flex: 1; min-width: 0; }
  .filename { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--figma-color-text-secondary, #757575); }
  select, input[type="number"] {
    height: 28px;
    padding: 0 8px;
    border: 1px solid var(--figma-color-border, #e6e6e6);
    border-radius: 5px;
    font: inherit;
    color: inherit;
    background: var(--figma-color-bg, #fff);
  }
  input[type="number"] { width: 84px; }
  label.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  label.check input { margin: 0; accent-color: var(--figma-color-bg-brand, #0d99ff); }
  .hint { color: var(--figma-color-text-tertiary, #b3b3b3); }
  button {
    height: 32px;
    padding: 0 14px;
    border-radius: 6px;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  button.primary {
    border: 0;
    color: var(--figma-color-text-onbrand, #fff);
    background: var(--figma-color-bg-brand, #0d99ff);
  }
  button.primary:hover { background: var(--figma-color-bg-brand-hover, #0a86e0); }
  button.secondary {
    border: 1px solid var(--figma-color-border, #e6e6e6);
    color: inherit;
    background: transparent;
  }
  button:disabled { opacity: .5; cursor: default; }
  #status { min-height: 18px; color: var(--figma-color-text-secondary, #757575); }
  #status.error { color: var(--figma-color-text-danger, #f24822); }
  #status.ok { color: var(--figma-color-text-success, #14ae5c); }
  #status.warn { color: var(--figma-color-text-warning, #b86200); }
  /* The page being imported renders here, under the UI. It is scaled to fit
     the plugin window so scroll-triggered effects inside it still fire. */
  #stage {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 0;
    border: 0;
    transform-origin: 0 0;
    pointer-events: none;
    background: #fff;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>HTML → Figma</h1>
    <p class="muted">Вставь HTML или перетащи .html файл — получишь редактируемые слои.</p>
  </header>

  <div class="drop">
    <textarea id="html" spellcheck="false" placeholder="<!doctype html>&#10;<html>…</html>"></textarea>
    <div class="drop-hint">Отпусти файл</div>
  </div>

  <div class="row">
    <button id="open" class="secondary">Открыть файл…</button>
    <span id="filename" class="filename grow"></span>
    <input id="file" type="file" accept=".html,.htm,text/html" hidden>
  </div>

  <div class="row">
    <span>Ширина</span>
    <select id="preset" class="grow">
      <option value="desktop">Десктоп · 1440</option>
      <option value="laptop">Ноутбук · 1280</option>
      <option value="tablet">Планшет · 768</option>
      <option value="mobile">Телефон · 390</option>
      <option value="custom">Своя…</option>
    </select>
    <input id="width" type="number" min="200" max="4000" step="10" value="1440" hidden>
  </div>

  <label class="check"><input id="autolayout" type="checkbox" checked> Auto Layout там, где получится</label>
  <label class="check"><input id="images" type="checkbox" checked> Загружать картинки</label>

  <div class="row">
    <button id="go" class="primary grow">Импортировать</button>
  </div>
  <div id="status"><span class="hint">⌘/Ctrl + Enter — импорт</span></div>
</main>

<script>
// The page agent. Its source is injected into the iframe that renders the
// imported HTML and runs there: Figma's plugin UI is sandboxed, so it can't
// read the iframe's DOM from outside. The agent measures the page and posts
// the finished layer tree back to the UI.
function pageAgent() {
// prepareHtml() puts the agent at the very top of <head>; never run twice.
if (window.__h2fAgent) return;
window.__h2fAgent = true;
const SKIP_TAGS = new Set(['SCRIPT', 'STYLE', 'LINK', 'META', 'HEAD', 'TITLE', 'NOSCRIPT', 'TEMPLATE', 'BASE', 'WBR']);
const ATOMIC_TAGS = new Set(['IMG', 'SVG', 'VIDEO', 'CANVAS', 'IFRAME', 'INPUT', 'TEXTAREA', 'SELECT', 'BUTTON', 'OBJECT', 'EMBED', 'PICTURE', 'AUDIO']);
const ALIGN = { left: 'LEFT', start: 'LEFT', '-webkit-left': 'LEFT', right: 'RIGHT', end: 'RIGHT', '-webkit-right': 'RIGHT', center: 'CENTER', '-webkit-center': 'CENTER', justify: 'JUSTIFIED' };
const TEXT_CASE = { uppercase: 'UPPER', lowercase: 'LOWER', capitalize: 'TITLE' };
const FIT_MODES = { contain: 'FIT', 'scale-down': 'FIT' };
const SIDES = ['Top', 'Right', 'Bottom', 'Left'];
const SHAPE_PROPS = ['fill', 'fill-opacity', 'fill-rule', 'clip-rule', 'stroke', 'stroke-width', 'stroke-opacity', 'stroke-linecap', 'stroke-linejoin', 'stroke-dasharray', 'opacity'];
const STOP_PROPS = ['stop-color', 'stop-opacity'];
const PLACEHOLDER_FILL = { type: 'SOLID', color: { r: 0.86, g: 0.86, b: 0.88 }, opacity: 1 };
// Finish CSS animations instantly so elements are caught in their final state.
const KILL_MOTION = '*,*::before,*::after{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:0s!important;transition-delay:0s!important}html{scroll-behavior:auto!important}';

// The agent's own timers and fetches must not count as "the page is still busy".
const _setTimeout = window.setTimeout.bind(window);
const _clearTimeout = window.clearTimeout.bind(window);
const _fetch = window.fetch ? window.fetch.bind(window) : null;
const sleep = (ms) => new Promise((r) => _setTimeout(r, ms));
const r2 = (v) => Math.round(v * 100) / 100;
const clamp01 = (v) => Math.min(1, Math.max(0, v));

const S = { win: window, doc: document, opts: null, images: new Map(), css: new WeakMap(), deco: new Map() };

const motion = document.createElement('style');
motion.textContent = KILL_MOTION;
(document.head || document.documentElement).appendChild(motion);

const send = (msg) => parent.postMessage(Object.assign({ h2f: true }, msg), '*');

// Pending async work of the page (SPAs render after fetch / setTimeout), tracked
// from the top of <head> so that settle() can wait until the DOM stops changing.
const PEND = { net: 0, timers: new Set(), depth: 0, lastMut: performance.now() };
(function track() {
  try {
    const st = window.setTimeout, ct = window.clearTimeout;
    window.setTimeout = function (fn, ms) {
      const d = +ms || 0;
      if (typeof fn !== 'function' || d < 50 || d > 5000) return st.apply(window, arguments);
      const rest = [].slice.call(arguments, 2);
      let id;
      const wrapped = function () {
        PEND.timers.delete(id);
        PEND.depth++;
        try { return fn.apply(this, arguments); } finally { PEND.depth--; }
      };
      id = st.apply(window, [wrapped, d].concat(rest));
      // Chains (a timer scheduling the next one: carousels, typewriters) never end.
      if (!PEND.depth) PEND.timers.add(id);
      return id;
    };
    window.clearTimeout = function (id) { PEND.timers.delete(id); return ct.apply(window, arguments); };
  } catch (e) {}
  try {
    if (window.fetch) {
      const f = window.fetch;
      window.fetch = function () {
        PEND.net++;
        let p;
        try { p = f.apply(window, arguments); } catch (e) { PEND.net--; throw e; }
        const dec = () => { PEND.net--; };
        Promise.resolve(p).then(dec, dec);
        return p;
      };
    }
  } catch (e) {}
  try {
    const xs = XMLHttpRequest.prototype.send;
    XMLHttpRequest.prototype.send = function () {
      let open = true;
      const end = () => { if (open) { open = false; PEND.net--; } };
      PEND.net++;
      this.addEventListener('loadend', end);
      try { return xs.apply(this, arguments); } catch (e) { end(); throw e; }
    };
  } catch (e) {}
  try {
    new MutationObserver(() => { PEND.lastMut = performance.now(); })
      .observe(document.documentElement, { subtree: true, childList: true, attributes: true, characterData: true });
  } catch (e) {}
})();

addEventListener('message', async (e) => {
  if (e.source !== parent || !e.data || e.data.h2f !== 'extract') return;
  send({ kind: 'ack' });
  try {
    const opts = e.data.opts;
    const warnings = [];
    send({ kind: 'progress', text: 'Жду, пока страница догрузится…' });
    try { if (!(await tailwindOk())) warnings.push('tailwind'); } catch (err) {}
    try { forceLightScheme(); } catch (err) {}
    await settle();
    // Scroll through the page so lazy images and "reveal on scroll" scripts fire.
    const total = docHeight();
    for (let y = 0; y < total; y += opts.height * 0.75) {
      scrollTo(0, y);
      await sleep(40);
    }
    scrollTo(0, 0);
    await settle();

    send({ kind: 'progress', text: 'Разбираю вёрстку…' });
    const root = extract(opts);
    const list = [...S.images.values()];
    if (list.length) await loadImages(list, (i, n) => send({ kind: 'progress', text: `Загружаю картинки ${i}/${n}…` }));
    const images = list.map((it) => ({ ref: it.ref, url: /^https?:/i.test(it.url) ? it.url : null, bytes: it.bytes || null, slow: it.slow || undefined }));
    send({ kind: 'result', root, images, warnings });
  } catch (err) {
    send({ kind: 'error', message: String((err && err.message) || err) });
  }
});
send({ kind: 'ready' });

// Resolves once the page has had no pending fetch/XHR/short timer and no DOM
// mutation for a moment (or when the time budget runs out: some pages never rest).
async function quiet(ms) {
  const end = performance.now() + ms;
  while (performance.now() < end) {
    const busy = PEND.net > 0 || PEND.timers.size > 0 || document.querySelector('[aria-busy="true"]');
    if (!busy && performance.now() - PEND.lastMut > 400) return;
    await sleep(50);
  }
}

async function settle() {
  await quiet(8000);
  try { await Promise.race([document.fonts.ready, sleep(5000)]); } catch (e) {}
  const pending = [...document.images].filter((i) => !i.complete).map((i) => new Promise((r) => {
    i.addEventListener('load', r, { once: true });
    i.addEventListener('error', r, { once: true });
  }));
  await Promise.race([Promise.all(pending), sleep(8000)]);
  await sleep(300);
}

// The Tailwind CDN compiles utilities at runtime; when it failed to load the page
// is silently unstyled, so check that a utility class actually took effect.
async function tailwindOk() {
  const uses = [...document.scripts].some((s) => /tailwind/i.test(s.src)) || document.querySelector('style[type="text/tailwindcss"]');
  if (!uses || !document.body) return true;
  const probe = document.createElement('div');
  probe.className = 'hidden';
  document.body.appendChild(probe);
  let ok = false;
  for (let t = 0; t < 8000; t += 100) {
    if (getComputedStyle(probe).display === 'none') { ok = true; break; }
    await sleep(100);
  }
  probe.remove();
  return ok;
}

// The UI asks for a light stage; if the engine ignored that, neutralise the
// page's prefers-color-scheme: dark rules so the import doesn't follow the OS theme.
function forceLightScheme() {
  if (!matchMedia('(prefers-color-scheme: dark)').matches) return;
  const fix = (t) => t.replace(/\(\s*prefers-color-scheme\s*:\s*dark\s*\)/gi, '(max-width: 0px)')
    .replace(/\(\s*prefers-color-scheme\s*:\s*light\s*\)/gi, '(min-width: 0px)');
  const walkRules = (rules) => {
    for (const r of rules) {
      try {
        if (r.media && /prefers-color-scheme/i.test(r.media.mediaText)) r.media.mediaText = fix(r.media.mediaText);
        if (r.cssRules) walkRules(r.cssRules);
      } catch (e) {}
    }
  };
  for (const sh of document.styleSheets) {
    try { walkRules(sh.cssRules); } catch (e) { /* cross-origin sheet */ }
  }
  for (const el of document.querySelectorAll('link[media], source[media], style[media]')) {
    const m = el.getAttribute('media');
    if (/prefers-color-scheme/i.test(m)) el.setAttribute('media', fix(m));
  }
}

function docHeight() {
  return Math.max(document.documentElement.scrollHeight, document.body ? document.body.scrollHeight : 0);
}

// ---------- extraction ----------

function css(el, pseudo) {
  if (pseudo) return S.win.getComputedStyle(el, pseudo);
  let c = S.css.get(el);
  if (!c) {
    c = S.win.getComputedStyle(el);
    S.css.set(el, c);
  }
  return c;
}

function extract(opts) {
  S.opts = opts;
  S.images = new Map();
  S.css = new WeakMap();
  S.deco = new Map();
  const d = S.doc;
  const body = d.body;
  const W = opts.width;
  const H = docHeight();
  const box = { x: 0, y: 0, w: W, h: H };
  const htmlCS = css(d.documentElement);
  const bodyCS = css(body);

  // Like the browser: html background paints the canvas, otherwise body's does.
  let fills = backgroundFills(htmlCS, box);
  let children;
  if (fills.length && hasPaint(bodyCS)) {
    children = walk(body, 0, 0);
  } else {
    if (!fills.length) fills = backgroundFills(bodyCS, box);
    children = childrenOf(body, 0, 0);
  }
  if (!fills.length) fills = [solid({ r: 1, g: 1, b: 1, a: 1 })];

  const title = (d.title || '').trim() || 'HTML';
  const root = { type: 'FRAME', name: `${title} · ${W}px`, x: 0, y: 0, w: W, h: H, fills, clip: true, children };
  tryAutoLayout(root, bodyCS);
  return root;
}

function childrenOf(el, ox, oy) {
  const out = [];
  const closed = inClosedDetails(el);
  for (const c of el.childNodes) {
    // One broken element must never cost the whole import.
    try {
      if (c.nodeType === 3) {
        if (closed) continue;
        for (const t of [].concat(looseText(c, el, ox, oy) || [])) out.push(t);
      } else if (c.nodeType === 1) {
        for (const n of walk(c, ox, oy)) out.push(n);
      }
    } catch (e) {
      console.warn('html-to-figma: skipped a node', e);
    }
  }
  return out;
}

// Returns the layers for one element (0, 1 or several when a wrapper is lifted),
// positioned relative to (ox, oy) — the parent layer's top-left in page coordinates.
function walk(el, ox, oy) {
  const tag = el.tagName.toUpperCase();
  if (SKIP_TAGS.has(tag) || tag === 'BR') return [];
  const cs = css(el);
  if (cs.display === 'none') return [];
  if (cs.display === 'contents') return childrenOf(el, ox, oy);
  if (cs.visibility !== 'visible') return [];
  const opacity = parseFloat(cs.opacity);
  if (opacity === 0) return [];
  if (hiddenByEngine(el, cs)) return [];

  const rect = el.getBoundingClientRect();
  if (isVisuallyHidden(cs, rect)) return [];
  const box = { x: r2(rect.left - ox), y: r2(rect.top - oy), w: r2(rect.width), h: r2(rect.height) };
  const common = {
    absolute: cs.position === 'absolute' || cs.position === 'fixed',
    opacity: opacity < 1 ? r2(opacity) : undefined,
  };
  const leaf = (node) => (node && box.w > 0 && box.h > 0 ? [Object.assign(node, common)] : []);

  switch (tag) {
    case 'IMG': return leaf(imageNode(el, cs, box));
    case 'SVG': return leaf(svgNode(el, box));
    case 'CANVAS': return leaf(canvasNode(el, cs, box));
    case 'VIDEO': return leaf(videoNode(el, cs, box));
    case 'IFRAME': case 'OBJECT': case 'EMBED': case 'AUDIO':
      return leaf({ type: 'RECT', name: tag.toLowerCase(), ...box, fills: [PLACEHOLDER_FILL] });
    case 'INPUT': case 'TEXTAREA': case 'SELECT': return leaf(formNode(el, cs, box, rect, tag));
  }

  const visual = boxVisual(el, cs, box);

  if (isTextBlock(el)) {
    const painted = S.inlinePaint;
    const t = blockText(el, cs, painted);
    if (Array.isArray(t)) {
      // A wrapping inline element split into first line + rest.
      t.forEach((k) => { shift(k, ox, oy); Object.assign(k, common); });
      return t;
    }
    if (t) {
      const boxes = painted ? inlineBoxes(painted) : [];
      const clipped = visual.clip && t.overflowsBox;
      delete t.overflowsBox;
      if (!visual.has && !clipped && !boxes.length) {
        shift(t, ox, oy);
        return [Object.assign(t, common)];
      }
      shift(t, rect.left, rect.top);
      boxes.forEach((b) => shift(b, rect.left, rect.top));
      const f = frameNode(el, box, visual, common, boxes.concat([t]));
      tryAutoLayout(f, cs);
      return [f];
    }
  }

  // A collapsed wrapper (e.g. a 0×0 positioned container): lift its children.
  if (box.w < 0.5 || box.h < 0.5) {
    if (visual.clip) return [];
    const kids = childrenOf(el, ox, oy);
    if (common.absolute) kids.forEach((k) => { k.absolute = true; });
    return kids;
  }

  const kids = childrenOf(el, rect.left, rect.top);
  const overflows = kids.some((k) => k.x < -0.5 || k.y < -0.5 || k.x + k.w > box.w + 0.5 || k.y + k.h > box.h + 0.5);
  const plain = !visual.has && !(visual.clip && overflows) && common.opacity === undefined;
  if (plain && !kids.length) return [];
  if (plain && kids.length === 1) {
    // A wrapper that draws nothing adds no information — keep just its child.
    const k = kids[0];
    k.x = r2(k.x + box.x);
    k.y = r2(k.y + box.y);
    if (common.absolute) k.absolute = true;
    return [k];
  }
  const f = frameNode(el, box, visual, common, kids);
  tryAutoLayout(f, cs);
  return [f];
}

// Content the engine doesn't paint although its own style says it's visible:
// closed <details> (::details-content is content-visibility:hidden), hidden=until-found.
function hiddenByEngine(el, cs) {
  if (cs.display === 'contents') return false; // no box: decided per child
  try { if (el.checkVisibility) return !el.checkVisibility(); } catch (e) {}
  for (let a = el.parentElement; a; a = a.parentElement) {
    if (a.tagName === 'DETAILS' && !a.open) {
      const s = [...a.children].find((c) => c.tagName === 'SUMMARY');
      if (!s || !(s === el || s.contains(el))) return true;
    }
  }
  return false;
}

// Loose text directly in a closed <details> always goes to the hidden slot.
function inClosedDetails(el) {
  for (let e = el; e && e.nodeType === 1; e = e.parentElement) {
    if (e.tagName === 'DETAILS') return !e.open;
    if (css(e).display !== 'contents') return false;
  }
  return false;
}

// sr-only / visually-hidden: present for screen readers, invisible on screen.
function isVisuallyHidden(cs, rect) {
  const pos = cs.position === 'absolute' || cs.position === 'fixed';
  if (pos && cs.clip && cs.clip !== 'auto') {
    const m = /rect\(([^)]*)\)/.exec(cs.clip);
    if (m) {
      const v = m[1].split(/[\s,]+/).filter(Boolean).map((s) => (s === 'auto' ? null : parseFloat(s)));
      const top = v[0] == null ? -Infinity : v[0], right = v[1] == null ? Infinity : v[1];
      const bottom = v[2] == null ? Infinity : v[2], left = v[3] == null ? -Infinity : v[3];
      if (bottom - top <= 1 || right - left <= 1) return true;
    }
  }
  const ip = /^inset\(\s*([^)]*?)\s*\)$/.exec((cs.clipPath || '').replace(/\s+round\s[^)]*\)$/, ')'));
  if (ip) {
    const p = ip[1].split(/\s+/).map((s) => (/%$/.test(s) ? parseFloat(s) : NaN));
    const t = p[0], r = p.length > 1 ? p[1] : t, b = p.length > 2 ? p[2] : t, l = p.length > 3 ? p[3] : r;
    if (t + b >= 100 || l + r >= 100) return true; // NaN (non-% values) never passes
  }
  return rect.width <= 1.01 && rect.height <= 1.01 && (cs.overflowX !== 'visible' || cs.overflowY !== 'visible');
}

function shift(node, ox, oy) {
  node.x = r2(node.x - ox);
  node.y = r2(node.y - oy);
}

function frameNode(el, box, visual, common, children) {
  return {
    type: 'FRAME', name: nameFor(el), ...box,
    fills: visual.fills, stroke: visual.stroke, radii: visual.radii, effects: visual.effects, clip: visual.clip,
    absolute: common.absolute, opacity: common.opacity, children,
  };
}

function nameFor(el) {
  const tag = el.tagName.toLowerCase();
  const label = el.getAttribute('aria-label') || el.id;
  if (label) return `${tag} · ${label}`.slice(0, 60);
  const cls = (el.getAttribute('class') || '').trim().split(/\s+/)[0];
  return cls ? `${tag}.${cls}`.slice(0, 60) : tag;
}

// ---------- box styles ----------

function boxVisual(el, cs, box) {
  const fills = backgroundFills(cs, box);
  const stroke = borders(cs);
  const effects = parseShadows(cs.boxShadow);
  const blur = (s) => { const m = /blur\(\s*([\d.]+)px/.exec(s || ''); return m ? parseFloat(m[1]) : 0; };
  // Figma's blur radius is roughly twice the CSS one.
  const layerBlur = blur(cs.filter);
  if (layerBlur) effects.push({ type: 'LAYER_BLUR', radius: layerBlur * 2, visible: true });
  const bgBlur = blur(cs.backdropFilter || cs.webkitBackdropFilter);
  if (bgBlur) effects.push({ type: 'BACKGROUND_BLUR', radius: bgBlur * 2, visible: true });
  const clip = [cs.overflowX, cs.overflowY].some((o) => o !== 'visible');
  return { fills, stroke, radii: radii(cs, box), effects, clip, has: !!(fills.length || stroke || effects.length) };
}

// Cheap version of boxVisual for "does this inline element draw a box?".
function hasPaint(cs) {
  const clipText = cs.webkitBackgroundClip === 'text' || cs.backgroundClip === 'text';
  if (!clipText) {
    const c = parseColor(cs.backgroundColor);
    if ((c && c.a > 0) || cs.backgroundImage !== 'none') return true;
  }
  return !!borders(cs) || parseShadows(cs.boxShadow).length > 0;
}

function backgroundFills(cs, box) {
  const fills = [];
  if (cs.webkitBackgroundClip === 'text' || cs.backgroundClip === 'text') return fills;
  const c = parseColor(cs.backgroundColor);
  if (c && c.a > 0) fills.push(solid(c));
  if (cs.backgroundImage && cs.backgroundImage !== 'none') {
    const layers = splitTop(cs.backgroundImage);
    const sizes = splitTop(cs.backgroundSize || '');
    // CSS lists the top layer first, Figma wants it last.
    for (let i = layers.length - 1; i >= 0; i--) {
      const layer = layers[i].trim();
      const url = /^url\(\s*["']?(.*?)["']?\s*\)$/.exec(layer);
      if (url) {
        if (S.opts.images) fills.push({ type: 'IMAGE', ref: imageRef(url[1], null), scaleMode: /contain/.test(sizes[i] || '') ? 'FIT' : 'FILL' });
      } else {
        const g = gradientPaint(layer, box.w, box.h);
        if (g) fills.push(g);
      }
    }
  }
  return fills;
}

function borders(cs) {
  const weights = {};
  let paint = null;
  let style = null;
  for (const s of SIDES) {
    let w = parseFloat(cs[`border${s}Width`]) || 0;
    const st = cs[`border${s}Style`];
    const col = parseColor(cs[`border${s}Color`]);
    if (st === 'none' || st === 'hidden' || !col || col.a === 0) w = 0;
    if (w > 0 && !paint) {
      paint = solid(col);
      style = st;
    }
    weights[s[0].toLowerCase()] = r2(w);
  }
  if (!paint) return null;
  const max = Math.max(weights.t, weights.r, weights.b, weights.l);
  const dash = style === 'dashed' ? [max * 3, max * 2] : style === 'dotted' ? [max, max] : null;
  return { paint, weights, dash };
}

function radii(cs, box) {
  const limit = Math.min(box.w, box.h) / 2;
  const one = (v) => {
    const first = (v || '0').split(' ')[0];
    const px = first.endsWith('%') ? parseFloat(first) / 100 * Math.min(box.w, box.h) : parseFloat(first) || 0;
    return r2(Math.min(px, limit));
  };
  const r = {
    tl: one(cs.borderTopLeftRadius), tr: one(cs.borderTopRightRadius),
    br: one(cs.borderBottomRightRadius), bl: one(cs.borderBottomLeftRadius),
  };
  return r.tl || r.tr || r.br || r.bl ? r : null;
}

function parseShadows(str) {
  if (!str || str === 'none') return [];
  const out = [];
  for (const part of splitTop(str)) {
    let s = part.trim();
    const inset = /\binset\b/.test(s);
    s = s.replace(/\binset\b/, ' ');
    const cm = /(?:rgba?|hsla?|hwb|lab|lch|oklab|oklch|color)\([^)]*\)|#[0-9a-f]{3,8}\b/i.exec(s);
    const color = parseColor(cm ? cm[0] : 'rgb(0, 0, 0)');
    const nums = ((cm ? s.replace(cm[0], ' ') : s).match(/-?[\d.]+(?=px|\s|$)/g) || []).map(parseFloat);
    if (!color || color.a === 0 || nums.length < 2) continue;
    const [x, y, blur = 0, spread = 0] = nums;
    if (!x && !y && !blur && !spread) continue;
    const e = {
      type: inset ? 'INNER_SHADOW' : 'DROP_SHADOW',
      color: { r: color.r, g: color.g, b: color.b, a: color.a },
      offset: { x, y }, radius: Math.max(0, blur), spread, visible: true, blendMode: 'NORMAL',
    };
    if (!inset) e.showShadowBehindNode = false;
    out.push(e);
  }
  return out.reverse();
}

// ---------- colors & gradients ----------

let colorCtx = null;
const colorCache = new Map();

function parseColor(str) {
  if (!str || str === 'transparent' || str === 'none') return null;
  const m = /^rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:\s*[,/]\s*([\d.]+)(%?))?\s*\)$/.exec(str);
  if (m) {
    const a = m[4] == null ? 1 : m[5] ? parseFloat(m[4]) / 100 : parseFloat(m[4]);
    return { r: +m[1] / 255, g: +m[2] / 255, b: +m[3] / 255, a };
  }
  // Anything else (oklch, color(), hsl…) goes through canvas, which normalizes to sRGB.
  if (colorCache.has(str)) return colorCache.get(str);
  if (!colorCtx) {
    const c = document.createElement('canvas');
    c.width = c.height = 1;
    colorCtx = c.getContext('2d', { willReadFrequently: true });
  }
  colorCtx.fillStyle = '#010203';
  colorCtx.fillStyle = str;
  let result = null;
  if (colorCtx.fillStyle !== '#010203' || /^#010203$/i.test(str)) {
    colorCtx.clearRect(0, 0, 1, 1);
    colorCtx.fillRect(0, 0, 1, 1);
    const d = colorCtx.getImageData(0, 0, 1, 1).data;
    result = { r: d[0] / 255, g: d[1] / 255, b: d[2] / 255, a: d[3] / 255 };
  }
  colorCache.set(str, result);
  return result;
}

function solid(c) {
  return { type: 'SOLID', color: { r: c.r, g: c.g, b: c.b }, opacity: r2(c.a) };
}

function splitTop(str) {
  const out = [];
  let depth = 0;
  let cur = '';
  for (const ch of str || '') {
    if (ch === '(') depth++;
    else if (ch === ')') depth--;
    if (ch === ',' && depth === 0) {
      out.push(cur);
      cur = '';
    } else cur += ch;
  }
  if (cur.trim()) out.push(cur);
  return out;
}

function toRadians(v) {
  const n = parseFloat(v);
  if (v.endsWith('grad')) return n * Math.PI / 200;
  if (v.endsWith('rad')) return n;
  if (v.endsWith('turn')) return n * 2 * Math.PI;
  return n * Math.PI / 180;
}

function gradientPaint(str, w, h) {
  const m = /^(?:repeating-)?(linear|radial|conic)-gradient\(([\s\S]*)\)$/.exec(str.trim());
  if (!m || !(w > 0) || !(h > 0)) return null;
  const parts = splitTop(m[2]);
  const kind = m[1];

  if (kind === 'linear') {
    const first = parts[0].trim();
    let dir = [0, 1];
    if (/^to\s/.test(first)) {
      const sx = /left/.test(first) ? -1 : /right/.test(first) ? 1 : 0;
      const sy = /top/.test(first) ? -1 : /bottom/.test(first) ? 1 : 0;
      // Corner directions are perpendicular to the opposite diagonal.
      dir = sx && sy ? [sx * h, sy * w] : [sx, sy];
      parts.shift();
    } else if (/^-?[\d.]+(deg|g?rad|turn)$/.test(first)) {
      const a = toRadians(first);
      dir = [Math.sin(a), -Math.cos(a)];
      parts.shift();
    }
    const n = Math.hypot(dir[0], dir[1]) || 1;
    const dx = dir[0] / n;
    const dy = dir[1] / n;
    const len = Math.abs(w * dx) + Math.abs(h * dy);
    const stops = parseStops(parts, len);
    if (!stops || !len) return null;
    // Gradient line in pixels, then a transform from the layer's unit square
    // into gradient space, where the gradient runs along x from 0 to 1.
    const Dx = dx * len;
    const Dy = dy * len;
    const Sx = w / 2 - Dx / 2;
    const Sy = h / 2 - Dy / 2;
    const L2 = len * len;
    return {
      type: 'GRADIENT_LINEAR',
      gradientTransform: [
        [Dx * w / L2, Dy * h / L2, -(Sx * Dx + Sy * Dy) / L2],
        [-Dy * w / L2, Dx * h / L2, (Sx * Dy - Sy * Dx) / L2 + 0.5],
      ],
      gradientStops: stops,
    };
  }

  // Radial and conic: shape/position keywords are ignored, centered on the layer.
  if (parts.length && !parseColor(parts[0].trim().split(/\s+(?![^(]*\))/)[0])) parts.shift();
  if (kind === 'radial') {
    const stops = parseStops(parts, Math.hypot(w, h) / 2);
    if (!stops) return null;
    const k = Math.SQRT1_2;
    return { type: 'GRADIENT_RADIAL', gradientTransform: [[k, 0, 0.5 - 0.5 * k], [0, k, 0.5 - 0.5 * k]], gradientStops: stops };
  }
  const stops = parseStops(parts.map((p) => p.replace(/-?[\d.]+deg/g, (d) => `${parseFloat(d) / 3.6}%`)), 1);
  if (!stops) return null;
  return { type: 'GRADIENT_ANGULAR', gradientTransform: [[1, 0, 0], [0, 1, 0]], gradientStops: stops };
}

function parseStops(parts, len) {
  const raw = [];
  for (const part of parts) {
    const p = part.trim();
    if (/^-?[\d.]+(%|px)$/.test(p)) continue; // interpolation hint
    const m = /^(.*?)((?:\s+-?[\d.]+(?:%|px))*)$/.exec(p);
    const color = m && parseColor(m[1].trim());
    if (!color) continue;
    const ps = (m[2].match(/-?[\d.]+(?:%|px)/g) || []).map((v) => (v.endsWith('%') ? parseFloat(v) / 100 : parseFloat(v) / len));
    if (!ps.length) raw.push({ color, pos: null });
    else for (const pos of ps) raw.push({ color, pos });
  }
  if (!raw.length) return null;
  if (raw.length === 1) raw.push({ color: raw[0].color, pos: 1 });
  if (raw[0].pos == null) raw[0].pos = 0;
  if (raw[raw.length - 1].pos == null) raw[raw.length - 1].pos = 1;
  let last = raw[0].pos;
  for (const s of raw) {
    if (s.pos == null) continue;
    if (s.pos < last) s.pos = last;
    last = s.pos;
  }
  for (let i = 1; i < raw.length; i++) {
    if (raw[i].pos != null) continue;
    let j = i;
    while (raw[j].pos == null) j++;
    const a = raw[i - 1].pos;
    const b = raw[j].pos;
    for (let k = i; k < j; k++) raw[k].pos = a + (b - a) * (k - i + 1) / (j - i + 1);
    i = j;
  }
  return raw.map((s) => ({ position: clamp01(s.pos), color: { r: s.color.r, g: s.color.g, b: s.color.b, a: s.color.a } }));
}

// ---------- text ----------

// True when the element contains only text and plain inline markup,
// so it can become one text layer with styled ranges.
function isTextBlock(el) {
  let hasText = false;
  const painted = [];
  S.inlinePaint = null;
  const ok = (function scan(node) {
    for (const c of node.childNodes) {
      if (c.nodeType === 3) {
        if (/\S/.test(c.data)) hasText = true;
        continue;
      }
      if (c.nodeType !== 1) continue;
      const tag = c.tagName.toUpperCase();
      if (SKIP_TAGS.has(tag) || tag === 'BR') continue;
      if (ATOMIC_TAGS.has(tag)) return false;
      const ccs = css(c);
      if (ccs.display === 'none' || hiddenByEngine(c, ccs)) continue;
      if (ccs.display !== 'inline' && ccs.display !== 'contents' && !plainInlineBlock(c, ccs)) return false;
      if (ccs.position === 'absolute' || ccs.position === 'fixed') return false;
      if (hasPaint(ccs)) painted.push(c);
      if (!scan(c)) return false;
    }
    return true;
  })(el);
  if (!ok || !hasText) return false;
  // Inline badges / <code> with a background: on a single line, keep them as
  // separate boxes; inside wrapping paragraphs, merge the text and draw the
  // boxes behind it (see inlineBoxes).
  if (painted.length) {
    if (lineCount(el) < 2) return false;
    S.inlinePaint = painted;
  }
  return true;
}

// An inline-block that adds no box of its own (no paint, no horizontal
// padding/border/margin, one line of plain text) flows exactly like inline text.
function plainInlineBlock(c, ccs) {
  if (!/^inline-(block|flex)$/.test(ccs.display) || hasPaint(ccs)) return false;
  const n = (p) => Math.abs(parseFloat(ccs[p]) || 0);
  const edge = n('paddingLeft') + n('paddingRight') + n('borderLeftWidth') + n('borderRightWidth') + n('marginLeft') + n('marginRight');
  const v = n('paddingTop') + n('paddingBottom') + n('borderTopWidth') + n('borderBottomWidth') + n('marginTop') + n('marginBottom');
  return edge < 1 && v < 1 && lineCount(c) === 1;
}

function lineCount(target) {
  const range = S.doc.createRange();
  range.selectNodeContents(target);
  const lines = [];
  for (const r of range.getClientRects()) {
    if (r.width < 0.5 || r.height < 0.5) continue;
    const mid = (r.top + r.bottom) / 2;
    if (!lines.some((l) => mid > l.top && mid < l.bottom)) lines.push({ top: r.top, bottom: r.bottom });
  }
  return lines.length;
}

function gatherRuns(root) {
  const runs = [];
  (function rec(node) {
    for (const c of node.childNodes) {
      if (c.nodeType === 3) {
        if (node.tagName === 'DETAILS' && !node.open) continue;
        runs.push({ raw: c.data, el: node, node: c });
      } else if (c.nodeType === 1) {
        const tag = c.tagName.toUpperCase();
        if (tag === 'BR') {
          runs.push({ raw: '\n', el: node, hard: true });
          continue;
        }
        if (SKIP_TAGS.has(tag)) continue;
        const ccs = css(c);
        if (ccs.display === 'none' || hiddenByEngine(c, ccs)) continue;
        rec(c);
      }
    }
  })(root);
  return runs;
}

// Collapses whitespace the way the browser does and merges runs with equal style.
// extra (optional): { before: Map(runIndex -> px), after: Map(runIndex -> px) } adds
// letter spacing to the character before / the last character of a run, so the
// padding of an inline box that is drawn separately still advances the text.
function toSegments(runs, colorOverride, extra) {
  const segs = [];
  let atLineStart = true;
  let pre = false;
  const bump = (px) => {
    const prev = segs[segs.length - 1];
    if (!prev || !px) return;
    if (prev.bumped) { prev.letterSpacing = r2(prev.letterSpacing + px); return; }
    const n = /[\uDC00-\uDFFF]$/.test(prev.text) ? 2 : 1;
    const ch = prev.text.slice(-n);
    prev.text = prev.text.slice(0, -n);
    const one = Object.assign({}, prev, { text: ch, letterSpacing: r2(prev.letterSpacing + px), bumped: true, key: prev.key + '#bump' + segs.length });
    if (!prev.text) segs.pop();
    segs.push(one);
  };
  runs.forEach((r, i) => {
    if (extra && extra.before.has(i)) bump(extra.before.get(i));
    const cs = css(r.el);
    let t = r.raw;
    if (!r.hard) {
      const ws = cs.whiteSpace;
      pre = /^(pre|pre-wrap|break-spaces)$/.test(ws);
      if (ws === 'pre-line') t = t.replace(/[ \t]+/g, ' ').replace(/ ?\n ?/g, '\n');
      else if (!pre) t = t.replace(/[ \t\n\r\f]+/g, ' ');
      if (atLineStart && !pre) t = t.replace(/^ /, '');
    }
    if (t) {
      const style = segStyle(r.el, cs, colorOverride);
      const prev = segs[segs.length - 1];
      if (prev && prev.key === style.key) prev.text += t;
      else segs.push(Object.assign(style, { text: t }));
      atLineStart = /[ \n]$/.test(t);
    }
    if (extra && extra.after.has(i)) bump(extra.after.get(i));
  });
  while (segs.length) {
    const last = segs[segs.length - 1];
    last.text = pre ? last.text.replace(/\n$/, '') : last.text.replace(/[ \n]+$/, '');
    if (last.text) break;
    segs.pop();
  }
  for (const s of segs) {
    if (!pre) s.text = s.text.replace(/ +\n/g, '\n');
    delete s.key;
    delete s.bumped;
  }
  return segs.filter((s) => s.text);
}

function segStyle(el, cs, colorOverride) {
  const col = parseColor(colorOverride || cs.color) || { r: 0, g: 0, b: 0, a: 1 };
  const fill = col.a > 0 ? solid(col) : clipGradient(el) || solid(col);
  const lh = parseFloat(cs.lineHeight);
  const style = {
    font: { families: parseFamilies(cs.fontFamily), weight: parseInt(cs.fontWeight, 10) || 400, italic: cs.fontStyle !== 'normal' },
    size: r2(parseFloat(cs.fontSize) || 16),
    fill,
    decoration: decoFor(el),
    letterSpacing: cs.letterSpacing === 'normal' ? 0 : r2(parseFloat(cs.letterSpacing) || 0),
    lineHeight: Number.isFinite(lh) && lh > 0 ? r2(lh) : null,
    textCase: TEXT_CASE[cs.textTransform] || null,
  };
  style.key = JSON.stringify(style);
  return style;
}

function parseFamilies(str) {
  return splitTop(str).map((f) => f.trim().replace(/^["']|["']$/g, '')).filter(Boolean);
}

// text-decoration is not inherited in computed style, but it does propagate
// to in-flow descendants until an inline-block / out-of-flow element.
function decoFor(el) {
  if (S.deco.has(el)) return S.deco.get(el);
  let res = null;
  for (let e = el; e && e.nodeType === 1; e = e.parentElement) {
    const c = css(e);
    const d = c.textDecorationLine || '';
    if (/line-through/.test(d)) { res = 'STRIKETHROUGH'; break; }
    if (/underline/.test(d)) { res = 'UNDERLINE'; break; }
    if (/^inline-/.test(c.display) || c.position === 'absolute' || c.position === 'fixed' || c.cssFloat !== 'none') break;
  }
  S.deco.set(el, res);
  return res;
}

// Gradient text (background-clip: text + transparent color).
function clipGradient(el) {
  for (let e = el, i = 0; e && e.nodeType === 1 && i < 8; e = e.parentElement, i++) {
    const c = css(e);
    if ((c.webkitBackgroundClip === 'text' || c.backgroundClip === 'text') && /gradient/.test(c.backgroundImage)) {
      const r = e.getBoundingClientRect();
      return gradientPaint(splitTop(c.backgroundImage).find((l) => /gradient/.test(l)), r.width, r.height);
    }
  }
  return null;
}

function contentBox(el, cs) {
  const r = el.getBoundingClientRect();
  const n = (p) => parseFloat(cs[p]) || 0;
  const l = n('borderLeftWidth') + n('paddingLeft');
  const t = n('borderTopWidth') + n('paddingTop');
  return {
    x: r.left + l,
    y: r.top + t,
    w: r.width - l - n('borderRightWidth') - n('paddingRight'),
    h: r.height - t - n('borderBottomWidth') - n('paddingBottom'),
  };
}

// Line boxes of a text node or an element's text, from text-node rects only
// (the border boxes of padded inline elements would skew them). Each rect gets
// the half-leading of its own element, which goes negative when line-height is
// tighter than the font's content area (leading-none, h1 {line-height:1.1}).
function textLines(target) {
  const lines = [];
  const add = (tn, a, b) => {
    const rg = S.doc.createRange();
    rg.setStart(tn, a);
    rg.setEnd(tn, b);
    const lh = parseFloat(css(tn.parentElement).lineHeight);
    for (const q of rg.getClientRects()) {
      if (q.width <= 0.5 || q.height <= 0.5) continue;
      const hl = Number.isFinite(lh) ? (lh - q.height) / 2 : 0;
      const mid = (q.top + q.bottom) / 2;
      let line = lines.find((l) => mid > l.gt && mid < l.gb);
      if (!line) lines.push(line = { gt: q.top, gb: q.bottom, top: Infinity, bottom: -Infinity, l: Infinity, r: -Infinity });
      line.top = Math.min(line.top, q.top - hl);
      line.bottom = Math.max(line.bottom, q.bottom + hl);
      line.l = Math.min(line.l, q.left);
      line.r = Math.max(line.r, q.right);
    }
  };
  if (target.nodeType === 3) {
    const a = target.data.search(/\S/);
    if (a < 0) return null;
    add(target, a, target.data.replace(/\s+$/, '').length);
  } else {
    const w = S.doc.createTreeWalker(target, NodeFilter.SHOW_TEXT);
    for (let n; (n = w.nextNode());) if (/\S/.test(n.data)) add(n, 0, n.data.length);
  }
  if (!lines.length) return null;
  lines.sort((p, q) => p.gt - q.gt);
  const m = { lines, L: Infinity, R: -Infinity, top: Infinity, bottom: -Infinity };
  for (const l of lines) {
    m.L = Math.min(m.L, l.l); m.R = Math.max(m.R, l.r);
    m.top = Math.min(m.top, l.top); m.bottom = Math.max(m.bottom, l.bottom);
  }
  return m;
}

const isNoWrap = (cs) => cs.textWrapMode === 'nowrap' || /^(pre|nowrap)$/.test(cs.whiteSpace);

// Where to put the text layer, in page coordinates.
// alignBox: the box single-line text sits in (lets us detect its alignment);
// wrapBox: the width multi-line text wraps at.
function textGeometry(target, cs, alignBox, wrapBox) {
  const m = textLines(target);
  if (!m) return null;
  const { L, R } = m;
  const y = m.top;
  const h = m.bottom - m.top;
  const align = ALIGN[cs.textAlign] || 'LEFT';

  if (m.lines.length > 1 && isNoWrap(cs)) {
    // Only the hard breaks wrap: an auto-width box keeps Figma from wrapping more.
    return { x: L, y, w: R - L, h, align, autoResize: 'WIDTH_AND_HEIGHT' };
  }
  if (m.lines.length > 1) {
    let wl = wrapBox ? wrapBox.x : L;
    let wr = wrapBox ? wrapBox.x + wrapBox.w : R;
    // Text that is an anonymous flex/grid item wraps between its siblings, not
    // across the whole container.
    const host = target.nodeType === 3 ? target.parentElement : target;
    const hcs = css(host);
    if (/flex|grid/.test(hcs.display) && !/column/.test(hcs.flexDirection)) {
      const gap = parseFloat(hcs.columnGap) || 0;
      for (const c of host.children) {
        const ccs = css(c);
        if (ccs.display === 'none' || ccs.position === 'absolute' || ccs.position === 'fixed') continue;
        const cr = c.getBoundingClientRect();
        if (cr.bottom <= m.top || cr.top >= m.bottom) continue;
        if (cr.left >= R - 0.5) wr = Math.min(wr, cr.left - gap);
        if (cr.right <= L + 0.5) wl = Math.max(wl, cr.right + gap);
      }
    }
    wr = Math.max(wr, Math.ceil(R));
    wl = Math.min(wl, Math.floor(L));
    if (align === 'LEFT' || align === 'JUSTIFIED') wl = L;
    return { x: wl, y, w: wr - wl, h, align, autoResize: 'HEIGHT' };
  }
  if (alignBox && alignBox.w - (R - L) > 8) {
    const gl = L - alignBox.x;
    const gr = alignBox.x + alignBox.w - R;
    const al = Math.abs(gl) < 2 ? 'LEFT' : Math.abs(gr) < 2 ? 'RIGHT' : Math.abs(gl - gr) < 2 ? 'CENTER' : null;
    if (al) return { x: alignBox.x, y, w: alignBox.w, h, align: al, autoResize: 'HEIGHT' };
  }
  return { x: L, y, w: R - L, h, align: 'LEFT', autoResize: 'WIDTH_AND_HEIGHT' };
}

function textNode(segs, g, cs) {
  const t = { type: 'TEXT', x: r2(g.x), y: r2(g.y), w: r2(g.w), h: r2(g.h), segments: segs, align: g.align, autoResize: g.autoResize };
  const fx = cs ? textEffects(cs) : [];
  if (fx.length) t.effects = fx;
  return t;
}

// text-shadow -> drop shadows (no spread, not clipped under the glyphs).
function textEffects(cs) {
  if (!cs.textShadow || cs.textShadow === 'none') return [];
  return parseShadows(cs.textShadow)
    .filter((e) => e.type === 'DROP_SHADOW')
    .map((e) => Object.assign(e, { spread: 0, showShadowBehindNode: true }));
}

// overflow + text-overflow / line-clamp: what the browser cuts, Figma truncates
// (textTruncation/maxLines); other clipped overflow is flagged for a clipping frame.
// t and cb are in page coordinates. keepX: loose text that starts after a sibling.
function clampText(t, cs, cb, keepX) {
  if (cs.overflowX === 'visible' && cs.overflowY === 'visible') return;
  const right = cb.x + cb.w;
  const overX = t.x + t.w > right + 1 || t.x < cb.x - 1;
  const overY = t.y + t.h > cb.y + cb.h + 1 || t.y < cb.y - 1;
  const clamp = parseInt(cs.webkitLineClamp || cs.lineClamp, 10);
  const oneLine = !t.segments.some((s) => /\n/.test(s.text));
  if (overX && cs.overflowX !== 'visible' && isNoWrap(cs) && cs.textOverflow === 'ellipsis' && oneLine) {
    if (!keepX) t.x = r2(cb.x);
    t.w = r2(Math.max(1, right - t.x));
    t.autoResize = 'HEIGHT';
    if (!keepX) t.align = ALIGN[cs.textAlign] || 'LEFT';
    t.truncate = 1;
    // nowrap: Figma must cut by character like CSS, not at the last word.
    for (const s of t.segments) s.text = s.text.replace(/ /g, ' ');
  } else if (clamp > 0 && overY) {
    t.x = r2(cb.x);
    t.w = r2(cb.w);
    t.h = r2(Math.min(t.h, cb.h));
    t.autoResize = 'HEIGHT';
    t.truncate = clamp;
  } else if (overX || overY) {
    t.overflowsBox = true;
  }
}

// The content box of the nearest block container (what an inline element wraps in).
function blockWrapBox(el) {
  for (let e = el.parentElement; e; e = e.parentElement) {
    const c = css(e);
    if (!/^inline/.test(c.display) && c.display !== 'contents') return contentBox(e, c);
  }
  return null;
}

// Wrapped text whose first line starts right of the wrap edge (after an
// inline-block badge, an icon or text-indent): Figma can't indent just the first
// line, so the first line becomes its own layer and the rest wraps from the edge.
function splitFirstLine(runs, cs, wrapBox) {
  if (!wrapBox || cs.direction === 'rtl' || !/^(left|start|justify|-webkit-left)$/.test(cs.textAlign) || isNoWrap(cs)) return null;
  const pos = []; // global char index -> [node, offset]
  const starts = runs.map((r) => {
    const at = pos.length;
    if (r.node) for (let i = 0; i < r.node.data.length; i++) pos.push([r.node, i]);
    return at;
  });
  if (pos.length < 2) return null;
  let s = 0;
  while (s < pos.length && /\s/.test(pos[s][0].data[pos[s][1]])) s++;
  if (s >= pos.length) return null;
  const rg = S.doc.createRange();
  const at = (k) => (k < pos.length ? pos[k] : [pos[pos.length - 1][0], pos[pos.length - 1][1] + 1]);
  const rectsOf = (a, b) => {
    rg.setStart(at(a)[0], at(a)[1]);
    rg.setEnd(at(b)[0], at(b)[1]);
    return [...rg.getClientRects()].filter((q) => q.width > 0.5 && q.height > 0.5);
  };
  const lineList = (rects) => {
    const ls = [];
    for (const q of rects) {
      const mid = (q.top + q.bottom) / 2;
      let l = ls.find((x) => mid > x.t && mid < x.b);
      if (!l) ls.push(l = { t: q.top, b: q.bottom, l: Infinity, r: -Infinity });
      l.l = Math.min(l.l, q.left);
      l.r = Math.max(l.r, q.right);
    }
    return ls.sort((p, q) => p.t - q.t);
  };
  const all = lineList(rectsOf(s, pos.length));
  if (all.length < 2 || all[0].l <= wrapBox.x + 1 || all[1].l > wrapBox.x + 1) return null;
  let lo = s + 1, hi = pos.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (lineList(rectsOf(s, mid)).length > 1) hi = mid; else lo = mid + 1;
  }
  let cut = lo - 1;
  if (cut <= s) return null;
  if (/[\uDC00-\uDFFF]/.test(pos[cut][0].data[pos[cut][1]])) cut--;
  const A = [], B = [];
  runs.forEach((r, i) => {
    if (!r.node) { (starts[i] <= cut ? A : B).push(r); return; }
    const a = starts[i], b = a + r.node.data.length;
    if (b <= cut) A.push(r);
    else if (a >= cut) B.push(r);
    else {
      A.push(Object.assign({}, r, { raw: r.raw.slice(0, cut - a) }));
      B.push(Object.assign({}, r, { raw: r.raw.slice(cut - a) }));
    }
  });
  const sa = toSegments(A), sb = toSegments(B);
  if (!sa.length || !sb.length) return null;
  const lh = parseFloat(cs.lineHeight);
  const vbox = (rects) => {
    let top = Infinity, bottom = -Infinity, l = Infinity, r = -Infinity;
    for (const q of rects) {
      const hl = Number.isFinite(lh) ? (lh - q.height) / 2 : 0;
      top = Math.min(top, q.top - hl); bottom = Math.max(bottom, q.bottom + hl);
      l = Math.min(l, q.left); r = Math.max(r, q.right);
    }
    return { top, bottom, l, r };
  };
  const ga = vbox(rectsOf(s, cut));
  const gb = vbox(rectsOf(cut, pos.length));
  if (!Number.isFinite(ga.top) || !Number.isFinite(gb.top)) return null;
  return [
    textNode(sa, { x: ga.l, y: ga.top, w: ga.r - ga.l, h: ga.bottom - ga.top, align: 'LEFT', autoResize: 'WIDTH_AND_HEIGHT' }, cs),
    textNode(sb, { x: wrapBox.x, y: gb.top, w: wrapBox.w, h: gb.bottom - gb.top, align: ALIGN[cs.textAlign] || 'LEFT', autoResize: 'HEIGHT' }, cs),
  ];
}

// letter-spacing compensation for painted inline boxes merged into a paragraph.
function padExtras(runs, painted) {
  const extra = { before: new Map(), after: new Map() };
  const add = (m, i, px) => { if (px > 0.01) m.set(i, (m.get(i) || 0) + px); };
  for (const e of painted) {
    const c = css(e);
    if (c.boxDecorationBreak === 'clone' || c.webkitBoxDecorationBreak === 'clone') continue;
    const n = (p) => parseFloat(c[p]) || 0;
    let first = -1, last = -1;
    runs.forEach((r, i) => { if (r.node && e.contains(r.node)) { if (first < 0) first = i; last = i; } });
    if (first < 0) continue;
    add(extra.before, first, n('marginLeft') + n('borderLeftWidth') + n('paddingLeft'));
    add(extra.after, last, n('paddingRight') + n('borderRightWidth') + n('marginRight'));
  }
  return extra;
}

// The boxes of painted inline elements (code, mark, kbd) inside a merged
// paragraph, one RECT per line fragment, in page coordinates, drawn behind the text.
function inlineBoxes(els) {
  const out = [];
  for (const e of els) {
    const c = css(e);
    const frags = [...e.getClientRects()].filter((q) => q.width > 0.5 && q.height > 0.5);
    frags.forEach((q, i) => {
      const fb = { x: q.left, y: q.top, w: q.width, h: q.height };
      const first = i === 0, last = i === frags.length - 1;
      const st = borders(c);
      if (st) {
        st.weights = Object.assign({}, st.weights);
        if (!last) st.weights.r = 0;
        if (!first) st.weights.l = 0;
      }
      let rd = radii(c, fb);
      if (rd) {
        if (!first) { rd.tl = 0; rd.bl = 0; }
        if (!last) { rd.tr = 0; rd.br = 0; }
        if (!(rd.tl || rd.tr || rd.br || rd.bl)) rd = null;
      }
      const effects = parseShadows(c.boxShadow);
      out.push({
        type: 'RECT', name: e.tagName.toLowerCase() + ' bg', x: r2(q.left), y: r2(q.top), w: r2(q.width), h: r2(q.height),
        fills: backgroundFills(c, fb), stroke: st, radii: rd, effects: effects.length ? effects : undefined, absolute: true,
      });
    });
  }
  return out;
}

function blockText(el, cs, painted) {
  const runs = gatherRuns(el);
  const segs = toSegments(runs, null, painted ? padExtras(runs, painted) : null);
  if (!segs.length) return null;
  const cb = contentBox(el, cs);
  // An inline element that starts mid-line and wraps (its parent isn't one text block).
  if (cs.display === 'inline' && !painted && !hasPaint(cs)) {
    const parts = splitFirstLine(runs, cs, blockWrapBox(el));
    if (parts) return parts;
  }
  const g = textGeometry(el, cs, cb, cb);
  if (!g) return null;
  const t = textNode(segs, g, cs);
  clampText(t, cs, cb, false);
  return t;
}

function looseText(tn, parent, ox, oy) {
  if (!/\S/.test(tn.data)) return null;
  const pcs = css(parent);
  const runs = [{ raw: tn.data, el: parent, node: tn }];
  const segs = toSegments(runs);
  if (!segs.length) return null;
  const pcb = contentBox(parent, pcs);
  const parts = splitFirstLine(runs, pcs, pcb);
  if (parts) {
    parts.forEach((t) => shift(t, ox, oy));
    return parts;
  }
  const g = textGeometry(tn, pcs, null, pcb);
  if (!g) return null;
  const t = textNode(segs, g, pcs);
  clampText(t, pcs, pcb, true);
  delete t.overflowsBox; // the parent frame decides about clipping its children
  shift(t, ox, oy);
  return t;
}

// ---------- replaced elements ----------

function imageRef(url, el) {
  let it = S.images.get(url);
  if (!it) {
    it = { ref: 'img' + S.images.size, url, el };
    S.images.set(url, it);
  } else if (!it.el && el) {
    it.el = el;
  }
  return it.ref;
}

function boxed(type, name, box, v, fills) {
  return { type, name, ...box, fills, stroke: v.stroke, radii: v.radii, effects: v.effects };
}

function imageNode(el, cs, box) {
  const v = boxVisual(el, cs, box);
  const src = el.currentSrc || el.src;
  const fills = v.fills.slice();
  if (src && S.opts.images) fills.push({ type: 'IMAGE', ref: imageRef(src, el), scaleMode: FIT_MODES[cs.objectFit] || 'FILL' });
  else fills.push(PLACEHOLDER_FILL);
  return boxed('RECT', el.alt ? `img · ${el.alt}`.slice(0, 60) : 'img', box, v, fills);
}

function canvasNode(el, cs, box) {
  const v = boxVisual(el, cs, box);
  let fill = PLACEHOLDER_FILL;
  try {
    if (S.opts.images) fill = { type: 'IMAGE', ref: imageRef(el.toDataURL('image/png'), null), scaleMode: 'FILL' };
  } catch (e) { /* tainted canvas */ }
  return boxed('RECT', 'canvas', box, v, v.fills.concat(fill));
}

function videoNode(el, cs, box) {
  const v = boxVisual(el, cs, box);
  const fill = el.poster && S.opts.images
    ? { type: 'IMAGE', ref: imageRef(el.poster, null), scaleMode: FIT_MODES[cs.objectFit] || 'FILL' }
    : solid({ r: 0.1, g: 0.1, b: 0.1, a: 1 });
  return boxed('RECT', 'video', box, v, v.fills.concat(fill));
}

function formNode(el, cs, box, rect, tag) {
  const v = boxVisual(el, cs, box);
  const type = (el.type || '').toLowerCase();
  const f = boxed('FRAME', tag.toLowerCase() + (tag === 'INPUT' ? `[${type}]` : ''), box, v, v.fills);
  f.clip = true;
  f.children = [];
  if (type === 'checkbox' || type === 'radio') {
    if (!v.has) {
      f.fills = [solid(el.checked ? { r: 0.05, g: 0.6, b: 1, a: 1 } : { r: 1, g: 1, b: 1, a: 1 })];
      f.stroke = { paint: solid({ r: 0.55, g: 0.55, b: 0.58, a: 1 }), weights: { t: 1, r: 1, b: 1, l: 1 }, dash: null };
      const rr = type === 'radio' ? box.w / 2 : 3;
      f.radii = { tl: rr, tr: rr, br: rr, bl: rr };
    }
    return f;
  }
  if (/^(range|color|file|image)$/.test(type)) return f;

  let text = '';
  let placeholder = false;
  if (tag === 'SELECT') text = el.selectedIndex >= 0 ? el.options[el.selectedIndex].text : '';
  else {
    text = el.value;
    if (!text && el.placeholder) {
      text = el.placeholder;
      placeholder = true;
    }
  }
  if (type === 'password' && !placeholder) text = '•'.repeat(text.length);
  if (!text) return f;

  const segs = toSegments([{ raw: text, el }], placeholder ? css(el, '::placeholder').color : null);
  if (!segs.length) return f;
  const cb = contentBox(el, cs);
  const x = cb.x - rect.left;
  if (tag === 'TEXTAREA') {
    f.children.push(textNode(segs, { x, y: cb.y - rect.top, w: cb.w, h: cb.h, align: ALIGN[cs.textAlign] || 'LEFT', autoResize: 'HEIGHT' }, cs));
  } else {
    const lh = parseFloat(cs.lineHeight) || (parseFloat(cs.fontSize) || 13) * 1.2;
    const y = cb.y - rect.top + (cb.h - lh) / 2;
    let align = ALIGN[cs.textAlign] || 'LEFT';
    if (align === 'JUSTIFIED') align = 'LEFT'; // one line: justify == start
    if (cs.direction === 'rtl' && cs.textAlign === 'start') align = 'RIGHT';
    // OTP boxes, steppers, amount fields: keep centered/right text in a fixed box,
    // but only when it clearly fits (an input never wraps; overflow shows the start).
    const mctx = (S.measureCtx = S.measureCtx || document.createElement('canvas').getContext('2d'));
    mctx.font = cs.font || `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const ls = parseFloat(cs.letterSpacing) || 0;
    const shown = segs.map((sg) => sg.text).join('');
    const tw = mctx.measureText(shown).width + ls * shown.length;
    if (align !== 'LEFT' && tw <= cb.w - 1) {
      const t = textNode(segs, { x, y, w: cb.w, h: lh, align, autoResize: 'HEIGHT' }, cs);
      t.truncate = 1; // never a second line, even if Figma's metrics come out wider
      f.children.push(t);
    } else {
      f.children.push(textNode(segs, { x, y, w: cb.w, h: lh, align: 'LEFT', autoResize: 'WIDTH_AND_HEIGHT' }, cs));
    }
  }
  return f;
}

// Inline SVG is copied with its computed paint baked into attributes,
// so currentColor and CSS-driven fills survive outside the page.
function svgNode(el, box) {
  const clone = el.cloneNode(true);
  const src = [el, ...el.querySelectorAll('*')];
  const dst = [clone, ...clone.querySelectorAll('*')];
  src.forEach((s, i) => {
    const d = dst[i];
    if (!d) return;
    const scs = S.win.getComputedStyle(s);
    const props = s.tagName.toLowerCase() === 'stop' ? STOP_PROPS : SHAPE_PROPS;
    for (const p of props) {
      if (i === 0 && p === 'opacity') continue; // applied to the layer itself
      let val = scs.getPropertyValue(p);
      if (!val) continue;
      val = val.replace(/url\(\s*["']?[^"')]*?(#[^"')]+)["']?\s*\)/g, 'url($1)').replace(/(\d)px\b/g, '$1');
      d.setAttribute(p, val);
    }
    if (i > 0 && scs.display === 'none') d.setAttribute('display', 'none');
    d.removeAttribute('class');
    d.removeAttribute('style');
  });
  if (!el.getAttribute('viewBox')) {
    const num = (a) => (/^[\d.]+(px)?$/.test(el.getAttribute(a) || '') ? parseFloat(el.getAttribute(a)) : 0);
    const w0 = num('width') || box.w;
    const h0 = num('height') || box.h;
    clone.setAttribute('viewBox', `0 0 ${w0} ${h0}`);
  }
  clone.setAttribute('width', box.w);
  clone.setAttribute('height', box.h);
  const label = el.getAttribute('aria-label') || (el.querySelector('title') || {}).textContent;
  return { type: 'SVG', name: label ? `svg · ${label}`.slice(0, 60) : 'svg', ...box, svg: new XMLSerializer().serializeToString(clone) };
}

// ---------- auto layout ----------

// Turns a frame into Auto Layout only when its measured children already sit
// exactly where Auto Layout would put them; otherwise positions stay absolute.
function tryAutoLayout(frame, cs) {
  if (!S.opts.autoLayout) return;
  const kids = frame.children.filter((k) => !k.absolute);
  if (!kids.length) return;
  const flex = /flex/.test(cs.display);
  const dirs = flex ? [/column/.test(cs.flexDirection) ? 'VERTICAL' : 'HORIZONTAL'] : ['VERTICAL', 'HORIZONTAL'];
  for (const dir of dirs) {
    const layout = fitLayout(frame, kids, dir, flex && /space-between/.test(cs.justifyContent));
    if (layout) {
      frame.layout = layout;
      markStretch(frame, kids, layout);
      return;
    }
  }
}

function fitLayout(frame, kids, dir, spaceBetween) {
  const T = 1.5;
  const H = dir === 'HORIZONTAL';
  const pos = (k) => (H ? k.x : k.y);
  const len = (k) => (H ? k.w : k.h);
  const cpos = (k) => (H ? k.y : k.x);
  const clen = (k) => (H ? k.h : k.w);
  const main = H ? frame.w : frame.h;
  const cross = H ? frame.h : frame.w;
  const sum = (a) => a.reduce((x, y) => x + y, 0);
  const same = (a) => a.every((v) => Math.abs(v - a[0]) <= T);
  const floor0 = (a) => Math.max(0, Math.min(...a));

  // Main axis: children in DOM order, no overlaps, equal gaps.
  const gaps = [];
  for (let i = 1; i < kids.length; i++) gaps.push(pos(kids[i]) - pos(kids[i - 1]) - len(kids[i - 1]));
  if (gaps.some((g) => g < -T)) return null;
  const gap = gaps.length ? sum(gaps) / gaps.length : 0;
  if (gaps.some((g) => Math.abs(g - gap) > T)) return null;
  const last = kids[kids.length - 1];
  const start = pos(kids[0]);
  const end = main - pos(last) - len(last);
  if (start < -T || end < -T) return null;

  // Cross axis: everyone aligned to the start, the end, or the center.
  const before = kids.map(cpos);
  const after = kids.map((k) => cross - cpos(k) - clen(k));
  if (before.some((v) => v < -T) || after.some((v) => v < -T)) return null;
  let counter, a, b;
  if (same(before)) {
    counter = kids.length === 1 && Math.abs(before[0] - after[0]) <= T && before[0] > T ? 'CENTER' : 'MIN';
    a = floor0(before);
    b = floor0(after);
  } else if (same(after)) {
    counter = 'MAX';
    a = floor0(before);
    b = floor0(after);
  } else {
    const diff = kids.map((k, i) => before[i] - after[i]);
    if (!same(diff)) return null;
    counter = 'CENTER';
    const m = sum(diff) / diff.length;
    a = Math.max(0, m);
    b = Math.max(0, -m);
  }

  let primary = 'MIN';
  let spacing = r2(Math.max(0, gap));
  if (spaceBetween && kids.length > 1) {
    primary = 'SPACE_BETWEEN';
    spacing = 0;
  } else if (kids.length === 1 && Math.abs(start - end) <= T && start > T) {
    primary = 'CENTER';
  }
  // Columns hug their content so text that reflows in Figma pushes siblings down.
  const primarySizing = !H && primary !== 'SPACE_BETWEEN' ? 'AUTO' : 'FIXED';
  const P = (v) => r2(Math.max(0, v));
  const l = { mode: dir, spacing, primaryAlign: primary, counterAlign: counter, primarySizing };
  if (H) Object.assign(l, { pl: P(start), pr: P(end), pt: P(a), pb: P(b) });
  else Object.assign(l, { pt: P(start), pb: P(end), pl: P(a), pr: P(b) });
  return l;
}

function markStretch(frame, kids, l) {
  const H = l.mode === 'HORIZONTAL';
  const inner = H ? frame.h - l.pt - l.pb : frame.w - l.pl - l.pr;
  for (const k of kids) {
    if (k.type === 'SVG') continue;
    if (k.type === 'TEXT' && (H || k.autoResize === 'WIDTH_AND_HEIGHT')) continue;
    // A hugging column can't also fill the height of a row.
    if (H && k.layout && k.layout.primarySizing === 'AUTO') continue;
    if (Math.abs((H ? k.h : k.w) - inner) <= 1.5) k.stretch = true;
  }
}

// ---------- image loading ----------

// Each image gets its own timeout and the whole step a budget: one hung asset
// must not cost the import. Whatever is left gets slow=true (placeholder in Figma).
async function loadImages(list, onProgress, budgetMs = 30000) {
  const queue = list.slice();
  let done = 0;
  const all = new AbortController();
  const deadline = _setTimeout(() => all.abort(), budgetMs);
  const worker = async () => {
    while (queue.length && !all.signal.aborted) {
      const it = queue.shift();
      try {
        const r = await imageBytes(it.url, it.el, all.signal);
        it.bytes = r.bytes;
        if (r.slow) it.slow = true;
      } catch (e) { it.bytes = null; }
      onProgress(++done, list.length);
    }
  };
  try {
    await Promise.all(Array.from({ length: Math.min(6, list.length) }, worker));
  } finally {
    _clearTimeout(deadline);
  }
  for (const it of queue) it.slow = true;
}

function sniff(b) {
  if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47) return 'png';
  if (b[0] === 0xff && b[1] === 0xd8) return 'jpeg';
  if (b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46) return 'gif';
  return null;
}

// Figma accepts PNG/JPEG/GIF up to 4096px; everything else is re-encoded as PNG.
async function imageBytes(url, el, outer) {
  const st = { slow: false };
  const bytes = await imageBytesInner(url, el, outer, (v) => { st.slow = v; });
  return { bytes, slow: !bytes && st.slow };
}

async function imageBytesInner(url, el, outer, setSlow) {
  let blob = null;
  const ac = new AbortController();
  const t = _setTimeout(() => ac.abort(), 12000); // includes Chrome's cache-lock wait on the <img> request
  const onOuter = () => ac.abort();
  if (outer) { if (outer.aborted) ac.abort(); else outer.addEventListener('abort', onOuter, { once: true }); }
  try {
    // no-store: never queue behind the page's own in-flight <img> request for the same URL (cache lock).
    const res = await (_fetch || fetch)(url, { signal: ac.signal, cache: 'no-store' });

    const bytes = new Uint8Array(await blob.arrayBuffer());
    let bmp = null;

    if (sniff(bytes) && (!bmp || (bmp.width <= 4096 && bmp.height <= 4096))) return bytes;

<script>
const $ = (id) => document.getElementById(id);
const PRESETS = { desktop: [1440, 900], laptop: [1280, 800], tablet: [768, 1024], mobile: [390, 844] };
let busy = false;
let lastWarnings = [];

function setStatus(text, kind) {
  const el = $('status');
  el.textContent = text;
  el.className = kind || '';
}

function lock(on) {
  busy = on;
  $('go').disabled = on;
  $('go').textContent = on ? 'Импортирую…' : 'Импортировать';
}

function currentSize() {
  const p = $('preset').value;
  if (p === 'custom') {
    const w = Math.min(4000, Math.max(200, parseInt($('width').value, 10) || 1440));
    return [w, 900];
  }
  return PRESETS[p];
}

function settings() {
  return { preset: $('preset').value, width: $('width').value, autoLayout: $('autolayout').checked, images: $('images').checked };
}

function saveSettings() {
  parent.postMessage({ pluginMessage: { type: 'save-settings', settings: settings() } }, '*');
}

$('preset').addEventListener('change', () => {
  $('width').hidden = $('preset').value !== 'custom';
  saveSettings();
});
for (const id of ['width', 'autolayout', 'images']) $(id).addEventListener('change', saveSettings);

$('open').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', () => {
  if ($('file').files[0]) loadFile($('file').files[0]);
  $('file').value = '';
});

async function loadFile(file) {
  $('html').value = await file.text();
  $('filename').textContent = file.name;
  setStatus('');
}

let dragDepth = 0;
document.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', (e) => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  const file = [...e.dataTransfer.files].find((f) => /\.html?$/i.test(f.name) || f.type === 'text/html') || e.dataTransfer.files[0];
  if (file) loadFile(file);
});

$('html').addEventListener('input', () => { $('filename').textContent = ''; });
$('go').addEventListener('click', runImport);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) runImport();
});

// Messages from the plugin's main thread (code.js).
window.addEventListener('message', (e) => {
  // The stage page runs arbitrary code: never take plugin messages from it.
  const st = $('stage');
  if (st && e.source && e.source === st.contentWindow) return;
  const msg = e.data && e.data.pluginMessage;
  if (!msg) return;
  if (msg.type === 'settings' && msg.settings) {
    const s = msg.settings;
    if (s.preset) $('preset').value = s.preset;
    if (s.width) $('width').value = s.width;
    $('width').hidden = $('preset').value !== 'custom';
    $('autolayout').checked = s.autoLayout !== false;
    $('images').checked = s.images !== false;
  } else if (msg.type === 'progress') {
    setStatus(msg.text);
  } else if (msg.type === 'done') {
    lock(false);
    const extra = msg.failed ? ` (не получилось: ${msg.failed})` : '';
    if (lastWarnings.includes('tailwind')) {
      setStatus(`Готово: ${msg.count} слоёв${extra} — внимание: Tailwind CDN не загрузился, стили потеряны. Проверь сеть и повтори.`, 'warn');
    } else {
      setStatus(`Готово: ${msg.count} слоёв${extra}`, 'ok');
    }
  } else if (msg.type === 'error') {
    lock(false);
    setStatus('Ошибка: ' + msg.message, 'error');
  }
});

async function runImport() {
  if (busy) return;
  const html = $('html').value.trim();
  if (!html) {
    setStatus('Сначала вставь HTML', 'error');
    return;
  }
  const [width, height] = currentSize();
  lock(true);
  try {
    const prep = prepareHtml(html, { agent: true });
    setStatus(prep.jsx ? 'Собираю React-компонент…' : prep.tailwind ? 'Рендерю страницу (подключаю Tailwind)…' : 'Рендерю страницу…');
    const { root, images, warnings } = await renderAndExtract(prep.html, {
      width, height, autoLayout: $('autolayout').checked, images: $('images').checked,
    });
    lastWarnings = warnings || [];
    setStatus('Создаю слои в Figma…');
    parent.postMessage({ pluginMessage: { type: 'import', doc: { name: root.name, root, images } } }, '*');
  } catch (err) {
    console.error(err);
    lock(false);
    setStatus('Ошибка: ' + ((err && err.message) || err), 'error');
  }
}

// Renders the page in an iframe under the UI (scaled to fit the plugin window,
// so scroll-triggered effects inside it still fire) and asks the agent for the tree.
// The frame is sandboxed (scripts only: no access to the UI, no dialogs, no top
// navigation), always light, and torn down as soon as the agent has answered.
function renderAndExtract(html, opts) {
  const old = $('stage');
  if (old) old.remove();
  const stage = document.createElement('iframe');
  stage.id = 'stage';
  stage.setAttribute('aria-hidden', 'true');
  stage.setAttribute('sandbox', 'allow-scripts');
  stage.style.colorScheme = 'light';
  stage.style.width = opts.width + 'px';
  stage.style.height = opts.height + 'px';
  stage.style.transform = `scale(${Math.min(1, window.innerWidth / opts.width)})`;
  document.body.appendChild(stage);

  return new Promise((resolve, reject) => {
    let ready = false, acked = false, asked = false, finished = false;
    let idle = 0, ackTimer = 0;
    const loadTimer = setTimeout(() => ask(), 30000);
    const hardCap = setTimeout(() => done(new Error('страница не ответила за 3 минуты')), 180000);
    // Inactivity watchdog: long pages that keep reporting progress are fine.
    const bump = () => { clearTimeout(idle); idle = setTimeout(() => done(new Error('страница перестала отвечать')), 60000); };
    function done(err, value) {
      if (finished) return;
      finished = true;
      [idle, ackTimer, loadTimer, hardCap].forEach(clearTimeout);
      window.removeEventListener('message', onMessage);
      // Stop the page's timers, media and scripts; deferred so we're not inside its message dispatch.
      setTimeout(() => { if (stage.isConnected) stage.remove(); }, 0);
      if (err) reject(err); else resolve(value);
    }
    function ask() {
      if (asked || finished) return;
      asked = true;
      bump();
      try { stage.contentWindow.postMessage({ h2f: 'extract', opts }, '*'); } catch (e) {}
      ackTimer = setTimeout(() => {
        if (acked) return;
        done(new Error(ready
          ? 'страница не отвечает (зависший скрипт?)'
          : 'не удалось запустить разбор страницы: HTML, похоже, обрезан до <head> или содержит незакрытый <script>/<style>/комментарий'));
      }, 8000);
    }
    function onMessage(e) {
      if (e.source !== stage.contentWindow || !e.data || e.data.h2f !== true) return;
      const k = e.data.kind;
      if (k === 'ready') ready = true;
      else if (k === 'ack') { acked = true; bump(); }
      else if (k === 'progress') { bump(); setStatus(e.data.text); }
      else if (k === 'error') done(new Error(e.data.message));
      else if (k === 'result') done(null, e.data);
    }
    window.addEventListener('message', onMessage);
    stage.onload = () => { clearTimeout(loadTimer); ask(); };
    stage.srcdoc = html;
  });
}
</script>
</body>
</html>
