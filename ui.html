      for (const n of [inner, ...inner.querySelectorAll('*')]) {
        n.removeAttribute('id');
        for (const a of [...n.attributes]) if (/currentColor/i.test(a.value)) n.setAttribute(a.name, a.value.replace(/currentColor/gi, color));
      }
      g.appendChild(inner);
      u.replaceWith(g);
    }
  }
  for (const u of clone.querySelectorAll('use')) u.remove();
}

// url(#id) / href="#id" defined in another <svg> of the page: copied into <defs>.
function inlineDefs(clone) {
  const has = (id) => !!clone.querySelector(`[id="${CSS.escape(id)}"]`);
  const refs = (n) => {
    const out = [];
    for (const a of n.attributes) {
      let m;
      const re = /url\(\s*["']?#([^"')\s]+)["']?\s*\)/g;
      while ((m = re.exec(a.value))) out.push(m[1]);
      if (/^(xlink:)?href$/.test(a.name) && a.value[0] === '#') out.push(a.value.slice(1));
    }
    return out;
  };
  let defs = null;
  const seen = new Set();
  const queue = [clone, ...clone.querySelectorAll('*')];
  while (queue.length) {
    const n = queue.shift();
    for (const id of refs(n)) {
      if (seen.has(id) || has(id)) continue;
      seen.add(id);
      const t = S.doc.getElementById(id);
      if (!t || t.namespaceURI !== SVG_NS) continue;
      const c = t.cloneNode(true);
      const ts = [t, ...t.querySelectorAll('*')], cs2 = [c, ...c.querySelectorAll('*')];
      ts.forEach((x, i) => {
        if (x.tagName.toLowerCase() !== 'stop' || !cs2[i]) return;
        const xs = getComputedStyle(x);
        const pv = svgPaint(xs.stopColor);
        cs2[i].setAttribute('stop-color', pv.v);
        cs2[i].setAttribute('stop-opacity', String(r2((parseFloat(xs.stopOpacity) || 0) * pv.a * 1000) / 1000));
        cs2[i].removeAttribute('style');
        cs2[i].removeAttribute('class');
      });
      if (!defs) {
        defs = S.doc.createElementNS(SVG_NS, 'defs');
        clone.insertBefore(defs, clone.firstChild);
      }
      defs.appendChild(c);
      queue.push(c, ...c.querySelectorAll('*'));
    }
  }
  // Never leave a dangling reference: the importer would fail or paint black.
  for (const n of [clone, ...clone.querySelectorAll('*')]) {
    for (const a of [...n.attributes]) {
      const m = /url\(\s*["']?#([^"')\s]+)/.exec(a.value);
      if (m && !has(m[1])) n.removeAttribute(a.name);
    }
  }
}

// ---------- auto layout ----------

// Turns a frame into Auto Layout only when its measured children already sit
// exactly where Auto Layout would put them; otherwise positions stay absolute.
function tryAutoLayout(frame, cs) {
  if (!S.opts.autoLayout) return;
  const kids = frame.children.filter((k) => !k.absolute);
  if (!kids.length) return;
  const flex = /flex/.test(cs.display);
  const dirs = flex ? [/column/.test(cs.flexDirection) ? 'VERTICAL' : 'HORIZONTAL'] : ['VERTICAL', 'HORIZONTAL'];
  const sb = flex && /space-between/.test(cs.justifyContent);
  for (const dir of dirs) {
    const H = dir === 'HORIZONTAL';
    const baseline = flex && H && /^(first )?baseline$/.test(cs.alignItems);
    // row-reverse / column-reverse / `order`: Figma lays out in layer order, so try the visual order.
    const byPos = kids.slice().sort((p, q) => (H ? p.x - q.x : p.y - q.y));
    let ordered = flex && /reverse/.test(cs.flexDirection) ? byPos : kids;
    let layout = fitLayout(frame, ordered, dir, sb, baseline);
    if (!layout && flex && cs.flexWrap === 'nowrap' && ordered !== byPos && byPos.some((k, i) => k !== kids[i])) {
      ordered = byPos;
      layout = fitLayout(frame, ordered, dir, sb, baseline);
    }
    if (layout) {
      if (ordered !== kids) {
        let i = 0;
        frame.children = frame.children.map((c) => (c.absolute ? c : ordered[i++]));
      }
      frame.layout = layout;
      markStretch(frame, ordered, layout);
      return;
    }
  }
}

function fitLayout(frame, kids, dir, spaceBetween, baseline) {
  const T = 1.5;
  const H = dir === 'HORIZONTAL';
  const pos = (k) => (H ? k.x : k.y);
  const len = (k) => (H ? k.w : k.h);
  const cpos = (k) => (H ? k.y : k.x);
  const clen = (k) => (H ? k.h : k.w);
  const main = H ? frame.w : frame.h;
  const cross = H ? frame.h : frame.w;
  const sum = (a) => a.reduce((x, y) => x + y, 0);
  const same = (a) => a.every((v) => Math.abs(v - a[0]) <= T);
  const floor0 = (a) => Math.max(0, Math.min(...a));

  // Main axis: children in DOM order, no overlaps, equal gaps.
  const gaps = [];
  for (let i = 1; i < kids.length; i++) gaps.push(pos(kids[i]) - pos(kids[i - 1]) - len(kids[i - 1]));
  const gap = gaps.length ? sum(gaps) / gaps.length : 0;
  if (gaps.some((g) => Math.abs(g - gap) > T)) return null;
  // Equal overlaps (avatar stacks, -space-x-*) are a negative itemSpacing.
  if (gap < -T) {
    if (spaceBetween) return null;
    for (let i = 1; i < kids.length; i++) if (pos(kids[i]) <= pos(kids[i - 1])) return null;
  }
  const last = kids[kids.length - 1];
  const start = pos(kids[0]);
  const end = main - pos(last) - len(last);
  if (start < -T || end < -T) return null;

  // Cross axis: everyone aligned to the start, the end, or the center.
  const before = kids.map(cpos);
  const after = kids.map((k) => cross - cpos(k) - clen(k));
  if (before.some((v) => v < -T) || after.some((v) => v < -T)) return null;
  let counter, a, b;
  if (same(before)) {
    counter = kids.length === 1 && Math.abs(before[0] - after[0]) <= T && before[0] > T ? 'CENTER' : 'MIN';
    a = floor0(before);
    b = floor0(after);
  } else if (same(after)) {
    counter = 'MAX';
    a = floor0(before);
    b = floor0(after);
  } else {
    const diff = kids.map((k, i) => before[i] - after[i]);
    if (same(diff)) {
      counter = 'CENTER';
      const m = sum(diff) / diff.length;
      a = Math.max(0, m);
      b = Math.max(0, -m);
    } else {
      // Figma derives baselines from text: only trust it for text or nested Auto Layout kids.
      if (!baseline || !kids.every((k) => k.type === 'TEXT' || (k.type === 'FRAME' && k.layout))) return null;
      counter = 'BASELINE';
      a = floor0(before);
      b = floor0(after);
    }
  }

  let primary = 'MIN';
  let spacing = r2(gap < -T ? gap : Math.max(0, gap));
  if (spaceBetween && kids.length > 1) {
    primary = 'SPACE_BETWEEN';
    spacing = 0;
  } else if (kids.length === 1 && Math.abs(start - end) <= T && start > T) {
    primary = 'CENTER';
  }
  // Columns hug their content so text that reflows in Figma pushes siblings down.
  const primarySizing = !H && primary !== 'SPACE_BETWEEN' ? 'AUTO' : 'FIXED';
  const P = (v) => r2(Math.max(0, v));
  const l = { mode: dir, spacing, primaryAlign: primary, counterAlign: counter, primarySizing };
  if (H) Object.assign(l, { pl: P(start), pr: P(end), pt: P(a), pb: P(b) });
  else Object.assign(l, { pt: P(start), pb: P(end), pl: P(a), pr: P(b) });
  return l;
}

function markStretch(frame, kids, l) {
  const H = l.mode === 'HORIZONTAL';
  const inner = H ? frame.h - l.pt - l.pb : frame.w - l.pl - l.pr;
  for (const k of kids) {
    if (k.type === 'SVG') continue;
    if (k.type === 'TEXT' && (H || k.autoResize === 'WIDTH_AND_HEIGHT')) continue;
    // A hugging column can't also fill the height of a row.
    if (H && k.layout && k.layout.primarySizing === 'AUTO') continue;
    if (Math.abs((H ? k.h : k.w) - inner) <= 1.5) k.stretch = true;
  }
}

// ---------- image loading ----------

// Each image gets its own timeout and the whole step a budget: one hung asset
// must not cost the import. Whatever is left gets slow=true (placeholder in Figma).
async function loadImages(list, onProgress, budgetMs = 30000) {
  const queue = list.slice();
  let done = 0;
  const all = new AbortController();
  const deadline = _setTimeout(() => all.abort(), budgetMs);
  const worker = async () => {
    while (queue.length && !all.signal.aborted) {
      const it = queue.shift();
      try {
        const r = await imageBytes(it.url, it.el, all.signal, it.bg, it.dw, it.dh);
        it.bytes = r.bytes;
        if (r.slow) it.slow = true;
      } catch (e) { it.bytes = null; }
      onProgress(++done, list.length);
    }
  };
  try {
    await Promise.all(Array.from({ length: Math.min(6, list.length) }, worker));
  } finally {
    _clearTimeout(deadline);
  }
  for (const it of queue) it.slow = true;
}

function sniff(b) {
  if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47) return 'png';
  if (b[0] === 0xff && b[1] === 0xd8) return 'jpeg';
  if (b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46) return 'gif';
  return null;
}

// Figma accepts PNG/JPEG/GIF up to 4096px; everything else is re-encoded as PNG.
async function imageBytes(url, el, outer, bg, dw, dh) {
  const st = { slow: false };
  const bytes = await imageBytesInner(url, el, outer, (v) => { st.slow = v; }, bg, dw, dh);
  return { bytes, slow: !bytes && st.slow };
}

async function imageBytesInner(url, el, outer, setSlow, bg, dw, dh) {
  let blob = null;
  const ac = new AbortController();
  const t = _setTimeout(() => ac.abort(), 12000); // includes Chrome's cache-lock wait on the <img> request
  const onOuter = () => ac.abort();
  if (outer) { if (outer.aborted) ac.abort(); else outer.addEventListener('abort', onOuter, { once: true }); }
  try {
    // no-store: never queue behind the page's own in-flight <img> request for the same URL (cache lock).
    const res = await (_fetch || fetch)(url, { signal: ac.signal, cache: 'no-store' });
    if (res.ok) blob = await res.blob(); // the body read is covered by the same signal
  } catch (e) {
    if (e && e.name === 'AbortError') setSlow(true); // otherwise CORS or offline
  } finally {
    _clearTimeout(t);
    if (outer) outer.removeEventListener('abort', onOuter);
  }

  if (blob && bg) {
    try { return await composeBackground(blob, bg); } catch (e) { /* fall back to the plain image */ }
  }
  if (blob) {
    const bytes = new Uint8Array(await blob.arrayBuffer());
    let bmp = null;
    try { bmp = await createImageBitmap(blob); } catch (e) {}
    if (sniff(bytes) && (!bmp || (bmp.width <= 4096 && bmp.height <= 4096))) return bytes;
    if (bmp) return toPng(bmp, bmp.width, bmp.height);
    // SVG files can't go through createImageBitmap — draw them via <img>, at
    // twice the largest size they are shown at (vectors re-render sharp).
    const img = await loadImg(URL.createObjectURL(blob));
    const nw = img.naturalWidth || dw || 300, nh = img.naturalHeight || dh || 150;
    const k = Math.max(2, dw ? 2 * dw / nw : 0, dh ? 2 * dh / nh : 0);
    return toPng(img, nw * k, nh * k);
  }
  // Last resort: the copy the page already decoded (fails if the canvas gets tainted).
  if (el && el.complete && el.naturalWidth) {
    try { return await toPng(el, el.naturalWidth, el.naturalHeight); } catch (e) {}
  }
  return null;
}

// One background layer as the browser paints it over the box: background-size,
// background-position (in the padding box) and background-repeat.
async function composeBackground(blob, bg) {
  let src = null, nw = 0, nh = 0;
  try { src = await createImageBitmap(blob); nw = src.width; nh = src.height; } catch (e) {
    src = await loadImg(URL.createObjectURL(blob));
    nw = src.naturalWidth;
    nh = src.naturalHeight;
  }
  const len = (v, ref) => (v === 'auto' ? null : /%$/.test(v) ? parseFloat(v) / 100 * ref : parseFloat(v));
  const sz = bg.size.split(/\s+/);
  let tw = len(sz[0], bg.aw), th = len(sz[1] || 'auto', bg.ah);
  if (/^(cover|contain)$/.test(sz[0])) {
    const iw = nw || bg.aw, ih = nh || bg.ah;
    const k = (sz[0] === 'cover' ? Math.max : Math.min)(bg.aw / iw, bg.ah / ih);
    tw = iw * k;
    th = ih * k;
  } else if (tw == null && th == null) {
    if (nw && nh) { tw = nw; th = nh; } else { const k = Math.min(bg.aw / (nw || 1), bg.ah / (nh || 1)); tw = (nw || 1) * k; th = (nh || 1) * k; }
  } else if (tw == null) tw = nh ? th * nw / nh : th;
  else if (th == null) th = nw ? tw * nh / nw : tw;
  if (!(tw > 0 && th > 0)) throw new Error('empty tile');
  const pos = (v, free) => {
    const c = /^calc\(\s*(-?[\d.]+)%\s*([+-])\s*(-?[\d.]+)px\s*\)$/.exec(v);
    if (c) return free * parseFloat(c[1]) / 100 + (c[2] === '-' ? -1 : 1) * parseFloat(c[3]);
    if (/%$/.test(v)) return free * parseFloat(v) / 100;
    if (/px$/.test(v)) return parseFloat(v);
    return /right|bottom/.test(v) ? free : /center/.test(v) ? free / 2 : 0;
  };
  const x0 = bg.ox + pos(bg.px, bg.aw - tw), y0 = bg.oy + pos(bg.py, bg.ah - th);
  const rp = bg.repeat.split(/\s+/);
  const rx = rp.length > 1 ? rp[0] : rp[0] === 'repeat-y' ? 'no-repeat' : rp[0] === 'repeat-x' ? 'repeat' : rp[0];
  const ry = rp.length > 1 ? rp[1] : rp[0] === 'repeat-x' ? 'no-repeat' : rp[0] === 'repeat-y' ? 'repeat' : rp[0];
  const k = Math.min(2, 4096 / Math.max(bg.w, bg.h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(bg.w * k));
  c.height = Math.max(1, Math.round(bg.h * k));
  const ctx = c.getContext('2d');
  ctx.scale(k, k);
  const xs = rx === 'no-repeat' ? [x0] : [];
  if (rx !== 'no-repeat') for (let x = x0 - Math.ceil(x0 / tw) * tw; x < bg.w; x += tw) xs.push(x);
  const ys = ry === 'no-repeat' ? [y0] : [];
  if (ry !== 'no-repeat') for (let y = y0 - Math.ceil(y0 / th) * th; y < bg.h; y += th) ys.push(y);
  if (xs.length * ys.length > 20000) throw new Error('too many tiles');
  for (const x of xs) for (const y of ys) ctx.drawImage(src, x, y, tw, th);
  const out = await new Promise((r) => c.toBlob(r, 'image/png'));
  if (!out) throw new Error('canvas export failed');
  return new Uint8Array(await out.arrayBuffer());
}

function loadImg(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function toPng(source, w, h) {
  const k = Math.min(1, 4096 / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * k));
  c.height = Math.max(1, Math.round(h * k));
  c.getContext('2d').drawImage(source, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
  if (!blob) throw new Error('canvas export failed');
  return new Uint8Array(await blob.arrayBuffer());
}
}

// ---------- page preparation ----------
// Pure string work, shared with dev/runner.html and dev/fidelity.mjs so the
// harness renders exactly what the plugin renders. No literal closing script
// tags or HTML comment openers in this script: the harness extracts it by regex.

const TAILWIND_CDN = 'https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4';
const REACT_CDN = [
  'https://unpkg.com/react@18.3.1/umd/react.production.min.js',
  'https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js',
  'https://unpkg.com/@babel/standalone@7.24.7/babel.min.js',
];
const LUCIDE_CDN = 'https://unpkg.com/lucide-react@0.453.0/dist/umd/lucide-react.min.js';

// Returns { html, tailwind, jsx }: the document to put into the stage frame.
function prepareHtml(src, opts) {
  let html = src;
  const jsx = looksLikeJsx(html);
  if (jsx) html = wrapJsx(html);
  html = sanitizeForStage(html);
  const tailwind = !jsx && needsTailwind(html);
  if (tailwind) html = injectHead(html, `<script src="${TAILWIND_CDN}"><\/script>`);
  // First thing in <head>, so it runs before any page script and survives a
  // truncated tail (an unclosed script/style/comment would swallow anything appended).
  const boot = `try{(${pageEnvShim})()}catch(e){}` + (opts && opts.agent ? `;(${pageAgent})();` : '');
  html = injectHead(html, `<script>${boot}<\/script>`);
  return { html, tailwind, jsx };
}

// The stage frame has an opaque origin: storage and cookies throw there and
// take the page's own scripts (and whole sections of the page) down with them.
function pageEnvShim() {
  function mk() {
    var m = new Map();
    var api = {
      getItem: function (k) { k = String(k); return m.has(k) ? m.get(k) : null; },
      setItem: function (k, v) { m.set(String(k), String(v)); },
      removeItem: function (k) { m.delete(String(k)); },
      clear: function () { m.clear(); },
      key: function (i) { var a = Array.from(m.keys()); return i < a.length ? a[i] : null; },
    };
    return new Proxy(api, {
      get: function (t, p) { if (p === 'length') return m.size; if (typeof p === 'symbol' || p in api) return api[p]; return m.has(p) ? m.get(p) : undefined; },
      set: function (t, p, v) { if (!(p in api)) m.set(String(p), String(v)); return true; },
      deleteProperty: function (t, p) { m.delete(String(p)); return true; },
      has: function (t, p) { return p in api || m.has(p); },
      ownKeys: function () { return Array.from(m.keys()); },
      getOwnPropertyDescriptor: function (t, p) { return m.has(p) ? { value: m.get(p), enumerable: true, configurable: true, writable: true } : undefined; },
    });
  }
  ['localStorage', 'sessionStorage'].forEach(function (n) {
    try { window[n].getItem('x'); } catch (e) {
      try { Object.defineProperty(window, n, { value: mk(), configurable: true, writable: true }); } catch (_) {}
    }
  });
  try { void document.cookie; } catch (e) {
    try {
      var jar = '';
      Object.defineProperty(Document.prototype, 'cookie', {
        configurable: true,
        get: function () { return jar; },
        set: function (v) {
          var kv = String(v).split(';')[0].trim();
          if (!kv) return;
          var k = kv.split('=')[0];
          jar = jar.split('; ').filter(function (c) { return c && c.split('=')[0] !== k; }).concat(kv).join('; ');
        },
      });
    } catch (_) {}
  }
  try {
    var idb = window.indexedDB;
    idb.open('h2f-probe');
  } catch (e) {
    try {
      Object.defineProperty(window, 'indexedDB', {
        configurable: true,
        value: { open: function () { var rq = { result: null, error: new Error('indexedDB unavailable') }; setTimeout(function () { if (rq.onerror) rq.onerror({ target: rq }); }, 0); return rq; }, deleteDatabase: function () { return {}; } },
      });
    } catch (_) {}
  }
  ['pushState', 'replaceState'].forEach(function (n) {
    var f = history[n];
    history[n] = function () { try { return f.apply(history, arguments); } catch (e) {} };
  });
}

// Meta CSP would block the agent (and its image fetches); meta refresh would
// navigate the stage away. <base href> stays: relative assets depend on it.
function sanitizeForStage(html) {
  return html
    .replace(/<meta\b[^>]*\bhttp-equiv\s*=\s*["']?\s*content-security-policy(-report-only)?\b[^>]*>/gi, '')
    .replace(/<meta\b[^>]*\bhttp-equiv\s*=\s*["']?\s*refresh\b[^>]*>/gi, '')
    .replace(/(<base\b[^>]*?)\s+target\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '$1');
}

// A bare snippet full of utility classes but with no styles at all is almost
// certainly Tailwind markup copied out of a component.
function needsTailwind(html) {
  const src = html.replace(/<\!--[\s\S]*?-->/g, '');
  if (/<style\b|<link\b[^>]*\brel=["']?stylesheet|<script\b[^>]*\bsrc=["']?[^"'>]*tailwind/i.test(src)) return false;
  return /class(Name)?="[^"]*\b(flex|grid|px-\d|py-\d|text-(xs|sm|lg|xl|\dxl)|bg-[a-z]+-\d{2,3}|rounded(-\w+)?)\b/.test(src);
}

// Anything placed before <!doctype> would flip the page into quirks mode.
function injectHead(html, snippet) {
  for (const re of [/<head\b[^>]*>/i, /<html\b[^>]*>/i, /<!doctype[^>]*>/i]) {
    const m = re.exec(html);
    if (m) return html.slice(0, m.index + m[0].length) + snippet + html.slice(m.index + m[0].length);
  }
  return snippet + html;
}

// ---------- JSX / TSX components (v0, Claude artifacts, shadcn) ----------

function stripJsxPreamble(src) {
  let s = src.trimStart();
  for (let m; (m = /^(\/\/[^\n]*\n|\/\*[\s\S]*?\*\/|['"]use (client|server)['"];?)\s*/.exec(s));) s = s.slice(m[0].length);
  return s;
}

function looksLikeJsx(src) {
  const s = stripJsxPreamble(src);
  if (/^<(!doctype|html|head|body|\!--|style|script|link|meta)\b/i.test(s)) return false;
  if (/^(import|export|const|let|var|function|type|interface)\b/.test(s)) {
    return /<[A-Za-z>]/.test(s) && /(className=|return\s*\(?\s*<|=>\s*\(?\s*<)/.test(s);
  }
  // A bare JSX fragment: <div className=...>{...}</div>
  return /^</.test(s) && /\bclassName=/.test(s) && !/\sclass=/.test(s);
}

// Compiles the component in the stage with React + Babel from a CDN. The source
// is embedded as a JSON string, so nothing inside it can break out of the script.
function wrapJsx(src) {
  let code = src;
  if (/^</.test(stripJsxPreamble(src))) code = `export default function App() { return (<>${src}</>); }`;
  const json = JSON.stringify(code).replace(/</g, '\\u003c');
  const libs = REACT_CDN.map((u) => `<script src="${u}"><\/script>`).join('');
  return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">`
    + `<script src="${TAILWIND_CDN}"><\/script>${libs}<script src="${LUCIDE_CDN}"><\/script>`
    + `</head><body><div id="root"></div><script>(${jsxBoot})(${json});<\/script></body></html>`;
}

function jsxBoot(SRC) {

<script>
const $ = (id) => document.getElementById(id);
const PRESETS = { desktop: [1440, 900], laptop: [1280, 800], tablet: [768, 1024], mobile: [390, 844] };
let busy = false;
let lastWarnings = [];

function setStatus(text, kind) {
  const el = $('status');
  el.textContent = text;
  el.className = kind || '';
}

function lock(on) {
  busy = on;
  $('go').disabled = on;
  $('go').textContent = on ? 'Импортирую…' : 'Импортировать';
}

function currentSize() {
  const p = $('preset').value;
  if (p === 'custom') {
    const w = Math.min(4000, Math.max(200, parseInt($('width').value, 10) || 1440));
    return [w, 900];
  }
  return PRESETS[p];
}

function settings() {
  return { preset: $('preset').value, width: $('width').value, autoLayout: $('autolayout').checked, images: $('images').checked };
}

function saveSettings() {
  parent.postMessage({ pluginMessage: { type: 'save-settings', settings: settings() } }, '*');
}

$('preset').addEventListener('change', () => {
  $('width').hidden = $('preset').value !== 'custom';
  saveSettings();
});
for (const id of ['width', 'autolayout', 'images']) $(id).addEventListener('change', saveSettings);

$('open').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', () => {
  if ($('file').files[0]) loadFile($('file').files[0]);
  $('file').value = '';
});

async function loadFile(file) {
  $('html').value = await file.text();
  $('filename').textContent = file.name;
  setStatus('');
}

let dragDepth = 0;
document.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', (e) => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  const file = [...e.dataTransfer.files].find((f) => /\.html?$/i.test(f.name) || f.type === 'text/html') || e.dataTransfer.files[0];
  if (file) loadFile(file);
});

$('html').addEventListener('input', () => { $('filename').textContent = ''; });
$('go').addEventListener('click', runImport);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) runImport();
});

// Messages from the plugin's main thread (code.js).
window.addEventListener('message', (e) => {
  // The stage page runs arbitrary code: never take plugin messages from it.
  const st = $('stage');
  if (st && e.source && e.source === st.contentWindow) return;
  const msg = e.data && e.data.pluginMessage;
  if (!msg) return;
  if (msg.type === 'settings' && msg.settings) {
    const s = msg.settings;
    if (s.preset) $('preset').value = s.preset;
    if (s.width) $('width').value = s.width;
    $('width').hidden = $('preset').value !== 'custom';
    $('autolayout').checked = s.autoLayout !== false;
    $('images').checked = s.images !== false;
  } else if (msg.type === 'progress') {
    setStatus(msg.text);
  } else if (msg.type === 'done') {
    lock(false);
    const extra = msg.failed ? ` (не получилось: ${msg.failed})` : '';
    if (lastWarnings.includes('tailwind')) {
      setStatus(`Готово: ${msg.count} слоёв${extra} — внимание: Tailwind CDN не загрузился, стили потеряны. Проверь сеть и повтори.`, 'warn');
    } else {
      setStatus(`Готово: ${msg.count} слоёв${extra}`, 'ok');
    }
  } else if (msg.type === 'error') {
    lock(false);
    setStatus('Ошибка: ' + msg.message, 'error');
  }
});

async function runImport() {
  if (busy) return;
  const html = $('html').value.trim();
  if (!html) {
    setStatus('Сначала вставь HTML', 'error');
    return;
  }
  const [width, height] = currentSize();
  lock(true);
  try {
    const prep = prepareHtml(html, { agent: true });
    setStatus(prep.jsx ? 'Собираю React-компонент…' : prep.tailwind ? 'Рендерю страницу (подключаю Tailwind)…' : 'Рендерю страницу…');
    const { root, images, warnings } = await renderAndExtract(prep.html, {
      width, height, autoLayout: $('autolayout').checked, images: $('images').checked,
    });
    lastWarnings = warnings || [];
    setStatus('Создаю слои в Figma…');
    parent.postMessage({ pluginMessage: { type: 'import', doc: { name: root.name, root, images } } }, '*');
  } catch (err) {
    console.error(err);
    lock(false);
    setStatus('Ошибка: ' + ((err && err.message) || err), 'error');
  }
}

// Renders the page in an iframe under the UI (scaled to fit the plugin window,
// so scroll-triggered effects inside it still fire) and asks the agent for the tree.
// The frame is sandboxed (scripts only: no access to the UI, no dialogs, no top
// navigation), always light, and torn down as soon as the agent has answered.
function renderAndExtract(html, opts) {
  const old = $('stage');
  if (old) old.remove();
  const stage = document.createElement('iframe');
  stage.id = 'stage';
  stage.setAttribute('aria-hidden', 'true');
  stage.setAttribute('sandbox', 'allow-scripts');
  stage.style.colorScheme = 'light';
  stage.style.width = opts.width + 'px';
  stage.style.height = opts.height + 'px';
  stage.style.transform = `scale(${Math.min(1, window.innerWidth / opts.width)})`;
  document.body.appendChild(stage);

  return new Promise((resolve, reject) => {
    let ready = false, acked = false, asked = false, finished = false;
    let idle = 0, ackTimer = 0;
    const loadTimer = setTimeout(() => ask(), 30000);
    const hardCap = setTimeout(() => done(new Error('страница не ответила за 3 минуты')), 180000);
    // Inactivity watchdog: long pages that keep reporting progress are fine.
    const bump = () => { clearTimeout(idle); idle = setTimeout(() => done(new Error('страница перестала отвечать')), 60000); };

      if (finished) return;
      finished = true;
      [idle, ackTimer, loadTimer, hardCap].forEach(clearTimeout);
      window.removeEventListener('message', onMessage);
      // Stop the page's timers, media and scripts; deferred so we're not inside its message dispatch.

      if (err) reject(err); else resolve(value);
    }
    function ask() {
      if (asked || finished) return;
      asked = true;
      bump();
      try { stage.contentWindow.postMessage({ h2f: 'extract', opts }, '*'); } catch (e) {}

        if (acked) return;
        done(new Error(ready
          ? 'страница не отвечает (зависший скрипт?)'
          : 'не удалось запустить разбор страницы: HTML, похоже, обрезан до <head> или содержит незакрытый <script>/<style>/комментарий'));

      if (e.source !== stage.contentWindow || !e.data || e.data.h2f !== true) return;
      const k = e.data.kind;
      if (k === 'ready') ready = true;
      else if (k === 'ack') { acked = true; bump(); }
      else if (k === 'progress') { bump(); setStatus(e.data.text); }
      else if (k === 'error') done(new Error(e.data.message));
      else if (k === 'result') done(null, e.data);
    }
    window.addEventListener('message', onMessage);
    stage.onload = () => { clearTimeout(loadTimer); ask(); };
    stage.srcdoc = html;
  });
}
</script>
