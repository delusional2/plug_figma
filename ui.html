<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    font: 12px/1.45 Inter, -apple-system, system-ui, sans-serif;
    color: var(--figma-color-text, #1e1e1e);
    background: var(--figma-color-bg, #fff);
  }
  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
    height: 100%;
    padding: 16px;
    background: var(--figma-color-bg, #fff);
  }
  h1 { margin: 0; font-size: 13px; font-weight: 600; }
  .muted { margin: 2px 0 0; color: var(--figma-color-text-secondary, #757575); }
  .drop {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
  }
  textarea {
    flex: 1;
    resize: none;
    padding: 10px;
    border: 1px solid var(--figma-color-border, #e6e6e6);
    border-radius: 6px;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: inherit;
    background: var(--figma-color-bg-secondary, #f5f5f5);
    outline: none;
  }
  textarea:focus { border-color: var(--figma-color-border-selected, #0d99ff); }
  .drop-hint {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    border: 2px dashed var(--figma-color-border-brand-strong, #0d99ff);
    border-radius: 6px;
    font-weight: 600;
    color: var(--figma-color-text-brand, #0d99ff);
    background: var(--figma-color-bg-brand-tertiary, rgba(13, 153, 255, .08));
    pointer-events: none;
  }
  body.dragging .drop-hint { display: flex; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row > .grow { flex: 1; min-width: 0; }
  .filename { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--figma-color-text-secondary, #757575); }
  select, input[type="number"] {
    height: 28px;
    padding: 0 8px;
    border: 1px solid var(--figma-color-border, #e6e6e6);
    border-radius: 5px;
    font: inherit;
    color: inherit;
    background: var(--figma-color-bg, #fff);
  }
  input[type="number"] { width: 84px; }
  label.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  label.check input { margin: 0; accent-color: var(--figma-color-bg-brand, #0d99ff); }
  .hint { color: var(--figma-color-text-tertiary, #b3b3b3); }
  button {
    height: 32px;
    padding: 0 14px;
    border-radius: 6px;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  button.primary {
    border: 0;
    color: var(--figma-color-text-onbrand, #fff);
    background: var(--figma-color-bg-brand, #0d99ff);
  }
  button.primary:hover { background: var(--figma-color-bg-brand-hover, #0a86e0); }
  button.secondary {
    border: 1px solid var(--figma-color-border, #e6e6e6);
    color: inherit;
    background: transparent;
  }
  button:disabled { opacity: .5; cursor: default; }
  #status { min-height: 18px; color: var(--figma-color-text-secondary, #757575); }
  #status.error { color: var(--figma-color-text-danger, #f24822); }
  #status.ok { color: var(--figma-color-text-success, #14ae5c); }
  #status.warn { color: var(--figma-color-text-warning, #b86200); }
  /* The page being imported renders here, under the UI. It is scaled to fit
     the plugin window so scroll-triggered effects inside it still fire. */
  #stage {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 0;
    border: 0;
    transform-origin: 0 0;
    pointer-events: none;
    background: #fff;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>HTML → Figma</h1>
    <p class="muted">Вставь HTML или перетащи .html файл — получишь редактируемые слои.</p>
  </header>

  <div class="drop">
    <textarea id="html" spellcheck="false" placeholder="<!doctype html>&#10;<html>…</html>"></textarea>
    <div class="drop-hint">Отпусти файл</div>
  </div>

  <div class="row">
    <button id="open" class="secondary">Открыть файл…</button>
    <span id="filename" class="filename grow"></span>
    <input id="file" type="file" accept=".html,.htm,text/html" hidden>
  </div>

  <div class="row">
    <span>Ширина</span>
    <select id="preset" class="grow">
      <option value="desktop">Десктоп · 1440</option>
      <option value="laptop">Ноутбук · 1280</option>
      <option value="tablet">Планшет · 768</option>
      <option value="mobile">Телефон · 390</option>
      <option value="custom">Своя…</option>
    </select>
    <input id="width" type="number" min="200" max="4000" step="10" value="1440" hidden>
  </div>

  <label class="check"><input id="autolayout" type="checkbox" checked> Auto Layout там, где получится</label>
  <label class="check"><input id="images" type="checkbox" checked> Загружать картинки</label>

  <div class="row">
    <button id="go" class="primary grow">Импортировать</button>
  </div>
  <div id="status"><span class="hint">⌘/Ctrl + Enter — импорт</span></div>
</main>

<script>
// The page agent. Its source is injected into the iframe that renders the
// imported HTML and runs there: Figma's plugin UI is sandboxed, so it can't
// read the iframe's DOM from outside. The agent measures the page and posts
// the finished layer tree back to the UI.
function pageAgent() {
// prepareHtml() puts the agent at the very top of <head>; never run twice.
if (window.__h2fAgent) return;
window.__h2fAgent = true;
const SKIP_TAGS = new Set(['SCRIPT', 'STYLE', 'LINK', 'META', 'HEAD', 'TITLE', 'NOSCRIPT', 'TEMPLATE', 'BASE', 'WBR']);
const ATOMIC_TAGS = new Set(['IMG', 'SVG', 'VIDEO', 'CANVAS', 'IFRAME', 'INPUT', 'TEXTAREA', 'SELECT', 'BUTTON', 'OBJECT', 'EMBED', 'PICTURE', 'AUDIO']);
const ALIGN = { left: 'LEFT', start: 'LEFT', '-webkit-left': 'LEFT', right: 'RIGHT', end: 'RIGHT', '-webkit-right': 'RIGHT', center: 'CENTER', '-webkit-center': 'CENTER', justify: 'JUSTIFIED' };
const TEXT_CASE = { uppercase: 'UPPER', lowercase: 'LOWER', capitalize: 'TITLE' };
const FIT_MODES = { contain: 'FIT', 'scale-down': 'FIT' };
const SIDES = ['Top', 'Right', 'Bottom', 'Left'];
const SHAPE_PROPS = ['fill', 'fill-opacity', 'fill-rule', 'clip-rule', 'stroke', 'stroke-width', 'stroke-opacity', 'stroke-linecap', 'stroke-linejoin', 'stroke-dasharray', 'opacity'];
const STOP_PROPS = ['stop-color', 'stop-opacity'];
const PLACEHOLDER_FILL = { type: 'SOLID', color: { r: 0.86, g: 0.86, b: 0.88 }, opacity: 1 };
// Finish CSS animations instantly so elements are caught in their final state.
const KILL_MOTION = '*,*::before,*::after{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:0s!important;transition-delay:0s!important}html{scroll-behavior:auto!important}';

// The agent's own timers and fetches must not count as "the page is still busy".
const _setTimeout = window.setTimeout.bind(window);
const _clearTimeout = window.clearTimeout.bind(window);
const _fetch = window.fetch ? window.fetch.bind(window) : null;
const sleep = (ms) => new Promise((r) => _setTimeout(r, ms));
const r2 = (v) => Math.round(v * 100) / 100;
const clamp01 = (v) => Math.min(1, Math.max(0, v));

const S = { win: window, doc: document, opts: null, images: new Map(), css: new WeakMap(), deco: new Map() };

const motion = document.createElement('style');
motion.textContent = KILL_MOTION;
(document.head || document.documentElement).appendChild(motion);

const send = (msg) => parent.postMessage(Object.assign({ h2f: true }, msg), '*');

// Pending async work of the page (SPAs render after fetch / setTimeout), tracked
// from the top of <head> so that settle() can wait until the DOM stops changing.
const PEND = { net: 0, timers: new Set(), depth: 0, lastMut: performance.now() };
(function track() {
  try {
    const st = window.setTimeout, ct = window.clearTimeout;
    window.setTimeout = function (fn, ms) {
      const d = +ms || 0;
      if (typeof fn !== 'function' || d < 50 || d > 5000) return st.apply(window, arguments);
      const rest = [].slice.call(arguments, 2);
      let id;
      const wrapped = function () {
        PEND.timers.delete(id);
        PEND.depth++;
        try { return fn.apply(this, arguments); } finally { PEND.depth--; }
      };
      id = st.apply(window, [wrapped, d].concat(rest));
      // Chains (a timer scheduling the next one: carousels, typewriters) never end.
      if (!PEND.depth) PEND.timers.add(id);
      return id;
    };
    window.clearTimeout = function (id) { PEND.timers.delete(id); return ct.apply(window, arguments); };
  } catch (e) {}
  try {
    if (window.fetch) {
      const f = window.fetch;
      window.fetch = function () {
        PEND.net++;
        let p;
        try { p = f.apply(window, arguments); } catch (e) { PEND.net--; throw e; }
        const dec = () => { PEND.net--; };
        Promise.resolve(p).then(dec, dec);
        return p;
      };
    }
  } catch (e) {}
  try {
    const xs = XMLHttpRequest.prototype.send;
    XMLHttpRequest.prototype.send = function () {
      let open = true;
      const end = () => { if (open) { open = false; PEND.net--; } };
      PEND.net++;
      this.addEventListener('loadend', end);
      try { return xs.apply(this, arguments); } catch (e) { end(); throw e; }
    };
  } catch (e) {}
  try {
    new MutationObserver(() => { PEND.lastMut = performance.now(); })
      .observe(document.documentElement, { subtree: true, childList: true, attributes: true, characterData: true });
  } catch (e) {}
})();

addEventListener('message', async (e) => {
  if (e.source !== parent || !e.data || e.data.h2f !== 'extract') return;
  send({ kind: 'ack' });
  try {
    const opts = e.data.opts;
    const warnings = [];
    send({ kind: 'progress', text: 'Жду, пока страница догрузится…' });
    try { if (!(await tailwindOk())) warnings.push('tailwind'); } catch (err) {}
    try { forceLightScheme(); } catch (err) {}
    await settle();
    // Scroll through the page so lazy images and "reveal on scroll" scripts fire.
    const total = docHeight();
    for (let y = 0; y < total; y += opts.height * 0.75) {
      scrollTo(0, y);
      await sleep(40);
    }
    scrollTo(0, 0);
    await settle();

    send({ kind: 'progress', text: 'Разбираю вёрстку…' });
    try { materializePseudos(); } catch (err) { console.warn('html-to-figma: pseudo-elements skipped', err); }
    const root = extract(opts);
    const list = [...S.images.values()];
    if (list.length) await loadImages(list, (i, n) => send({ kind: 'progress', text: `Загружаю картинки ${i}/${n}…` }));
    const images = list.map((it) => ({ ref: it.ref, url: /^https?:/i.test(it.url) ? it.url : null, bytes: it.bytes || null, slow: it.slow || undefined }));
    send({ kind: 'result', root, images, warnings });
  } catch (err) {
    send({ kind: 'error', message: String((err && err.message) || err) });
  }
});
send({ kind: 'ready' });

// Resolves once the page has had no pending fetch/XHR/short timer and no DOM
// mutation for a moment (or when the time budget runs out: some pages never rest).
async function quiet(ms) {
  const end = performance.now() + ms;
  while (performance.now() < end) {
    const busy = PEND.net > 0 || PEND.timers.size > 0 || document.querySelector('[aria-busy="true"]');
    if (!busy && performance.now() - PEND.lastMut > 400) return;
    await sleep(50);
  }
}

async function settle() {
  await quiet(8000);
  try { await Promise.race([document.fonts.ready, sleep(5000)]); } catch (e) {}
  const pending = [...document.images].filter((i) => !i.complete).map((i) => new Promise((r) => {
    i.addEventListener('load', r, { once: true });
    i.addEventListener('error', r, { once: true });
  }));
  await Promise.race([Promise.all(pending), sleep(8000)]);
  await sleep(300);
}

// The Tailwind CDN compiles utilities at runtime; when it failed to load the page
// is silently unstyled, so check that a utility class actually took effect.
async function tailwindOk() {
  const uses = [...document.scripts].some((s) => /tailwind/i.test(s.src)) || document.querySelector('style[type="text/tailwindcss"]');
  if (!uses || !document.body) return true;
  const probe = document.createElement('div');
  probe.className = 'hidden';
  document.body.appendChild(probe);
  let ok = false;
  for (let t = 0; t < 8000; t += 100) {
    if (getComputedStyle(probe).display === 'none') { ok = true; break; }
    await sleep(100);
  }
  probe.remove();
  return ok;
}

// The UI asks for a light stage; if the engine ignored that, neutralise the
// page's prefers-color-scheme: dark rules so the import doesn't follow the OS theme.
function forceLightScheme() {
  if (!matchMedia('(prefers-color-scheme: dark)').matches) return;
  const fix = (t) => t.replace(/\(\s*prefers-color-scheme\s*:\s*dark\s*\)/gi, '(max-width: 0px)')
    .replace(/\(\s*prefers-color-scheme\s*:\s*light\s*\)/gi, '(min-width: 0px)');
  const walkRules = (rules) => {
    for (const r of rules) {
      try {
        if (r.media && /prefers-color-scheme/i.test(r.media.mediaText)) r.media.mediaText = fix(r.media.mediaText);
        if (r.cssRules) walkRules(r.cssRules);
      } catch (e) {}
    }
  };
  for (const sh of document.styleSheets) {
    try { walkRules(sh.cssRules); } catch (e) { /* cross-origin sheet */ }
  }
  for (const el of document.querySelectorAll('link[media], source[media], style[media]')) {
    const m = el.getAttribute('media');
    if (/prefers-color-scheme/i.test(m)) el.setAttribute('media', fix(m));
  }
}

function docHeight() {
  return Math.max(document.documentElement.scrollHeight, document.body ? document.body.scrollHeight : 0);
}

// ---------- extraction ----------

function css(el, pseudo) {
  if (pseudo) return S.win.getComputedStyle(el, pseudo);
  let c = S.css.get(el);
  if (!c) {
    c = S.win.getComputedStyle(el);
    S.css.set(el, c);
  }
  return c;
}

// ---------- ::before / ::after ----------
// Pseudo-elements have no DOM node and no rect, so they are turned into real
// elements with the same computed style once the layout is final. In-flow ones
// go into the host (a host whose layout moved because of that — :last-child,
// sibling selectors — is reverted); absolute ones go into a proxy outside <body>
// placed over their containing block, and walk() picks them up for the host.

const PSEUDO_TAG = 'h2f-pseudo';
const NO_PSEUDO_TAGS = new Set(['IMG', 'SVG', 'VIDEO', 'CANVAS', 'IFRAME', 'TEXTAREA', 'SELECT', 'OBJECT', 'EMBED', 'AUDIO', 'BR', 'HR', 'PICTURE']);

function fmtCounter(n, style) {
  const alpha = (k, base) => { let s = ''; for (; k > 0; k = Math.floor((k - 1) / 26)) s = String.fromCharCode(base + ((k - 1) % 26)) + s; return s; };
  const roman = (k) => {
    if (k <= 0 || k >= 4000) return String(k);
    const t = [[1000, 'm'], [900, 'cm'], [500, 'd'], [400, 'cd'], [100, 'c'], [90, 'xc'], [50, 'l'], [40, 'xl'], [10, 'x'], [9, 'ix'], [5, 'v'], [4, 'iv'], [1, 'i']];
    let s = '';
    for (const [v, r] of t) while (k >= v) { s += r; k -= v; }
    return s;
  };
  switch (style) {
    case 'none': return '';
    case 'disc': return '•';
    case 'circle': return '◦';
    case 'square': return '▪';
    case 'disclosure-open': return '▾';
    case 'disclosure-closed': return '▸';
    case 'decimal-leading-zero': return (n < 0 ? '-' : '') + (Math.abs(n) < 10 ? '0' : '') + Math.abs(n);
    case 'lower-roman': return roman(n);
    case 'upper-roman': return roman(n).toUpperCase();
    case 'lower-alpha': case 'lower-latin': return n > 0 ? alpha(n, 97) : String(n);
    case 'upper-alpha': case 'upper-latin': return n > 0 ? alpha(n, 65) : String(n);
    case 'lower-greek': return n > 0 && n <= 24 ? 'αβγδεζηθικλμνξοπρστυφχψω'[n - 1] : String(n);
    default: return String(n);
  }
}

// "a 1 b 2" -> [[a, 1], [b, 2]]
function counterPairs(v, dflt) {
  const out = [];
  if (!v || v === 'none') return out;
  const t = v.trim().split(/\s+/);
  for (let i = 0; i < t.length; i++) {
    if (/^-?\d+$/.test(t[i])) continue;
    const n = i + 1 < t.length && /^-?\d+$/.test(t[i + 1]) ? parseInt(t[i + 1], 10) : dflt;
    out.push([t[i], n]);
  }
  return out;
}

// Splits a computed `content` value into tokens: strings, functions, keywords.
function contentTokens(v) {
  const out = [];
  let i = 0;
  while (i < v.length) {
    const ch = v[i];
    if (ch === '"' || ch === "'") {
      let s = '';
      i++;
      while (i < v.length && v[i] !== ch) {
        if (v[i] === '\\') {
          const hex = /^[0-9a-fA-F]{1,6} ?/.exec(v.slice(i + 1, i + 8));
          if (hex) { s += String.fromCodePoint(parseInt(hex[0], 16) || 0xfffd); i += 1 + hex[0].length; }
          else { s += v[i + 1] || ''; i += 2; }
        } else s += v[i++];
      }
      i++;
      out.push({ str: s });
    } else if (ch === '/') {
      break; // alt text for screen readers
    } else if (/\s/.test(ch)) {
      i++;
    } else {
      const m = /^([\w-]+)(\()?/.exec(v.slice(i));
      if (!m) { i++; continue; }
      if (m[2]) {
        let depth = 0, j = i;
        for (; j < v.length; j++) {
          if (v[j] === '(') depth++;
          else if (v[j] === ')' && --depth === 0) break;
        }
        out.push({ fn: m[1], args: v.slice(i + m[0].length, j) });
        i = j + 1;
      } else {
        out.push({ kw: m[1] });
        i += m[0].length;
      }
    }
  }
  return out;
}

function isStackingContext(cs, parentCs) {
  const pos = cs.position !== 'static';
  const zSet = cs.zIndex !== 'auto';
  return (pos && zSet) || cs.position === 'fixed' || cs.position === 'sticky'
    || (zSet && parentCs && /flex|grid/.test(parentCs.display))
    || parseFloat(cs.opacity) < 1 || cs.transform !== 'none' || cs.filter !== 'none'
    || (cs.backdropFilter && cs.backdropFilter !== 'none') || cs.isolation === 'isolate'
    || cs.mixBlendMode !== 'normal' || (cs.clipPath && cs.clipPath !== 'none')
    || /paint|layout|strict|content/.test(cs.contain || '') || /transform|opacity|filter/.test(cs.willChange || '');
}

// A z-index:-1 decoration paints under the backgrounds of its non-stacking
// ancestors; when one of them is painted the browser shows nothing of it.
function negZHidden(el) {
  for (let a = el; a && a !== S.doc.documentElement; a = a.parentElement) {
    const cs = getComputedStyle(a);
    if (isStackingContext(cs, a.parentElement ? getComputedStyle(a.parentElement) : null)) return false;
    const c = parseColor(cs.backgroundColor);
    if ((c && c.a > 0) || cs.backgroundImage !== 'none') return true;
  }
  return false;
}

function materializePseudos() {
  const d = S.doc;
  if (!d.body) return;
  S.pseudo = new WeakMap();
  const recs = [];
  const lis = [];
  // Counters in document order (counter-reset scopes end with the parent).
  const stacks = new Map();
  const inst = (name) => { const s = stacks.get(name); return s && s.length ? s[s.length - 1] : null; };
  const applyCounters = (cs, owned, isLi) => {
    for (const [n, v] of counterPairs(cs.counterReset, 0)) { const c = { v }; if (!stacks.has(n)) stacks.set(n, []); stacks.get(n).push(c); owned.push(n); }
    for (const [n, v] of counterPairs(cs.counterSet, 0)) { const c = inst(n); if (c) c.v = v; }
    const incs = counterPairs(cs.counterIncrement, 1);
    if (isLi && !incs.some((p) => p[0] === 'list-item')) incs.push(['list-item', 1]);
    for (const [n, v] of incs) {
      let c = inst(n);
      if (!c) { c = { v: 0 }; if (!stacks.has(n)) stacks.set(n, []); stacks.get(n).push(c); owned.push(n); }
      c.v += v;
    }
  };
  const counterText = (fn, args) => {
    const a = splitTop(args).map((s) => s.trim());
    if (fn === 'counter') { const c = inst(a[0]); return fmtCounter(c ? c.v : 0, a[1] || 'decimal'); }
    const s = stacks.get(a[0]) || [];
    const sep = contentTokens(a[1] || '""')[0];
    const vals = s.length ? s.map((c) => fmtCounter(c.v, a[2] || 'decimal')) : [fmtCounter(0, a[2] || 'decimal')];
    return vals.join(sep && sep.str != null ? sep.str : '');
  };
  let quoteDepth = 0;
  const readPseudo = (el, p) => {
    let pcs;
    try { pcs = getComputedStyle(el, p); } catch (e) { return null; }
    const content = pcs.content;
    if (!content || content === 'none' || content === 'normal' || pcs.display === 'none') return null;
    const owned = [];
    applyCounters(pcs, owned, false);
    const parts = [];
    const quotes = (pcs.quotes && pcs.quotes !== 'auto' && pcs.quotes !== 'none') ? contentTokens(pcs.quotes).map((t) => t.str || '') : ['“', '”', '‘', '’'];
    for (const t of contentTokens(content)) {
      if (t.str != null) parts.push({ text: t.str });
      else if (t.fn === 'attr') parts.push({ text: el.getAttribute(t.args.trim().split(/\s+/)[0]) || '' });
      else if (t.fn === 'counter' || t.fn === 'counters') parts.push({ text: counterText(t.fn, t.args) });
      else if (t.fn === 'url') { const u = contentTokens(t.args)[0]; parts.push({ img: u && u.str != null ? u.str : t.args.trim() }); }
      else if (t.kw === 'open-quote') { const q = quotes[Math.min(quoteDepth, (quotes.length >> 1) - 1) * 2] || ''; quoteDepth++; parts.push({ text: q }); }
      else if (t.kw === 'close-quote') { quoteDepth = Math.max(0, quoteDepth - 1); parts.push({ text: quotes[Math.min(quoteDepth, (quotes.length >> 1) - 1) * 2 + 1] || '' }); }
    }
    for (const n of owned) stacks.get(n).pop(); // a pseudo's own reset ends with it
    const decl = [];
    for (let i = 0; i < pcs.length; i++) {
      const k = pcs[i];
      if (k === 'content' || k.startsWith('--')) continue;
      decl.push([k, pcs.getPropertyValue(k)]);
    }
    return { el, p, pcs, parts, decl, oof: pcs.position === 'absolute' || pcs.position === 'fixed', z: pcs.zIndex === 'auto' ? 0 : parseInt(pcs.zIndex, 10) || 0 };
  };
  (function visit(el) {
    const owned = [];
    const tag = el.tagName.toUpperCase();

    const canHost = !NO_PSEUDO_TAGS.has(tag) && (tag !== 'INPUT' || /^(checkbox|radio)$/i.test(el.type)) && el !== d.body.parentNode;
    const b = canHost ? readPseudo(el, '::before') : null;

  })(d.body);
  if (!recs.length && !lis.length) return;

  const style = d.createElement('style');
  style.textContent = '[data-h2f-b]::before{content:none!important}[data-h2f-a]::after{content:none!important}' + PSEUDO_TAG + '{display:inline}';
  (d.head || d.documentElement).appendChild(style);

  const build = (r) => {
    const s = d.createElement(PSEUDO_TAG);
    s.setAttribute('data-h2f-pseudo', r.el.tagName.toLowerCase() + r.p);
    s.style.cssText = r.decl.map(([k, v]) => `${k}:${v} !important`).join(';');
    for (const part of r.parts) {
      if (part.text) s.appendChild(d.createTextNode(part.text));
      else if (part.img) { const im = d.createElement('img'); im.src = part.img; im.style.cssText = 'all:initial!important'; s.appendChild(im); }
    }

    const at = r.p === '::before' ? 'data-h2f-b' : 'data-h2f-a';
    if (on) r.el.setAttribute(at, ''); else r.el.removeAttribute(at);
  };

  // fixed layer at the viewport origin (the page is scrolled to the top), so
  // that it never adds to the document's scroll height.
  const layer = d.createElement(PSEUDO_TAG);
  layer.setAttribute('data-h2f-proxy', '');
  layer.style.cssText = 'all:initial!important;position:fixed!important;left:0!important;top:0!important;width:0!important;height:0!important;display:block!important;pointer-events:none!important;z-index:2147483647!important';
  d.documentElement.appendChild(layer);
  const addProxy = (el, which, node) => {
    const e = S.pseudo.get(el) || { before: [], after: [] };
    e[which].push(node);
    S.pseudo.set(el, e);
  };

  // In-flow pseudo-elements of a checkbox/radio (replaced, can't take children):
  // laid out in a copy of the control's box placed over it.
  const boxCopies = new Map();
  for (const r of recs) {

    try {
      let copy = boxCopies.get(r.el);

        for (let i = 0; i < ics.length; i++) { const k = ics[i]; if (!k.startsWith('--')) decl.push(`${k}:${ics.getPropertyValue(k)} !important`); }

        layer.appendChild(copy);

    } catch (e) {
      console.warn('html-to-figma: skipped a pseudo-element', e);
    }
  }

  // In-flow: into the host, then check that nothing around it moved.
  const inflow = recs.filter((r) => !r.oof && r.el.tagName !== 'INPUT');
  const hosts = new Map();
  for (const r of inflow) {
    if (!hosts.has(r.el)) {
      const watch = [r.el, r.el.parentElement].concat([...r.el.children]).filter(Boolean);
      hosts.set(r.el, { recs: [], watch, rects: watch.map((w) => w.getBoundingClientRect()) });
    }
    hosts.get(r.el).recs.push(r);
  }
  for (const [el, h] of hosts) {
    for (const r of h.recs) {
      r.span = build(r);
      if (r.p === '::before') el.insertBefore(r.span, el.firstChild);
      else el.appendChild(r.span);
      mark(r, true);
    }
  }
  const moved = (a, b) => Math.abs(a.left - b.left) > 0.5 || Math.abs(a.top - b.top) > 0.5 || Math.abs(a.width - b.width) > 0.5 || Math.abs(a.height - b.height) > 0.5;
  for (let pass = 0; pass < 3; pass++) {
    let reverted = 0;
    for (const [el, h] of hosts) {
      if (h.watch.some((w, i) => moved(w.getBoundingClientRect(), h.rects[i]))) {
        for (const r of h.recs) { r.span.remove(); mark(r, false); }
        hosts.delete(el);
        reverted++;
      }
    }
    if (!reverted) break;
  }

  // List markers: measured (outside: a probe at the content start; inside:
  // just before the first character) and placed in the proxy layer.
  for (const li of lis) {
    try { materializeMarker(li, layer, addProxy); } catch (e) { console.warn('html-to-figma: skipped a list marker', e); }
  }
  for (const r of recs) {
    if (!r.oof) continue;
    try {
      if (r.z < 0 && negZHidden(r.el)) continue;
      let cbBox;
      if (r.pcs.position === 'fixed') {
        cbBox = { x: 0, y: 0, w: S.win.innerWidth, h: S.win.innerHeight };
      } else {
        let cb = r.el;
        for (; cb && cb !== d.body; cb = cb.parentElement) {
          const c = getComputedStyle(cb);
          if (c.position !== 'static' || c.transform !== 'none' || c.filter !== 'none' || /paint|layout|strict|content/.test(c.contain || '')) break;

        const c = getComputedStyle(cb);

          ? { x: 0, y: 0, w: S.win.innerWidth, h: S.win.innerHeight }
          : { x: rc.left + bl, y: rc.top + bt, w: cb.clientWidth || (rc.width - bl - (parseFloat(c.borderRightWidth) || 0)), h: cb.clientHeight || (rc.height - bt - (parseFloat(c.borderBottomWidth) || 0)) };
      }

      proxy.style.cssText = `all:initial!important;position:absolute!important;display:block!important;pointer-events:none!important;left:${cbBox.x}px!important;top:${cbBox.y}px!important;width:${cbBox.w}px!important;height:${cbBox.h}px!important`;
      const span = build(r);
      if (r.pcs.position === 'fixed') span.style.setProperty('position', 'absolute', 'important');
      proxy.appendChild(span);
      layer.appendChild(proxy);
      mark(r, true);
      r.span = span;
      addProxy(r.el, r.p === '::before' ? 'before' : 'after', span);
    } catch (e) {
      console.warn('html-to-figma: skipped a pseudo-element', e);
    }
  }
}

function listOrdinal(li) {
  const p = li.parentElement;
  if (!p) return 1;
  const sibs = [...p.children].filter((c) => /list-item/.test(getComputedStyle(c).display));
  const ol = p.tagName === 'OL';
  const rev = ol && p.reversed;
  let n = ol && p.hasAttribute('start') ? p.start : rev ? sibs.length : 1;
  for (let i = 0; i < sibs.length; i++) {
    if (i > 0) n += rev ? -1 : 1;
    if (sibs[i].hasAttribute('value')) n = parseInt(sibs[i].getAttribute('value'), 10) || 0;
    if (sibs[i] === li) return n;
  }
  return 1;
}

function materializeMarker(li, layer, addProxy) {
  const d = S.doc;
  const cs = getComputedStyle(li);
  const ms = getComputedStyle(li, '::marker');
  if (li.tagName === 'SUMMARY') {
    try { if (getComputedStyle(li, '::-webkit-details-marker').display === 'none') return; } catch (e) {}
  }
  let text = null, img = null;
  const lst = cs.listStyleType;
  const imgM = /^url\(\s*["']?(.*?)["']?\s*\)$/.exec(cs.listStyleImage || '');
  if (/^["']/.test(ms.content || '')) text = (contentTokens(ms.content)[0] || {}).str || '';
  else if (ms.content === 'none') return;
  else if (imgM) img = imgM[1];
  else if (/^["']/.test(lst)) text = (contentTokens(lst)[0] || {}).str || '';
  else if (lst === 'none') return;
  else {
    const symbolic = /^(disc|circle|square|disclosure-open|disclosure-closed)$/.test(lst);
    text = fmtCounter(symbolic ? 0 : listOrdinal(li), lst) + (symbolic ? ' ' : '. ');
  }
  if (!img && !/\S/.test(text || '')) return;
  const span = d.createElement(PSEUDO_TAG);
  span.setAttribute('data-h2f-pseudo', 'marker');
  const font = ['color', 'font-family', 'font-size', 'font-weight', 'font-style', 'font-variant-numeric', 'line-height', 'letter-spacing']
    .map((k) => `${k}:${(k === 'line-height' ? cs : ms).getPropertyValue(k)} !important`).join(';');
  if (img) {
    const im = d.createElement('img');
    im.src = img;
    im.style.cssText = 'all:initial!important;vertical-align:baseline!important';
    span.appendChild(im);
  } else {
    span.appendChild(d.createTextNode(text));
  }
  let left, top;
  if (cs.listStylePosition === 'inside') {
    // Inside: the marker is the start of the first line; it ends where the text begins.
    const w = d.createTreeWalker(li, NodeFilter.SHOW_TEXT);
    let tn;
    while ((tn = w.nextNode()) && !/\S/.test(tn.data)) { /* skip blanks */ }
    if (!tn) return;
    const rg = d.createRange();
    const i = tn.data.search(/\S/);
    rg.setStart(tn, i);
    rg.setEnd(tn, i + 1);
    const cr = rg.getClientRects()[0];
    if (!cr) return;
    span.style.cssText = `position:absolute!important;white-space:pre!important;display:block!important;left:0!important;top:0!important;${font}`;
    layer.appendChild(span);
    const pr = span.getBoundingClientRect();
    // On the first line the marker starts the line box (Chrome's gap is wider than "• ").
    const cb = contentBox(li, cs);
    const firstLine = cr.top - cb.y < Math.max(cr.height, pr.height);
    left = firstLine ? Math.min(cb.x + (parseFloat(cs.textIndent) || 0), cr.left - pr.width) : cr.left - pr.width;
    top = cr.top + (cr.height - pr.height) / 2;
  } else {
    // Outside: right edge at the content start, on the first line box.
    span.style.cssText = `position:absolute!important;white-space:pre!important;transform:translateX(-100%)!important;display:inline!important;${font}`;
    li.insertBefore(span, li.firstChild);
    const r = span.getBoundingClientRect();
    span.remove();
    if (!(r.width > 0 && r.height > 0)) return;
    left = r.left;
    top = r.top;
  }
  span.style.cssText = `position:absolute!important;white-space:pre!important;display:block!important;left:${left}px!important;top:${top}px!important;${font}`;
  layer.appendChild(span);
  addProxy(li, 'before', span);
}

// Layers of the out-of-flow pseudo-elements of el (see materializePseudos).
function pseudoLayers(el, ox, oy) {
  const e = S.pseudo && S.pseudo.get(el);
  if (!e) return null;
  const run = (list) => {
    const out = [];
    for (const s of list) {
      try { for (const n of walk(s, ox, oy)) { n.absolute = true; out.push(n); } } catch (err) { console.warn('html-to-figma: skipped a pseudo-element', err); }
    }
    return out;
  };
  const before = run(e.before), after = run(e.after);
  return before.length || after.length ? { before, after } : null;
}

// ---------- icon fonts ----------
// Icon fonts (Font Awesome, Material Symbols, Bootstrap Icons…) aren't in Figma:
// a PUA glyph would become tofu and a ligature ("home") a plain word. The glyph
// is drawn with the page's own webfont onto a canvas at 3x instead.

const ICON_FAM = /material (icons|symbols)|font ?awesome|bootstrap-icons|remixicon|ionicons|feather|phosphor|tabler|boxicons|line ?awesome|icomoon|glyphicons|fontello|themify|simple-line-icons|lucide|codicon|dashicons|octicons|typicons|entypo|unicons|uicons|icofont|iconfont|fa-solid|fa-regular|fa-brands/i;
const PUA_ONLY = /^[\s\uE000-\uF8FF\u{F0000}-\u{10FFFD}]+$/u;
const FA_MODIFIER = /^fa-(solid|regular|brands|light|thin|duotone|sharp|fw|xs|sm|lg|xl|2xs|2xl|\dx|spin|pulse|beat|fade|bounce|shake|border|inverse|pull-\w+|rotate-\d+|flip-\w+|stack(-\dx)?)$/;

// { text, holder, fcs } when el shows nothing but one icon glyph (or ligature word).
function iconInfo(el) {
  if (!S.opts.images) return null;
  if (S.icons.has(el)) return S.icons.get(el);
  let res = null;
  try {
    const text = (el.textContent || '').trim();
    if (text && text.length <= 40 && !el.querySelector('img,svg,video,canvas,input,textarea,select,iframe')) {
      const w = S.doc.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      let tn, holder = null, ok = true;
      while ((tn = w.nextNode())) {
        if (!/\S/.test(tn.data)) continue;
        if (holder && holder !== tn.parentElement) { ok = false; break; }
        holder = tn.parentElement;
      }
      if (ok && holder) {
        const fcs = css(holder);
        const fam = parseFamilies(fcs.fontFamily)[0] || '';
        if (PUA_ONLY.test(text) || (ICON_FAM.test(fam) && /^[\w-]+$/.test(text))) res = { text, holder, fcs };
      }
    }
  } catch (e) {}
  S.icons.set(el, res);
  return res;
}

function iconGlyph(el, rect, box, ox, oy, visual) {
  const info = iconInfo(el);
  if (!info) return null;
  const range = S.doc.createRange();
  range.selectNodeContents(info.holder);
  const rr = range.getBoundingClientRect();
  if (!(rr.width > 0.5 && rr.height > 0.5)) return null;
  const fcs = info.fcs;
  const k = 3;
  const c = S.doc.createElement('canvas');
  c.width = Math.ceil(rr.width * k);
  c.height = Math.ceil(rr.height * k);
  const ctx = c.getContext('2d');
  ctx.scale(k, k);
  ctx.font = `${fcs.fontStyle} ${fcs.fontWeight} ${fcs.fontSize} ${fcs.fontFamily}`;
  ctx.fillStyle = fcs.webkitTextFillColor && parseColor(fcs.webkitTextFillColor) ? fcs.webkitTextFillColor : fcs.color;
  ctx.textBaseline = 'alphabetic';
  const m = ctx.measureText(info.text);
  const A = m.fontBoundingBoxAscent || parseFloat(fcs.fontSize) * 0.8;
  const D = m.fontBoundingBoxDescent || parseFloat(fcs.fontSize) * 0.2;
  ctx.fillText(info.text, (rr.width - m.width) / 2, (rr.height - (A + D)) / 2 + A);
  const cls = (el.getAttribute('class') || info.holder.getAttribute('class') || '').trim().split(/\s+/).filter((x) => /-/.test(x) && !FA_MODIFIER.test(x));
  const label = /^[\w-]+$/.test(info.text) ? info.text : cls.length ? cls[cls.length - 1] : 'glyph';
  const icon = {
    type: 'RECT', name: `icon · ${label}`.slice(0, 60), x: r2(rr.left - ox), y: r2(rr.top - oy), w: r2(rr.width), h: r2(rr.height),
    fills: [{ type: 'IMAGE', ref: imageRef(c.toDataURL('image/png'), null), scaleMode: 'FILL' }],
  };
  if (!visual.has && !visual.clip) return icon;
  shift(icon, rect.left - ox, rect.top - oy);
  return frameNode(el, box, visual, {}, [icon]);
}

function extract(opts) {
  S.opts = opts;
  S.images = new Map();
  S.css = new WeakMap();
  S.deco = new Map();
  S.paint = new WeakMap();
  S.icons = new WeakMap();
  const d = S.doc;
  const body = d.body;
  const W = opts.width;
  const H = docHeight();
  const box = { x: 0, y: 0, w: W, h: H };
  const htmlCS = css(d.documentElement);
  const bodyCS = css(body);

  // Like the browser: html background paints the canvas, otherwise body's does.
  let fills = backgroundFills(htmlCS, box);
  let children;
  if (fills.length && hasPaint(bodyCS)) {
    children = walk(body, 0, 0);
  } else {
    if (!fills.length) fills = backgroundFills(bodyCS, box);
    children = childrenOf(body, 0, 0);
  }
  if (!fills.length) fills = [solid({ r: 1, g: 1, b: 1, a: 1 })];

  const title = (d.title || '').trim() || 'HTML';
  const root = { type: 'FRAME', name: `${title} · ${W}px`, x: 0, y: 0, w: W, h: H, fills, clip: true, children: paintOrder(children) };
  tryAutoLayout(root, bodyCS);
  return root;
}

function childrenOf(el, ox, oy) {
  const out = [];
  const closed = inClosedDetails(el);
  for (const c of el.childNodes) {
    // One broken element must never cost the whole import.
    try {
      if (c.nodeType === 3) {
        if (closed) continue;
        for (const t of [].concat(looseText(c, el, ox, oy) || [])) out.push(t);
      } else if (c.nodeType === 1) {
        for (const n of walk(c, ox, oy)) out.push(n);
      }
    } catch (e) {
      console.warn('html-to-figma: skipped a node', e);
    }
  }
  return out;
}

// Returns the layers for one element (0, 1 or several when a wrapper is lifted),
// positioned relative to (ox, oy) — the parent layer's top-left in page coordinates.
function walk(el, ox, oy) {
  const out = walkEl(el, ox, oy);
  if (out.length && el.nodeType === 1) {
    try {
      const o = outlineNode(el, ox, oy);
      if (o) out.push(o);
    } catch (e) {}
  }
  // Paint layer of what this element produced, for the parent's ordering (paintOrder).
  if (out.length && el.nodeType === 1) {
    const cs = css(el);
    const pos = cs.position !== 'static';
    const zSet = cs.zIndex !== 'auto';
    const flexItem = zSet && el.parentElement && /flex|grid/.test(css(el.parentElement).display);
    if (pos || flexItem) {
      const z = zSet ? parseInt(cs.zIndex, 10) || 0 : 0;
      for (const n of out) S.paint.set(n, { z, pos: true });
    }
  }
  return out;
}

// outline / outline-offset: a stroke-only rectangle around the border box, as an
// absolute sibling (the element's own overflow never clips its outline).
function outlineNode(el, ox, oy) {
  const cs = css(el);
  const st = cs.outlineStyle;
  if (!st || st === 'none' || st === 'hidden' || cs.display === 'contents') return null;
  const w = parseFloat(cs.outlineWidth) || 0;
  const col = parseColor(cs.outlineColor);
  if (w <= 0 || !col || col.a === 0) return null;
  const rect = el.getBoundingClientRect();
  const e = (parseFloat(cs.outlineOffset) || 0) + w;
  const x = rect.left - ox - e, y = rect.top - oy - e, ww = rect.width + 2 * e, hh = rect.height + 2 * e;
  if (ww <= 2 * w || hh <= 2 * w) return null;
  const rr = radii(cs, { w: rect.width, h: rect.height });
  const grow = (v) => (v > 0 ? r2(Math.max(0, v + e)) : 0);
  const sw = r2(Math.min(w, ww / 2, hh / 2));
  return {
    type: 'RECT', name: 'outline', absolute: true, x: r2(x), y: r2(y), w: r2(ww), h: r2(hh), fills: [],
    stroke: { paint: solid(col), weights: { t: sw, r: sw, b: sw, l: sw }, dash: st === 'dashed' ? [w * 3, w * 2] : st === 'dotted' ? [w, w] : null },
    radii: rr && { tl: grow(rr.tl), tr: grow(rr.tr), br: grow(rr.br), bl: grow(rr.bl) },
  };
}

// CSS paint order inside one stacking level: negative z, in-flow non-positioned,
// positioned (z auto/0) in tree order, then positive z. In-flow layers keep
// their DOM order (Auto Layout depends on it); only absolute ones move freely.
function paintOrder(kids) {
  if (kids.length < 2) return kids;
  const key = (k) => {
    const p = S.paint.get(k);
    if (!p) return 0;
    return p.z < 0 ? -1e6 + p.z : p.z > 0 ? 1e6 + p.z : 1;
  };
  const keys = kids.map(key);
  if (keys.every((k, i) => i === 0 || k >= keys[i - 1])) return kids;
  const idx = kids.map((k, i) => i).sort((a, b) => keys[a] - keys[b] || a - b);
  const sorted = idx.map((i) => kids[i]);
  const flowOf = (list) => list.filter((k) => !k.absolute);
  const f0 = flowOf(kids), f1 = flowOf(sorted);
  if (f0.every((k, i) => k === f1[i])) return sorted;
  // Keep in-flow layers in DOM order; place absolute ones by their own key.
  const neg = [], pos = [], mid = [];
  kids.forEach((k, i) => {
    if (k.absolute && keys[i] < 0) neg.push(i);
    else if (k.absolute && keys[i] > 1) pos.push(i);
    else mid.push(i);
  });
  const by = (a, b) => keys[a] - keys[b] || a - b;
  return neg.sort(by).concat(mid, pos.sort(by)).map((i) => kids[i]);
}

function walkEl(el, ox, oy) {
  const tag = el.tagName.toUpperCase();
  if (SKIP_TAGS.has(tag) || tag === 'BR') return [];
  const cs = css(el);
  if (cs.display === 'none') return [];
  if (cs.display === 'contents') return childrenOf(el, ox, oy);
  if (cs.visibility !== 'visible') return [];
  const opacity = parseFloat(cs.opacity);
  if (opacity === 0) return [];
  if (hiddenByEngine(el, cs)) return [];

  const rect = el.getBoundingClientRect();
  if (isVisuallyHidden(cs, rect)) return [];
  const box = { x: r2(rect.left - ox), y: r2(rect.top - oy), w: r2(rect.width), h: r2(rect.height) };
  const common = {
    absolute: cs.position === 'absolute' || cs.position === 'fixed',
    opacity: opacity < 1 ? r2(opacity) : undefined,
  };
  const leaf = (node) => (node && box.w > 0 && box.h > 0 ? [Object.assign(node, common)] : []);

  switch (tag) {
    case 'IMG': return leaf(imageNode(el, cs, box));
    case 'SVG': return svgLayers(el, cs, rect, box, common);
    case 'CANVAS': return leaf(canvasNode(el, cs, box));
    case 'VIDEO': return leaf(videoNode(el, cs, box));
    case 'IFRAME': case 'OBJECT': case 'EMBED': case 'AUDIO':
      return leaf({ type: 'RECT', name: tag.toLowerCase(), ...box, fills: [PLACEHOLDER_FILL] });

  const rectsOf = (a, b) => {
    rg.setStart(at(a)[0], at(a)[1]);
    rg.setEnd(at(b)[0], at(b)[1]);
    return [...rg.getClientRects()].filter((q) => q.width > 0.5 && q.height > 0.5);
  };
  const lineList = (rects) => {
    const ls = [];
    for (const q of rects) {
      const mid = (q.top + q.bottom) / 2;
      let l = ls.find((x) => mid > x.t && mid < x.b);
      if (!l) ls.push(l = { t: q.top, b: q.bottom, l: Infinity, r: -Infinity });
      l.l = Math.min(l.l, q.left);
      l.r = Math.max(l.r, q.right);
    }
    return ls.sort((p, q) => p.t - q.t);
  };
  const all = lineList(rectsOf(s, pos.length));
  if (all.length < 2 || all[0].l <= wrapBox.x + 1 || all[1].l > wrapBox.x + 1) return null;
  let lo = s + 1, hi = pos.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (lineList(rectsOf(s, mid)).length > 1) hi = mid; else lo = mid + 1;
  }
  let cut = lo - 1;
  if (cut <= s) return null;
  if (/[\uDC00-\uDFFF]/.test(pos[cut][0].data[pos[cut][1]])) cut--;
  const A = [], B = [];
  runs.forEach((r, i) => {
    if (!r.node) { (starts[i] <= cut ? A : B).push(r); return; }
    const a = starts[i], b = a + r.node.data.length;
    if (b <= cut) A.push(r);
    else if (a >= cut) B.push(r);
    else {
      A.push(Object.assign({}, r, { raw: r.raw.slice(0, cut - a) }));
      B.push(Object.assign({}, r, { raw: r.raw.slice(cut - a) }));
    }
  });
  const sa = toSegments(A), sb = toSegments(B);
  if (!sa.length || !sb.length) return null;
  const lh = parseFloat(cs.lineHeight);
  const vbox = (rects) => {
    let top = Infinity, bottom = -Infinity, l = Infinity, r = -Infinity;
    for (const q of rects) {
      const hl = Number.isFinite(lh) ? (lh - q.height) / 2 : 0;
      top = Math.min(top, q.top - hl); bottom = Math.max(bottom, q.bottom + hl);
      l = Math.min(l, q.left); r = Math.max(r, q.right);
    }
    return { top, bottom, l, r };
  };
  const ga = vbox(rectsOf(s, cut));
  const gb = vbox(rectsOf(cut, pos.length));
  if (!Number.isFinite(ga.top) || !Number.isFinite(gb.top)) return null;
  return [
    textNode(sa, { x: ga.l, y: ga.top, w: ga.r - ga.l, h: ga.bottom - ga.top, align: 'LEFT', autoResize: 'WIDTH_AND_HEIGHT' }, cs),
    textNode(sb, { x: wrapBox.x, y: gb.top, w: wrapBox.w, h: gb.bottom - gb.top, align: ALIGN[cs.textAlign] || 'LEFT', autoResize: 'HEIGHT' }, cs),
  ];
}

// letter-spacing compensation for painted inline boxes merged into a paragraph.
function padExtras(runs, painted) {
  const extra = { before: new Map(), after: new Map() };
  const add = (m, i, px) => { if (px > 0.01) m.set(i, (m.get(i) || 0) + px); };
  for (const e of painted) {
    const c = css(e);
    if (c.boxDecorationBreak === 'clone' || c.webkitBoxDecorationBreak === 'clone') continue;
    const n = (p) => parseFloat(c[p]) || 0;
    let first = -1, last = -1;
    runs.forEach((r, i) => { if (r.node && e.contains(r.node)) { if (first < 0) first = i; last = i; } });
    if (first < 0) continue;
    add(extra.before, first, n('marginLeft') + n('borderLeftWidth') + n('paddingLeft'));
    add(extra.after, last, n('paddingRight') + n('borderRightWidth') + n('marginRight'));
  }
  return extra;
}

// The boxes of painted inline elements (code, mark, kbd) inside a merged
// paragraph, one RECT per line fragment, in page coordinates, drawn behind the text.
function inlineBoxes(els) {
  const out = [];
  for (const e of els) {
    const c = css(e);
    const frags = [...e.getClientRects()].filter((q) => q.width > 0.5 && q.height > 0.5);
    frags.forEach((q, i) => {
      const fb = { x: q.left, y: q.top, w: q.width, h: q.height };
      const first = i === 0, last = i === frags.length - 1;
      const st = borders(c);
      if (st) {
        st.weights = Object.assign({}, st.weights);
        if (!last) st.weights.r = 0;
        if (!first) st.weights.l = 0;
      }
      let rd = radii(c, fb);
      if (rd) {
        if (!first) { rd.tl = 0; rd.bl = 0; }
        if (!last) { rd.tr = 0; rd.br = 0; }
        if (!(rd.tl || rd.tr || rd.br || rd.bl)) rd = null;
      }
      const effects = parseShadows(c.boxShadow);
      out.push({
        type: 'RECT', name: e.tagName.toLowerCase() + ' bg', x: r2(q.left), y: r2(q.top), w: r2(q.width), h: r2(q.height),
        fills: backgroundFills(c, fb), stroke: st, radii: rd, effects: effects.length ? effects : undefined, absolute: true,
      });
    });
  }
  return out;
}

function blockText(el, cs, painted) {
  const runs = gatherRuns(el);
  const segs = toSegments(runs, null, painted ? padExtras(runs, painted) : null);
  if (!segs.length) return null;
  const cb = contentBox(el, cs);
  // An inline element that starts mid-line and wraps (its parent isn't one text block).
  if (cs.display === 'inline' && !painted && !hasPaint(cs)) {
    const parts = splitFirstLine(runs, cs, blockWrapBox(el));
    if (parts) return parts;
  }
  const g = textGeometry(el, cs, cb, cb);
  if (!g) return null;
  const t = textNode(segs, g, cs);
  clampText(t, cs, cb, false);
  return t;
}

function looseText(tn, parent, ox, oy) {
  if (!/\S/.test(tn.data)) return null;
  const pcs = css(parent);
  const runs = [{ raw: tn.data, el: parent, node: tn }];
  const segs = toSegments(runs);
  if (!segs.length) return null;
  const pcb = contentBox(parent, pcs);
  const parts = splitFirstLine(runs, pcs, pcb);
  if (parts) {
    parts.forEach((t) => shift(t, ox, oy));
    return parts;
  }
  const g = textGeometry(tn, pcs, null, pcb);
  if (!g) return null;
  const t = textNode(segs, g, pcs);
  clampText(t, pcs, pcb, true);
  delete t.overflowsBox; // the parent frame decides about clipping its children
  shift(t, ox, oy);
  return t;
}

// ---------- replaced elements ----------

// dw/dh: the largest size the image is shown at (SVGs are rasterized for it).
function imageRef(url, el, bg, dw, dh) {
  const key = bg ? url + '|' + JSON.stringify(bg) : url;
  let it = S.images.get(key);
  if (!it) {
    it = { ref: 'img' + S.images.size, url, el, bg: bg || null, dw: 0, dh: 0 };
    S.images.set(key, it);
  } else if (!it.el && el) {
    it.el = el;
  }
  it.dw = Math.max(it.dw, dw || 0);
  it.dh = Math.max(it.dh, dh || 0);
  return it.ref;
}

function boxed(type, name, box, v, fills) {
  return { type, name, ...box, fills, stroke: v.stroke, radii: v.radii, effects: v.effects };
}

function imageNode(el, cs, box) {
  const v = boxVisual(el, cs, box);
  const src = el.currentSrc || el.src;
  const name = el.alt ? `img · ${el.alt}`.slice(0, 60) : 'img';
  const n = (p) => parseFloat(cs[p]) || 0;
  const iL = n('borderLeftWidth') + n('paddingLeft'), iR = n('borderRightWidth') + n('paddingRight');
  const iT = n('borderTopWidth') + n('paddingTop'), iB = n('borderBottomWidth') + n('paddingBottom');
  const cw = r2(Math.max(0, box.w - iL - iR)), ch = r2(Math.max(0, box.h - iT - iB));
  let paint = PLACEHOLDER_FILL;
  let vector = null;
  if (src && S.opts.images && cw > 0 && ch > 0) {
    vector = svgImage(el, src, cs, cw, ch);
    if (!vector) paint = imagePaint(el, src, cs, cw, ch);
  }
  // No padding/border: one rectangle, as before.
  if (!(iL || iR || iT || iB) && !vector) return boxed('RECT', name, box, v, v.fills.concat(paint));
  // The image sits in the content box, inside the border and padding.
  const f = boxed('FRAME', name, box, v, v.fills);
  f.clip = true;
  f.children = [];
  if (cw > 0 && ch > 0) {
    const r = v.radii;
    const inner = r && { tl: r2(Math.max(0, r.tl - Math.max(iL, iT))), tr: r2(Math.max(0, r.tr - Math.max(iR, iT))), br: r2(Math.max(0, r.br - Math.max(iR, iB))), bl: r2(Math.max(0, r.bl - Math.max(iL, iB))) };
    if (vector) {
      const c = vector._center;
      delete vector._center;
      f.children.push(Object.assign(vector, c ? { x: r2(iL + (c[0] - vector.w) / 2), y: r2(iT + (c[1] - vector.h) / 2) } : { x: r2(iL), y: r2(iT) }));
    }
    else f.children.push({ type: 'RECT', name: 'image', x: r2(iL), y: r2(iT), w: cw, h: ch, fills: [paint], radii: inner && (inner.tl || inner.tr || inner.br || inner.bl) ? inner : null });
  }
  return f;
}

// object-fit / object-position: centered cover and contain are Figma's FILL and
// FIT; fill (stretch), none, scale-down and off-center positions are composed.
function imagePaint(el, src, cs, cw, ch) {
  const fit = cs.objectFit || 'fill';
  const pos = (cs.objectPosition || '50% 50%').split(/\s+(?![^(]*\))/);
  const centered = pos[0] === '50%' && (pos[1] || '50%') === '50%';
  const nw = el.naturalWidth, nh = el.naturalHeight;
  if (!nw || !nh || (centered && (fit === 'cover' || fit === 'contain'))) {
    return { type: 'IMAGE', ref: imageRef(src, el, null, cw, ch), scaleMode: FIT_MODES[fit] || 'FILL' };
  }
  let size;
  if (fit === 'fill') size = '100% 100%';
  else if (fit === 'none') size = `${nw}px ${nh}px`;
  else if (fit === 'scale-down') size = nw <= cw && nh <= ch ? `${nw}px ${nh}px` : 'contain';
  else size = fit;
  // Same aspect as the box: stretching changes nothing.
  if (fit === 'fill' && Math.abs(nw / nh - cw / ch) < 0.01) return { type: 'IMAGE', ref: imageRef(src, el, null, cw, ch), scaleMode: 'FILL' };
  const bg = { w: cw, h: ch, size, px: pos[0] || '50%', py: pos[1] || '50%', repeat: 'no-repeat', ox: 0, oy: 0, aw: cw, ah: ch };
  return { type: 'IMAGE', ref: imageRef(src, el, bg, cw, ch), scaleMode: 'FILL' };
}

// A data:image/svg+xml image imports as an editable vector.
function svgImage(el, src, cs, cw, ch) {
  if (!/^data:image\/svg\+xml/i.test(src)) return null;
  const fit = cs.objectFit || 'fill';
  if (!/^(fill|contain|scale-down)$/.test(fit)) return null;
  const pos = (cs.objectPosition || '50% 50%').split(/\s+/);
  if (fit !== 'fill' && !(pos[0] === '50%' && (pos[1] || '50%') === '50%')) return null;
  try {
    const comma = src.indexOf(',');
    const head = src.slice(0, comma), body = src.slice(comma + 1);
    const text = /;base64/i.test(head)
      ? new TextDecoder().decode(Uint8Array.from(atob(body), (c) => c.charCodeAt(0)))
      : decodeURIComponent(body);
    const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
    const svg = doc.documentElement;
    if (!svg || svg.nodeName.toLowerCase() !== 'svg' || doc.querySelector('parsererror')) return null;
    for (const bad of svg.querySelectorAll('script,foreignObject')) bad.remove();
    if (svg.querySelector('image,use[href^="http"],style')) return null; // external refs / CSS: keep the raster
    if (!svg.getAttribute('viewBox')) {
      const w0 = parseFloat(svg.getAttribute('width')) || el.naturalWidth, h0 = parseFloat(svg.getAttribute('height')) || el.naturalHeight;
      if (!(w0 > 0 && h0 > 0)) return null;
      svg.setAttribute('viewBox', `0 0 ${w0} ${h0}`);
    }
    if (fit === 'fill') svg.setAttribute('preserveAspectRatio', 'none');
    if (fit === 'scale-down' && el.naturalWidth <= cw && el.naturalHeight <= ch) {
      // shown at its natural size, centered
      const w = el.naturalWidth, h = el.naturalHeight;
      svg.setAttribute('width', w);
      svg.setAttribute('height', h);
      return { type: 'SVG', name: el.alt ? `img · ${el.alt}`.slice(0, 60) : 'img', x: 0, y: 0, w, h, svg: new XMLSerializer().serializeToString(svg), _center: [cw, ch] };
    }
    svg.setAttribute('width', cw);
    svg.setAttribute('height', ch);
    const out = new XMLSerializer().serializeToString(svg);
    if (/(?:oklch|oklab|lab|lch|color)\(/i.test(out)) return null;
    return { type: 'SVG', name: el.alt ? `img · ${el.alt}`.slice(0, 60) : 'img', x: 0, y: 0, w: cw, h: ch, svg: out };
  } catch (e) {
    return null;
  }
}

function canvasNode(el, cs, box) {
  const v = boxVisual(el, cs, box);
  let fill = PLACEHOLDER_FILL;
  try {
    if (S.opts.images) fill = { type: 'IMAGE', ref: imageRef(el.toDataURL('image/png'), null), scaleMode: 'FILL' };
  } catch (e) { /* tainted canvas */ }
  return boxed('RECT', 'canvas', box, v, v.fills.concat(fill));
}

function videoNode(el, cs, box) {
  const v = boxVisual(el, cs, box);
  const fill = el.poster && S.opts.images
    ? { type: 'IMAGE', ref: imageRef(el.poster, null), scaleMode: FIT_MODES[cs.objectFit] || 'FILL' }
    : solid({ r: 0.1, g: 0.1, b: 0.1, a: 1 });
  return boxed('RECT', 'video', box, v, v.fills.concat(fill));
}

function formNode(el, cs, box, rect, tag) {
  const v = boxVisual(el, cs, box);
  const type = (el.type || '').toLowerCase();
  const f = boxed('FRAME', tag.toLowerCase() + (tag === 'INPUT' ? `[${type}]` : ''), box, v, v.fills);
  f.clip = true;
  f.children = [];
  const native = cs.appearance !== 'none';
  if (type === 'checkbox' || type === 'radio') {
    if (!native) return f; // the author's box + materialized ::before/::after
    f.children.push(checkGlyph(el, cs, box, type));
    // Chrome ignores the author's background and border on a native control.
    f.fills = [];
    f.stroke = null;
    f.radii = null;
    return f;
  }
  if (type === 'range') {
    rangeParts(el, cs, box, f, native);
    return f;
  }
  if (type === 'color') {
    const cb = contentBox(el, cs);
    const c = parseColor(el.value) || { r: 0, g: 0, b: 0, a: 1 };
    const sw = { x: r2(cb.x - rect.left + 2), y: r2(cb.y - rect.top + 4), w: r2(Math.max(1, cb.w - 4)), h: r2(Math.max(1, cb.h - 8)) };
    f.children.push(Object.assign({ type: 'RECT', name: 'swatch', fills: [solid(c)], stroke: { paint: solid({ r: 0.47, g: 0.47, b: 0.47, a: 1 }), weights: { t: 1, r: 1, b: 1, l: 1 }, dash: null } }, sw));
    return f;
  }
  if (type === 'file') {
    fileParts(el, cs, box, f);
    return f;
  }
  if (type === 'image') return f;

  let text = '';
  let placeholder = false;
  const dateLike = tag === 'INPUT' && /^(date|time|month|week|datetime-local)$/.test(type);
  const menulist = tag === 'SELECT' && native && !el.multiple && !(el.size > 1);
  if (tag === 'SELECT') text = el.selectedIndex >= 0 ? el.options[el.selectedIndex].text : '';
  else if (dateLike) text = dateText(el, type);
  else {
    text = el.value;
    if (!text && el.placeholder) {
      text = el.placeholder;
      placeholder = true;
    }
  }
  // Native widgets: the select chevron and the date/time picker icon.
  let iconW = 0;
  if (menulist || (dateLike && !pickerHidden(el))) {
    const col = toCss(parseColor(cs.color) || { r: 0, g: 0, b: 0, a: 1 });
    if (menulist) {
      const bw = parseFloat(cs.borderRightWidth) || 0;
      f.children.push({ type: 'SVG', name: 'chevron', x: r2(box.w - bw - 4 - 10), y: r2((box.h - 6) / 2), w: 10, h: 6,
        svg: `<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="${col}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>` });
    } else {
      const cb = contentBox(el, cs);
      const k = Math.max(0.75, (parseFloat(cs.fontSize) || 16) / 16);
      const sz = r2(12 * k);
      const glyph = type === 'time'
        ? `<circle cx="6" cy="6" r="5" fill="none" stroke="${col}" stroke-width="1.2"/><path d="M6 3v3l2 1.5" fill="none" stroke="${col}" stroke-width="1.2"/>`
        : `<rect x="1" y="2" width="10" height="9" rx="1" fill="none" stroke="${col}" stroke-width="1.2"/><path d="M1 4.5h10M3.5 1v2M8.5 1v2" stroke="${col}" stroke-width="1.2"/>`;
      f.children.push({ type: 'SVG', name: 'picker', x: r2(cb.x - rect.left + cb.w - sz - 3), y: r2(cb.y - rect.top + (cb.h - sz) / 2), w: sz, h: sz,
        svg: `<svg xmlns="http://www.w3.org/2000/svg" width="${sz}" height="${sz}" viewBox="0 0 12 12">${glyph}</svg>` });
      iconW = sz + 8;
    }
  }
  if (type === 'password' && !placeholder) text = '•'.repeat(text.length);
  if (!text) return f;

  const segs = toSegments([{ raw: text, el }], placeholder ? css(el, '::placeholder').color : null);
  if (!segs.length) return f;
  const cb = contentBox(el, cs);
  cb.w = Math.max(1, cb.w - iconW);
  const x = cb.x - rect.left + (menulist ? 4 : 0); // Chrome's menulist inner padding
  if (tag === 'TEXTAREA') {
    f.children.push(textNode(segs, { x, y: cb.y - rect.top, w: cb.w, h: cb.h, align: ALIGN[cs.textAlign] || 'LEFT', autoResize: 'HEIGHT' }, cs));
  } else {
    const lh = parseFloat(cs.lineHeight) || (parseFloat(cs.fontSize) || 13) * 1.2;
    const y = cb.y - rect.top + (cb.h - lh) / 2;
    let align = ALIGN[cs.textAlign] || 'LEFT';
    if (align === 'JUSTIFIED') align = 'LEFT'; // one line: justify == start
    if (cs.direction === 'rtl' && cs.textAlign === 'start') align = 'RIGHT';
    // OTP boxes, steppers, amount fields: keep centered/right text in a fixed box,
    // but only when it clearly fits (an input never wraps; overflow shows the start).
    const mctx = (S.measureCtx = S.measureCtx || document.createElement('canvas').getContext('2d'));
    mctx.font = cs.font || `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const ls = parseFloat(cs.letterSpacing) || 0;
    const shown = segs.map((sg) => sg.text).join('');
    const tw = mctx.measureText(shown).width + ls * shown.length;
    if (align !== 'LEFT' && tw <= cb.w - 1) {
      const t = textNode(segs, { x, y, w: cb.w, h: lh, align, autoResize: 'HEIGHT' }, cs);
      t.truncate = 1; // never a second line, even if Figma's metrics come out wider
      f.children.push(t);
    } else {
      f.children.push(textNode(segs, { x, y, w: cb.w, h: lh, align: 'LEFT', autoResize: 'WIDTH_AND_HEIGHT' }, cs));
    }
  }
  return f;
}

function toCss(c) {
  const h = (v) => Math.round(clamp01(v) * 255).toString(16).padStart(2, '0');
  return '#' + h(c.r) + h(c.g) + h(c.b);
}

function accentOf(cs) {
  return (cs.accentColor && cs.accentColor !== 'auto' && parseColor(cs.accentColor)) || { r: 0, g: 117 / 255, b: 1, a: 1 };
}

// Chrome's native checkbox / radio, drawn as SVG in the control's box.
function checkGlyph(el, cs, box, type) {
  const ac = accentOf(cs);
  const hex = toCss(ac);
  const lum = 0.2126 * ac.r + 0.7152 * ac.g + 0.0722 * ac.b;
  const mark = lum > 0.6 ? '#1a1a1a' : '#ffffff';
  const sz = Math.min(box.w, box.h), ox = (box.w - sz) / 2, oy = (box.h - sz) / 2, k = sz / 13;
  const on = el.checked || (type === 'checkbox' && el.indeterminate);
  let body = '';
  if (type === 'checkbox') {
    body += `<rect x="${ox + 0.5 * k}" y="${oy + 0.5 * k}" width="${12 * k}" height="${12 * k}" rx="${2 * k}" fill="${on ? hex : '#ffffff'}" stroke="${on ? hex : '#767676'}" stroke-width="${k}"/>`;
    if (el.indeterminate) body += `<rect x="${ox + 3 * k}" y="${oy + 5.75 * k}" width="${7 * k}" height="${1.5 * k}" fill="${mark}"/>`;
    else if (el.checked) body += `<path transform="translate(${ox} ${oy}) scale(${k})" d="M3 6.6l2.3 2.3L10 4.2" fill="none" stroke="${mark}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
  } else {
    const cx = ox + sz / 2, cy = oy + sz / 2;
    body += `<circle cx="${cx}" cy="${cy}" r="${6 * k}" fill="#ffffff" stroke="${el.checked ? hex : '#767676'}" stroke-width="${k}"/>`;
    if (el.checked) body += `<circle cx="${cx}" cy="${cy}" r="${3.5 * k}" fill="${hex}"/>`;
  }
  const n = { type: 'SVG', name: type, x: 0, y: 0, w: box.w, h: box.h,
    svg: `<svg xmlns="http://www.w3.org/2000/svg" width="${box.w}" height="${box.h}" viewBox="0 0 ${box.w} ${box.h}">${body}</svg>` };
  if (el.disabled) n.opacity = 0.5;
  return n;
}

// Background of a ::-webkit-* pseudo (getComputedStyle can't read those): the
// last matching author rule, resolved through a probe. Specificity is ignored.
function pseudoBg(el, pseudo) {
  let val = null;
  const visit = (rules) => {
    for (const r of rules) {
      try {
        if (r.selectorText && r.selectorText.indexOf(pseudo) >= 0) {
          for (const part of r.selectorText.split(',')) {
            const p = part.trim();
            const i = p.indexOf(pseudo);
            if (i < 0) continue;
            if (el.matches(p.slice(0, i) || '*')) val = r.style.backgroundColor || r.style.background || val;
          }
        }
        if (r.cssRules) visit(r.cssRules);
      } catch (e) {}
    }
  };
  for (const sh of S.doc.styleSheets) { try { visit(sh.cssRules); } catch (e) { /* cross-origin */ } }
  if (!val) return null;
