<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src * data:">
<title>Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: Manrope, sans-serif; background: #0b1020; color: #e5e7eb; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 56px 24px; }
  h1 { font-size: 32px; font-weight: 800; margin: 0 0 8px; }
  .sub { color: #94a3b8; margin: 0 0 32px; }
  .panel { background: #111833; border: 1px solid #1f2a4d; border-radius: 16px; padding: 24px; margin-bottom: 20px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #1f2a4d; }
  .row:last-child { border-bottom: 0; }
  .toggle { width: 44px; height: 24px; border-radius: 12px; background: #6366f1; position: relative; }
  .toggle::after { content: ''; position: absolute; right: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; }
  .toggle.off { background: #334155; }
  .btn { display: inline-block; padding: 10px 18px; border-radius: 10px; background: #6366f1; color: #fff; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Account settings</h1>
  <p class="sub">Manage notifications and security for your workspace.</p>
  <div class="panel">
    <div class="row"><span>Email notifications</span><div class="toggle"></div></div>
    <div class="row"><span>Weekly digest</span><div class="toggle off"></div></div>
    <div class="row"><span>Two-factor authentication</span><div class="toggle"></div></div>
  </div>
  <span class="btn">Save changes</span>
</div>
</body>
</html>
