<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Borders &amp; rings</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  .dbl { border: 6px double #334155; }
  .ellipse { border-radius: 50%; }
  .blob { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
  .elli2 { border-radius: 40px / 20px; }
  .outline-btn { outline: 2px solid #6366f1; outline-offset: 3px; }
  .outline-dash { outline: 2px dashed #f43f5e; outline-offset: -8px; }
  .mixed { border-top: 4px solid #ef4444; border-right: 4px dashed #3b82f6; border-bottom: 4px dotted #10b981; border-left: 4px solid #f59e0b; }
  .groove { border: 6px groove #94a3b8; }
  .clip-pad { border: 10px solid rgba(15, 23, 42, .35); background: #38bdf8; background-clip: padding-box; }
  .clip-border { border: 10px solid rgba(15, 23, 42, .35); background: #38bdf8; }
  .clip-content { padding: 14px; border: 2px solid #0ea5e9; background: #bae6fd; background-clip: content-box; }
</style>
</head>
<body class="bg-slate-50 p-10 font-sans text-slate-800">
  <h1 class="text-2xl font-semibold mb-6">Account overview</h1>

  <!-- Callouts: border + colored left accent (very common) -->
  <div class="grid grid-cols-3 gap-6 mb-8">
    <div class="rounded-lg border border-slate-200 border-l-4 border-l-indigo-500 bg-white p-5 shadow-sm">
      <p class="text-sm text-slate-500">Revenue</p><p class="mt-1 text-2xl font-bold">$48,200</p>
    </div>
    <div class="rounded-xl border-t-4 border-t-emerald-500 bg-white p-5 shadow-md ring-1 ring-slate-900/5">
      <p class="text-sm text-slate-500">Active users</p><p class="mt-1 text-2xl font-bold">12,480</p>
    </div>
    <div class="rounded-md border-b-2 border-dashed border-amber-400 bg-amber-50 p-5">
      <p class="text-sm text-amber-700">Pending invoices</p><p class="mt-1 text-2xl font-bold text-amber-900">7</p>
    </div>
  </div>

  <!-- Rings, ring-offset, inset shadows, shadow stacks -->
  <div class="flex items-center gap-8 mb-8">
    <img class="h-16 w-16 rounded-full ring-4 ring-white ring-offset-2 ring-offset-indigo-500" src="https://picsum.photos/id/64/128/128" alt="avatar">
    <button class="rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-indigo-500/40 ring-2 ring-indigo-300 ring-offset-2">Upgrade plan</button>
    <input class="w-64 rounded-md border-0 bg-white px-3 py-2 text-sm shadow-inner ring-1 ring-inset ring-slate-300" placeholder="Search customers…">
    <div class="h-16 w-40 rounded-2xl bg-white" style="box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 8px -2px rgba(0,0,0,.08), 0 24px 48px -12px rgba(79,70,229,.35), inset 0 0 0 1px rgba(79,70,229,.25);"></div>
    <div class="h-16 w-40 rounded-2xl bg-slate-200" style="box-shadow: inset 0 4px 10px rgba(0,0,0,.25), inset 0 -2px 0 rgba(255,255,255,.7);"></div>
  </div>

  <!-- Border styles -->
  <div class="flex items-center gap-6 mb-8">
    <div class="h-24 w-40 rounded-xl border-2 border-dashed border-slate-400 bg-white flex items-center justify-center text-sm text-slate-500">Drop files</div>
    <div class="h-24 w-40 rounded-xl border-4 border-dotted border-pink-500 bg-white"></div>
    <div class="h-24 w-40 rounded-xl dbl bg-white"></div>
    <div class="h-24 w-40 mixed bg-white"></div>
    <div class="h-24 w-40 groove bg-white"></div>
  </div>

  <!-- Radii -->
  <div class="flex items-center gap-6 mb-8">
    <div class="h-24 w-48 ellipse bg-gradient-to-br from-violet-500 to-fuchsia-500"></div>
    <div class="h-28 w-28 blob bg-teal-400"></div>
    <div class="h-24 w-48 elli2 bg-orange-400"></div>
    <div class="h-10 w-48 rounded-t-3xl bg-sky-500"></div>
    <div class="h-24 w-48 rounded-[2rem_0.5rem] border-4 border-sky-700 bg-sky-100"></div>
  </div>

  <!-- Outline / outline-offset -->
  <div class="flex items-center gap-10 mb-8">
    <button class="outline-btn rounded-lg bg-white px-6 py-3 text-sm font-semibold">Focused</button>
    <div class="outline-dash h-24 w-40 rounded-xl bg-rose-50"></div>
    <button class="rounded-full bg-slate-900 px-6 py-3 text-sm font-semibold text-white outline-4 outline-offset-4 outline-slate-900/30">Tailwind outline</button>
  </div>

  <!-- background-clip over a colorful parent, translucent borders -->
  <div class="flex items-center gap-6 rounded-2xl p-8" style="background: linear-gradient(90deg, #f97316, #db2777);">
    <div class="h-24 w-40 rounded-xl clip-pad"></div>
    <div class="h-24 w-40 rounded-xl clip-border"></div>
    <div class="h-24 w-40 clip-content"></div>
    <div class="h-24 w-40 rounded-xl border border-white/20 bg-white/10"></div>
    <div class="h-24 w-40 rounded-xl border-8 border-black/20 bg-white/30"></div>
  </div>
</body>
</html>
