<div class="min-h-screen bg-slate-50 p-10 font-sans">

  </header>
  <div class="mt-16 max-w-3xl mx-auto space-y-6">

      <p class="opacity-80 mt-2">Line one<br>Line two after br</p>

    <pre class="bg-slate-900 text-slate-100 p-4 rounded-lg text-sm">const x = 1;
  indented()</pre>
    <table class="w-full text-left"><tr><th class="p-2">Name</th><th class="p-2">Value</th></tr><tr><td class="p-2">Alpha</td><td class="p-2 line-through">12</td></tr></table>
