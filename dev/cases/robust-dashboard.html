<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style type="text/tailwindcss">
  @theme { --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif; }
  /* Chart styling done in CSS, like most generated dashboards */
  .axis text { font-size: 11px; fill: #64748b; font-family: Inter, sans-serif; font-weight: 500; }
  .axis line { stroke: #e2e8f0; stroke-dasharray: 3 3; }
  .bar { fill: #6366f1; }
  .bar.alt { fill: #a5b4fc; }
  .ring-track { stroke: #e2e8f0; }
  .ring-value { stroke: #10b981; stroke-dasharray: 251.2; stroke-dashoffset: 75; stroke-linecap: round; }
  .spark { stroke: #6366f1; stroke-width: 2; fill: none; }
  .label-center { font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; fill: #0f172a; }
</style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
<svg width="0" height="0" class="absolute">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366f1" stop-opacity=".35"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></linearGradient>
  </defs>
</svg>
<div class="flex">
  <aside class="w-64 shrink-0 bg-slate-900 text-slate-300 min-h-screen p-5 space-y-1">
    <div class="flex items-center gap-2 text-white font-semibold text-lg mb-6"><span class="size-8 rounded-lg bg-indigo-500 grid place-items-center">A</span> Acme</div>
    <a class="flex items-center gap-3 rounded-lg bg-slate-800 text-white px-3 py-2 text-sm font-medium">Overview</a>
    <a class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm hover:bg-slate-800">Customers <span class="ml-auto rounded-full bg-indigo-500/20 text-indigo-300 text-xs px-2">12</span></a>
    <a class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm">Invoices</a>
    <a class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm">Settings</a>
  </aside>
  <main class="flex-1 min-w-0">
    <header class="sticky top-0 z-10 bg-white/90 backdrop-blur border-b border-slate-200 h-16 flex items-center gap-4 px-8">
      <h1 class="text-xl font-semibold">Overview</h1>
      <div class="ml-auto relative">
        <svg class="size-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><use href="#i-search"/></svg>
        <input class="w-72 rounded-lg border border-slate-200 bg-slate-50 pl-9 pr-3 py-2 text-sm" placeholder="Search customers…">
      </div>
      <button class="relative rounded-full p-2 text-slate-500 hover:bg-slate-100">
        <span class="sr-only">View notifications</span>
        <svg class="size-5"><use href="#i-bell"/></svg>
        <span class="absolute top-1 right-1 size-2 rounded-full bg-rose-500 ring-2 ring-white"></span>
      </button>
      <img class="size-9 rounded-full object-cover" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=1200&h=1200&fit=crop&q=60" alt="Profile">
    </header>

    <div class="p-8 space-y-8">
      <section class="grid grid-cols-4 gap-6">
        <div class="rounded-xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
          <p class="text-sm text-slate-500">Revenue</p><p class="mt-1 text-2xl font-semibold">$48,290</p>
          <svg viewBox="0 0 120 32" class="mt-3 h-8 w-full"><polyline class="spark" points="0,28 15,22 30,24 45,14 60,18 75,8 90,12 105,4 120,6"/></svg>
        </div>
        <div class="rounded-xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
          <p class="text-sm text-slate-500">Active users</p><p class="mt-1 text-2xl font-semibold">2,841</p>
          <p class="mt-3 text-xs font-medium text-emerald-600">▲ 12.4% vs last month</p>
        </div>
        <div class="rounded-xl bg-white p-5 shadow-sm ring-1 ring-slate-200 flex items-center gap-4">
          <svg viewBox="0 0 100 100" class="size-20 -rotate-90">
            <circle class="ring-track" cx="50" cy="50" r="40" fill="none" stroke-width="10"/>
            <circle class="ring-value" cx="50" cy="50" r="40" fill="none" stroke-width="10"/>
          </svg>
          <div><p class="text-sm text-slate-500">Goal</p><p class="text-2xl font-semibold">70%</p></div>
        </div>
        <div class="rounded-xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
          <svg viewBox="0 0 100 100" class="size-20 mx-auto">
            <circle cx="50" cy="50" r="40" fill="none" stroke="#e0e7ff" stroke-width="12"/>
            <text x="50" y="50" class="label-center">94</text>
          </svg>
        </div>
      </section>

      <section class="rounded-xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
        <div class="flex items-center justify-between mb-4"><h2 class="font-semibold">Monthly revenue</h2><span class="text-xs text-slate-500">Last 12 months</span></div>
        <svg id="chart" viewBox="0 0 800 240" class="w-full h-60"></svg>
      </section>

      <section class="rounded-xl bg-white shadow-sm ring-1 ring-slate-200 overflow-hidden">
        <div class="px-6 py-4 flex items-center justify-between border-b border-slate-200"><h2 class="font-semibold">Recent customers</h2><button class="rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-medium text-white">Export</button></div>
        <table class="w-full table-fixed text-sm">
          <thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-500">
            <tr><th class="w-12 px-6 py-3"><input type="checkbox"></th><th class="px-6 py-3">Customer</th><th class="px-6 py-3">Email</th><th class="px-6 py-3">Plan</th><th class="px-6 py-3 text-right">MRR</th><th class="px-6 py-3">Status</th></tr>
          </thead>
          <tbody id="rows" class="divide-y divide-slate-100"></tbody>
        </table>
      </section>
    </div>
  </main>
</div>
<script>
  const chart = document.getElementById('chart');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const vals = [32, 41, 38, 52, 47, 61, 58, 66, 72, 69, 80, 91];
  let g = '<g class="axis">';
  for (let i = 0; i <= 4; i++) { const y = 20 + i * 45; g += `<line x1="40" x2="790" y1="${y}" y2="${y}"/><text x="0" y="${y + 4}">${100 - i * 25}k</text>`; }
  months.forEach((m, i) => { g += `<text x="${62 + i * 62}" y="236" style="text-anchor: middle">${m}</text>`; });
  g += '</g>';
  const pts = vals.map((v, i) => `${62 + i * 62},${200 - v * 1.8}`).join(' ');
  g += `<polygon points="62,200 ${pts} 744,200" fill="url(#area)"/>`;
  vals.forEach((v, i) => { g += `<rect class="bar ${i % 2 ? 'alt' : ''}" x="${50 + i * 62}" y="${200 - v * 1.8}" width="24" height="${v * 1.8}" rx="4"/>`; });
  chart.innerHTML = g;

  const names = ['Olivia Martin','Jackson Lee','Isabella Nguyen','William Kim','Sofia Davis','Liam Johnson','Emma Brown','Noah Wilson'];
  const plans = ['Starter','Pro','Enterprise'];
  const status = [['Active','bg-emerald-50 text-emerald-700 ring-emerald-600/20'],['Past due','bg-amber-50 text-amber-700 ring-amber-600/20'],['Canceled','bg-slate-100 text-slate-600 ring-slate-500/20']];
  let html = '';
  for (let i = 0; i < 90; i++) {
    const n = names[i % names.length];
    const s = status[i % 3];
    html += `<tr class="${i % 2 ? 'bg-slate-50/50' : ''}">
      <td class="px-6 py-3"><input type="checkbox" ${i % 7 === 0 ? 'checked' : ''}></td>
      <td class="px-6 py-3"><div class="flex items-center gap-3"><span class="size-8 shrink-0 rounded-full bg-indigo-100 text-indigo-700 grid place-items-center text-xs font-semibold">${n.split(' ').map((w) => w[0]).join('')}</span><span class="font-medium truncate">${n}</span></div></td>
      <td class="px-6 py-3 truncate text-slate-500">${n.toLowerCase().replace(' ', '.')}.customer-account-${i}@enterprise-example-domain.com</td>
      <td class="px-6 py-3">${plans[i % 3]}</td>
      <td class="px-6 py-3 text-right tabular-nums">$${(1200 + i * 37).toLocaleString('en-US')}</td>
      <td class="px-6 py-3"><span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium ring-1 ring-inset ${s[1]}">${s[0]}</span></td>
    </tr>`;
  }
  document.getElementById('rows').innerHTML = html;
</script>
</body>
</html>
