<div class="min-h-screen bg-slate-50 p-10 font-sans text-slate-900">
  <div class="mx-auto grid max-w-5xl grid-cols-2 gap-8">
    <div class="rounded-2xl bg-white p-8 shadow-sm ring-1 ring-slate-200">
      <div class="mb-6 flex items-center justify-between">
        <h2 class="text-xl font-semibold">Notifications</h2>
        <button type="button" class="rounded-md p-2 text-slate-500 hover:bg-slate-100">
          <span class="sr-only">Close panel</span>
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <label class="mb-4 flex cursor-pointer items-center justify-between">
        <span class="text-sm font-medium">Email alerts</span>
        <input type="checkbox" class="peer sr-only" checked>
        <div class="relative h-6 w-11 rounded-full bg-slate-200 after:absolute after:start-[2px] after:top-[2px] after:h-5 after:w-5 after:rounded-full after:bg-white after:shadow after:content-[''] peer-checked:bg-indigo-600 peer-checked:after:translate-x-full"></div>
      </label>
      <label class="mb-6 flex cursor-pointer items-center justify-between">
        <span class="text-sm font-medium">SMS alerts</span>
        <input type="checkbox" class="peer sr-only">
        <div class="relative h-6 w-11 rounded-full bg-slate-200 after:absolute after:start-[2px] after:top-[2px] after:h-5 after:w-5 after:rounded-full after:bg-white after:shadow after:content-[''] peer-checked:bg-indigo-600 peer-checked:after:translate-x-full"></div>
      </label>
      <label class="block text-sm font-medium after:ml-0.5 after:text-red-500 after:content-['*']">Work email</label>
      <input type="email" placeholder="you@company.com" class="mt-2 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm placeholder:text-slate-400 placeholder:italic">
      <div class="mt-6 flex items-center gap-3">
        <input id="tos" type="checkbox" checked class="h-4 w-4 rounded accent-indigo-600">
        <label for="tos" class="text-sm text-slate-600">I agree to the <a href="#" class="font-medium text-indigo-600 underline">terms</a></label>
      </div>
      <fieldset class="mt-6">
        <legend class="mb-2 text-sm font-semibold">Plan</legend>
        <div class="flex gap-6 text-sm">
          <label class="flex items-center gap-2"><input type="radio" name="p" checked class="h-4 w-4 accent-emerald-500"> Monthly</label>
          <label class="flex items-center gap-2"><input type="radio" name="p" class="h-4 w-4 accent-emerald-500"> Yearly</label>
        </div>
      </fieldset>
      <div class="mt-6">
        <div class="mb-1 flex justify-between text-sm"><span>Storage</span><span class="text-slate-500">7.2 / 10 GB</span></div>
        <progress value="72" max="100" class="h-2 w-full overflow-hidden rounded-full [&::-webkit-progress-bar]:bg-slate-200 [&::-webkit-progress-value]:bg-indigo-600"></progress>
      </div>
      <input type="range" value="30" class="mt-6 w-full accent-indigo-600">
    </div>
    <div class="rounded-2xl bg-white p-8 shadow-sm ring-1 ring-slate-200">
      <h2 class="relative mb-6 inline-block text-xl font-semibold before:absolute before:-bottom-1 before:left-0 before:h-1 before:w-full before:rounded before:bg-gradient-to-r before:from-pink-500 before:to-violet-500">Why teams switch</h2>
      <ul class="list-inside list-disc space-y-2 text-sm marker:text-indigo-500">
        <li>Fewer meetings, more shipping</li>
        <li>Async updates in one place</li>
        <li>Integrates with your stack</li>
      </ul>
      <ol class="mt-6 list-decimal space-y-2 pl-5 text-sm marker:font-semibold marker:text-slate-400">
        <li>Sign up in seconds</li>
        <li>Import your projects</li>
        <li>Invite collaborators</li>
      </ol>
      <div class="relative mt-8 rounded-xl bg-white p-6 before:absolute before:-inset-[2px] before:-z-10 before:rounded-[14px] before:bg-gradient-to-r before:from-indigo-500 before:to-pink-500">
        <p class="text-sm">Card with a gradient border made by a ::before at z-index -10.</p>
      </div>
      <div class="mt-8 flex items-center gap-4 text-sm text-slate-400 before:h-px before:flex-1 before:bg-slate-200 before:content-[''] after:h-px after:flex-1 after:bg-slate-200 after:content-['']">OR</div>
      <button class="relative mt-6 w-full rounded-lg bg-slate-900 py-3 text-sm font-semibold text-white">
        Continue
        <span class="absolute -right-2 -top-2 flex h-5 w-5 items-center justify-center rounded-full bg-red-500 text-[10px]">3</span>
      </button>
      <select class="mt-6 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm">
        <option>Europe/Berlin</option>
      </select>
    </div>
  </div>
</div>
