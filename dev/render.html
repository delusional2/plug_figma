<!doctype html>
<meta charset="utf-8">
<title>render</title>
<style>
  html, body { margin: 0; background: #fff; }
  .n { position: absolute; box-sizing: border-box; }
  .layer { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
  svg.paint { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: inherit; overflow: hidden; }
</style>
<script>
// Draws the plugin's layer tree back as HTML, following Figma semantics as closely
// as CSS allows (auto layout → flex, inside strokes → overlay, Figma gradient
// transforms → SVG gradients in bounding-box space, text auto-resize modes).
// It never reads the original page: any difference with the original screenshot
// comes from what the plugin extracted (or from this emulation's approximations).
let gid = 0;
const rgba = (c, a = 1) => `rgba(${Math.round(c.r * 255)},${Math.round(c.g * 255)},${Math.round(c.b * 255)},${(c.a == null ? 1 : c.a) * a})`;

function invert(m) {
  const [[a, b, c], [d, e, f]] = m;
  const det = a * e - b * d;
  return [[e / det, -b / det, (b * f - c * e) / det], [-d / det, a / det, (c * d - a * f) / det]];
}

function paintLayer(p, images) {
  if (p.type === 'SOLID') {
    const d = document.createElement('div');
    d.className = 'layer';
    d.style.background = rgba(p.color, p.opacity == null ? 1 : p.opacity);
    return d;
  }
  if (p.type === 'IMAGE') {
    const d = document.createElement('div');
    d.className = 'layer';
    const src = images[p.ref];
    if (src) {
      d.style.backgroundImage = `url("${src}")`;
      d.style.backgroundSize = p.scaleMode === 'FIT' ? 'contain' : 'cover';
      d.style.backgroundPosition = 'center';
      d.style.backgroundRepeat = 'no-repeat';
    } else d.style.background = '#dbdbe0';
    return d;
  }
  if (p.type === 'GRADIENT_ANGULAR') {
    // Gradient space centre (0.5, 0.5), start along +x, clockwise (y down).
    const inv = invert(p.gradientTransform);
    const ap = (x, y) => [inv[0][0] * x + inv[0][1] * y + inv[0][2], inv[1][0] * x + inv[1][1] * y + inv[1][2]];
    const c = ap(0.5, 0.5), e = ap(1, 0.5);
    const d = document.createElement('div');
    d.className = 'layer';
    d.dataset.conic = '1';
    d.style.setProperty('--cx', c[0] * 100 + '%');
    d.style.setProperty('--cy', c[1] * 100 + '%');
    d.dataset.dir = JSON.stringify([e[0] - c[0], e[1] - c[1]]);
    d.dataset.stops = p.gradientStops.map((s) => `${rgba(s.color)} ${s.position * 360}deg`).join(', ');
    return d;
  }
  if (/^GRADIENT_/.test(p.type)) {
    const id = 'g' + (++gid);
    const inv = invert(p.gradientTransform);
    const mat = `matrix(${inv[0][0]} ${inv[1][0]} ${inv[0][1]} ${inv[1][1]} ${inv[0][2]} ${inv[1][2]})`;
    const stops = p.gradientStops.map((s) => `<stop offset="${s.position}" stop-color="${rgba({ ...s.color, a: 1 })}" stop-opacity="${s.color.a}"/>`).join('');
    let def;
    if (p.type === 'GRADIENT_LINEAR') def = `<linearGradient id="${id}" gradientUnits="objectBoundingBox" x1="0" y1="0.5" x2="1" y2="0.5" gradientTransform="${mat}">${stops}</linearGradient>`;
    else def = `<radialGradient id="${id}" gradientUnits="objectBoundingBox" cx="0.5" cy="0.5" r="0.5" gradientTransform="${mat}">${stops}</radialGradient>`;
    const wrap = document.createElement('div');
    wrap.className = 'layer';
    wrap.style.overflow = 'hidden';
    wrap.innerHTML = `<svg class="paint" preserveAspectRatio="none" viewBox="0 0 1 1"><defs>${def}</defs><rect width="1" height="1" fill="url(#${id})"/></svg>`;
    return wrap;
  }
  return null;
}

function cssPaint(p) {
  if (!p) return 'transparent';
  if (p.type === 'SOLID') return rgba(p.color, p.opacity == null ? 1 : p.opacity);
  if (p.gradientStops) return rgba(p.gradientStops[0].color);
  return '#000';
}

function shadows(effects, alphaShape) {
  const out = [];
  let filter = '', backdrop = '';
  for (const e of effects || []) {
    // showShadowBehindNode: Figma casts it from the layer's alpha, like CSS drop-shadow().
    if (e.type === 'DROP_SHADOW' && (e.showShadowBehindNode || alphaShape)) filter += ` drop-shadow(${e.offset.x}px ${e.offset.y}px ${e.radius}px ${rgba(e.color)})`;
    else if (e.type === 'DROP_SHADOW') out.push(`${e.offset.x}px ${e.offset.y}px ${e.radius}px ${e.spread || 0}px ${rgba(e.color)}`);
    if (e.type === 'INNER_SHADOW') out.push(`inset ${e.offset.x}px ${e.offset.y}px ${e.radius}px ${e.spread || 0}px ${rgba(e.color)}`);
    if (e.type === 'LAYER_BLUR') filter += ` blur(${e.radius / 2}px)`;
    if (e.type === 'BACKGROUND_BLUR') backdrop = `blur(${e.radius / 2}px)`;
  }
  return { boxShadow: out.join(', '), filter, backdrop };
}

function textGradientCss(p) {
  // Approximation for gradient text: direction from the transform, stops as-is.
  const inv = invert(p.gradientTransform);
  const sx = inv[0][1] * 0.5 + inv[0][2], sy = inv[1][1] * 0.5 + inv[1][2];
  const ex = inv[0][0] + sx, ey = inv[1][0] + sy;
  const ang = Math.atan2(ex - sx, -(ey - sy)) * 180 / Math.PI;
  return `linear-gradient(${ang}deg, ${p.gradientStops.map((s) => `${rgba(s.color)} ${s.position * 100}%`).join(', ')})`;
}

function build(n, parent, images) {
  const el = document.createElement('div');
  el.className = 'n';
  el.dataset.type = n.type;
  if (n.name) el.dataset.name = n.name;
  const inLayout = parent && parent.layout && !n.absolute;
  if (inLayout) {
    el.style.position = 'relative';
    el.style.flex = 'none';
    if (n.stretch) el.style.alignSelf = 'stretch';
    // layoutGrow: at import time Figma's fill gives the measured size (equal fills,
    // or the only fill taking the rest), which is what the fixed size already draws.
    // Figma allows a negative itemSpacing, CSS gap does not.
    if (parent.layout.spacing < 0 && parent.flowCount++ > 0) el.style[parent.layout.mode === 'HORIZONTAL' ? 'marginLeft' : 'marginTop'] = parent.layout.spacing + 'px';
  } else {
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
  }
  if (typeof n.opacity === 'number') el.style.opacity = n.opacity;
  if (n.xf && !inLayout) {
    el.style.left = n.xf.tx + 'px';
    el.style.top = n.xf.ty + 'px';
    el.style.transformOrigin = '0 0';
    el.style.transform = `matrix(${n.xf.a}, ${n.xf.b}, ${n.xf.c}, ${n.xf.d}, 0, 0)`;
  }
  if (parent && parent.layout && parent.layout.reverseZ) el.style.zIndex = String(1000 - (parent.zi = (parent.zi || 0) + 1));

  if (n.type === 'TEXT') {
    el.style.whiteSpace = n.autoResize === 'WIDTH_AND_HEIGHT' ? 'pre' : 'pre-wrap';
    el.style.overflowWrap = 'break-word';
    if (n.autoResize !== 'WIDTH_AND_HEIGHT' || n.truncate) {
      const horizontalParent = inLayout && parent.layout.mode === 'HORIZONTAL';
      if (!(n.stretch && inLayout && parent.layout.mode === 'VERTICAL')) el.style.width = n.w + 'px';
      if (n.stretch && horizontalParent) el.style.height = 'auto';
    }
    el.style.textAlign = { LEFT: 'left', CENTER: 'center', RIGHT: 'right', JUSTIFIED: 'justify' }[n.align] || 'left';
    for (const s of n.segments) {
      const span = document.createElement('span');
      span.textContent = s.text;
      span.style.fontFamily = s.font.families.map((f) => (/^[\w-]+$/.test(f) && /^(serif|sans-serif|monospace|system-ui|cursive|fantasy|ui-\w+|-apple-system)$/.test(f) ? f : `"${f}"`)).join(', ');
      span.style.fontWeight = s.font.weight;
      span.style.fontStyle = s.font.italic ? 'italic' : 'normal';
      span.style.fontSize = s.size + 'px';
      span.style.lineHeight = s.lineHeight ? s.lineHeight + 'px' : 'normal';
      span.style.letterSpacing = (s.letterSpacing || 0) + 'px';
      if (s.textCase) span.style.textTransform = { UPPER: 'uppercase', LOWER: 'lowercase', TITLE: 'capitalize' }[s.textCase];
      if (s.decoration) span.style.textDecoration = s.decoration === 'UNDERLINE' ? 'underline' : 'line-through';
      if (s.fill && /^GRADIENT/.test(s.fill.type)) {
        span.style.backgroundImage = textGradientCss(s.fill);
        span.style.webkitBackgroundClip = 'text';
        span.style.backgroundClip = 'text';
        span.style.color = 'transparent';
      } else span.style.color = cssPaint(s.fill);
      el.appendChild(span);
    }
    // Figma textTruncation ENDING + maxLines.
    if (n.truncate === 1) {
      el.style.whiteSpace = 'nowrap';
      el.style.overflow = 'hidden';
      el.style.textOverflow = 'ellipsis';
    } else if (n.truncate > 1) {
      el.style.display = '-webkit-box';
      el.style.webkitBoxOrient = 'vertical';
      el.style.webkitLineClamp = String(n.truncate);
      el.style.overflow = 'hidden';
    }
    if (n.effects && n.effects.length) {
      el.style.textShadow = n.effects.filter((e) => e.type === 'DROP_SHADOW')
        .map((e) => `${e.offset.x}px ${e.offset.y}px ${e.radius}px ${rgba(e.color)}`).join(', ');
    }
    // A block-level line box: the strut uses the first segment's metrics, like Figma.
    const s0 = n.segments[0];
    el.style.fontSize = s0.size + 'px';
    el.style.lineHeight = s0.lineHeight ? s0.lineHeight + 'px' : 'normal';
    el.style.fontFamily = el.firstChild.style.fontFamily;
    parent ? parent.el.appendChild(el) : document.body.appendChild(el);
    return;
  }

  if (n.type === 'SVG') {
    el.style.width = n.w + 'px';
    el.style.height = n.h + 'px';
    // Like Figma's importer: an isolated document (no ids from other SVGs of the
    // page, no page CSS) that knows hex/rgb/hsl colors only.
    const svgText = n.svg.replace(/(?:oklch|oklab|lab|lch|color|hwb)\([^()]*\)/gi, '#000000');
    const img = document.createElement('img');
    img.style.display = 'block';
    img.style.width = n.w + 'px';
    img.style.height = n.h + 'px';
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText);
    const sfx = shadows(n.effects);
    if (sfx.filter) img.style.filter = sfx.filter;
    el.appendChild(img);
    parent ? parent.el.appendChild(el) : document.body.appendChild(el);
    return;
  }

  // FRAME / RECT / ELLIPSE / VECTOR
  el.style.width = n.w + 'px';
  el.style.height = n.h + 'px';
  if (n.radii) el.style.borderRadius = `${n.radii.tl}px ${n.radii.tr}px ${n.radii.br}px ${n.radii.bl}px`;
  if (n.type === 'ELLIPSE') el.style.borderRadius = '50%';
  if (n.type === 'VECTOR') el.style.clipPath = `path(${n.rule === 'EVENODD' ? 'evenodd, ' : ''}'${n.d}')`;
  // A frame without paint casts its shadow from its content, like Figma.
  const fx = shadows(n.effects, n.type === 'FRAME' && !(n.fills || []).length && !n.stroke);
  if (fx.boxShadow) el.style.boxShadow = fx.boxShadow;
  if (fx.filter) el.style.filter = fx.filter;
  if (fx.backdrop) el.style.backdropFilter = fx.backdrop;
  if (n.clip) el.style.overflow = 'hidden';
  for (const p of n.fills || []) {
    const l = paintLayer(p, images);
    if (l) el.appendChild(l);
  }
  if (n.stroke) {
    const s = document.createElement('div');
    s.className = 'layer';
    s.style.boxSizing = 'border-box';
    const w = n.stroke.weights;
    s.style.borderStyle = n.stroke.dash ? (n.stroke.dash[0] === n.stroke.dash[1] ? 'dotted' : 'dashed') : 'solid';
    s.style.borderColor = cssPaint(n.stroke.paint);
    s.style.borderWidth = `${w.t}px ${w.r}px ${w.b}px ${w.l}px`;
    if (n.type === 'ELLIPSE') s.style.borderRadius = '50%';
    if (n.stroke.align === 'OUTSIDE') {
      s.style.inset = `${-w.t}px ${-w.r}px ${-w.b}px ${-w.l}px`;
      if (n.radii) s.style.borderRadius = `${n.radii.tl + w.t}px ${n.radii.tr + w.t}px ${n.radii.br + w.t}px ${n.radii.bl + w.t}px`;
    }
    s.style.zIndex = 1;
    el.appendChild(s);
  }
  const l = n.layout;
  if (l) {
    el.style.display = 'flex';
    el.style.flexDirection = l.mode === 'HORIZONTAL' ? 'row' : 'column';
    el.style.padding = `${l.pt}px ${l.pr}px ${l.pb}px ${l.pl}px`;
    el.style.gap = Math.max(0, l.spacing) + 'px';
    el.style.justifyContent = { MIN: 'flex-start', MAX: 'flex-end', CENTER: 'center', SPACE_BETWEEN: 'space-between' }[l.primaryAlign];
    el.style.alignItems = { MIN: 'flex-start', MAX: 'flex-end', CENTER: 'center', BASELINE: 'baseline' }[l.counterAlign];
    if (l.primarySizing === 'AUTO') {
      if (l.mode === 'VERTICAL') el.style.height = 'auto';
      else el.style.width = 'auto';
    }
    if (l.counterSizing === 'AUTO') {
      if (l.mode === 'VERTICAL') el.style.width = 'auto';
      else el.style.height = 'auto';
    }
  }
  if (n.stretch && inLayout) {
    if (parent.layout.mode === 'VERTICAL') el.style.width = 'auto';
    else el.style.height = 'auto';
  }
  parent ? parent.el.appendChild(el) : document.body.appendChild(el);
  const self = { el, layout: l, flowCount: 0 };
  for (const c of n.children || []) {
    if (c.isMask) { applyMask(el, c, images); continue; }
    build(c, self, images);
  }
}

// Figma masks clip the layers above them: emulate on the parent element.
function applyMask(el, m, images) {
  if (m.maskType === 'VECTOR') {
    let clip;
    if (m.type === 'VECTOR') {
      let i = 0;
      const d = m.d.replace(/-?[\d.]+(?:e-?\d+)?/g, (v) => String(+v + (i++ % 2 ? m.y : m.x)));
      clip = `path(${m.rule === 'EVENODD' ? 'evenodd, ' : ''}'${d}')`;
    } else if (m.type === 'ELLIPSE') clip = `ellipse(${m.w / 2}px ${m.h / 2}px at ${m.x + m.w / 2}px ${m.y + m.h / 2}px)`;
    else {
      const r = m.radii ? ` round ${m.radii.tl}px` : '';
      clip = `inset(${m.y}px calc(100% - ${m.x + m.w}px) calc(100% - ${m.y + m.h}px) ${m.x}px${r})`;
    }
    el.style.clipPath = clip;
    return;
  }
  const p = (m.fills || [])[0];
  if (!p) return;
  let url = null, size = '100% 100%';
  if (p.type === 'IMAGE' && images[p.ref]) { url = images[p.ref]; size = p.scaleMode === 'FIT' ? 'contain' : 'cover'; }
  else if (p.gradientStops) {
    const layer = paintLayer(p, images);
    const svg = layer.querySelector('svg');
    if (svg) { svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg'); url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.outerHTML); }
  }
  if (!url) return;
  for (const k of ['maskImage', 'webkitMaskImage']) el.style[k] = `url("${url}")`;
  for (const k of ['maskSize', 'webkitMaskSize']) el.style[k] = size;
  for (const k of ['maskRepeat', 'webkitMaskRepeat']) el.style[k] = 'no-repeat';
  for (const k of ['maskPosition', 'webkitMaskPosition']) el.style[k] = `${m.x}px ${m.y}px`;
}

window.renderTree = async (json) => {
  const doc = typeof json === 'string' ? JSON.parse(json) : json;
  const images = {};
  for (const im of doc.images || []) {
    if (im.bytes) {
      const bin = atob(im.bytes);
      const u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      images[im.ref] = URL.createObjectURL(new Blob([u8]));
    } else if (im.url) images[im.ref] = im.url;
  }
  document.body.innerHTML = '';
  // Figma ships every Google Font, so load the families the tree asks for.
  // Google rejects a whole css2 request when one axis range or tuple doesn't
  // exist for the family, so try a fallback chain per family (fetched, not <link>).
  const used = new Map(); // family -> Set of "ital,wght"
  (function walk(n) {
    if (n.segments) for (const s of n.segments) {
      const t = (s.font.italic ? 1 : 0) + ',' + Math.min(1000, Math.max(1, Math.round(s.font.weight || 400)));
      for (const f of s.font.families) { if (!used.has(f)) used.set(f, new Set()); used.get(f).add(t); }
    }
    (n.children || []).forEach(walk);
  })(doc.root);
  const generic = /^(serif|sans-serif|monospace|system-ui|cursive|fantasy|ui-[\w-]+|-apple-system|blinkmacsystemfont|segoe ui|arial|helvetica|helvetica neue|times new roman|georgia|menlo|monaco|consolas|courier new|apple color emoji|segoe ui emoji|noto color emoji)$/i;
  const G = 'https://fonts.googleapis.com/css2?display=block&family=';
  const get = (q) => fetch(G + q).then((r) => (r.ok ? r.text() : Promise.reject(r.status)));
  window.__missingFonts = [];
  async function loadFamily(f) {
    const e = encodeURIComponent(f);
    const tuples = [...used.get(f)];
    const css = [];
    for (const q of [e + ':ital,wght@0,100..900;1,100..900', e + ':wght@100..900']) {
      try { css.push(await get(q)); break; } catch (_) {}
    }
    // Static families, or italics missing from the range request: each tuple on its own.
    if (!css.length || tuples.some((t) => t[0] === '1')) {
      const r = await Promise.allSettled(tuples.map((t) => get(e + ':ital,wght@' + t)));
      r.forEach((x) => { if (x.status === 'fulfilled') css.push(x.value); });
    }
    if (!css.length) { try { css.push(await get(e)); } catch (_) {} }
    if (!css.length) { window.__missingFonts.push(f); return; }
    const st = document.createElement('style');
    st.textContent = css.join('\n');
    document.head.appendChild(st);
  }
  const links = [...used.keys()].filter((f) => !generic.test(f)).map((f) => loadFamily(f).catch(() => {}));
  await Promise.race([Promise.all(links), new Promise((r) => setTimeout(r, 8000))]);
  build(doc.root, null, images);
  await document.fonts.ready;
  await Promise.all([...document.querySelectorAll('.layer')].map((d) => {
    const m = /url\("(.+)"\)/.exec(d.style.backgroundImage);
    if (!m) return null;
    return new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = m[1]; });
  }));
  await Promise.all([...document.querySelectorAll('img')].map((i) => (i.complete ? null : new Promise((r) => { i.onload = i.onerror = r; }))));
  for (const d of document.querySelectorAll('[data-conic]')) {
    const dir = JSON.parse(d.dataset.dir);
    const w = d.offsetWidth || 1, h = d.offsetHeight || 1;
    const ang = Math.atan2(dir[0] * w, -dir[1] * h) * 180 / Math.PI;
    d.style.background = `conic-gradient(from ${ang}deg at var(--cx) var(--cy), ${d.dataset.stops})`;
  }
  const root = document.body.firstElementChild;
  return { w: root.offsetWidth, h: root.offsetHeight };
};
</script>
