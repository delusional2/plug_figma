<!doctype html>
<meta charset="utf-8">
<title>runner</title>
<style>body { margin: 0; } iframe { position: fixed; left: 0; top: 0; border: 0; }</style>
<script>
// Runs the plugin's page agent on one case the same way ui.html does:
// opaque-origin sandboxed iframe + injected agent + postMessage round trip.
// Result lands in window.__result (JSON string, image bytes as base64).
(async () => {
  const q = new URLSearchParams(location.search);
  const width = +q.get('w') || 1440;
  const height = +q.get('h') || 900;
  const opts = { width, height, autoLayout: q.get('al') !== '0', images: q.get('img') !== '0' };
  try {
    const ui = await (await fetch('../ui.html')).text();
    // The plugin's first <script>: the page agent plus prepareHtml() and friends.
    const firstScript = /<script>\n([\s\S]*?)<\/script>/.exec(ui)[1];
    const { prepareHtml } = new Function(firstScript + '\n;return { prepareHtml };')();
    const html = prepareHtml(await (await fetch(q.get('case'))).text(), { agent: true }).html;
    const frame = document.createElement('iframe');
    frame.setAttribute('sandbox', 'allow-scripts');
    frame.style.colorScheme = 'light';
    frame.style.width = width + 'px';
    frame.style.height = height + 'px';
    document.body.appendChild(frame);
    // Same handshake as ui.html renderAndExtract(): listen first, ask on load, expect an ack.
    const result = await new Promise((resolve, reject) => {
      let acked = false;
      addEventListener('message', (e) => {
        if (e.source !== frame.contentWindow || !e.data || e.data.h2f !== true) return;
        if (e.data.kind === 'ack') acked = true;
        if (e.data.kind === 'result') resolve(e.data);
        if (e.data.kind === 'error') reject(new Error(e.data.message));
      });
      const ask = () => {
        frame.contentWindow.postMessage({ h2f: 'extract', opts }, '*');
        setTimeout(() => { if (!acked) reject(new Error('agent did not start (no ack)')); }, 8000);
      };
      let asked = false;
      const once = () => { if (!asked) { asked = true; ask(); } };
      setTimeout(once, 30000);
      frame.onload = once;
      frame.srcdoc = html;
    });
    const b64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
    window.__result = JSON.stringify({ name: result.root.name, root: result.root, images: result.images.map((im) => ({ ref: im.ref, url: im.url, bytes: im.bytes ? b64(im.bytes) : null, slow: im.slow })), warnings: result.warnings });
  } catch (err) {
    window.__result = JSON.stringify({ error: String(err && err.stack || err) });
  }
})();
</script>
